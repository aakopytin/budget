        if (OXR_PIDS[item.project_id]) rOut = 0;  // офисные расходы: НДС не планируется
        var vatEst = Math.round((item.total || 0) * rOut);
        var vatReal = ebPmVatMap[item.id] || 0;              // факт из PLS 3144
        var vatDiff = vatReal - vatEst;
        tgt.vatOutPlan += vatDiff;
        // Синхронизируем разбивку по проектам: без этого sum(vatOutPlanByProj) ≠ vatOutPlan
        var pn5d = PID_MAP[item.project_id] || 'Прочие проекты ИКП';
        tgt.vatOutPlanByProj[pn5d] = (tgt.vatOutPlanByProj[pn5d] || 0) + vatDiff;
      }
    });

    // ── Шаг 6: итоговые значения — факт / факт+остаток / план ────────────
    data.forEach(function(col) {
      if (col.isPast) {
        col.inc    = col.incFact;
        col.exp    = col.expFact;
        col.vatIn  = col.vatInFact;
        col.vatOut = col.vatOutFact;
      } else if (col.isCurrent) {
        col.inc   = col.incPlan > 0 ? Math.max(col.incFact, col.incPlan) : col.incFact;
        col.vatIn = col.vatInPlan > 0 ? Math.max(col.vatInFact, col.vatInPlan) : col.vatInFact;
        var remExp  = Math.max(0, col.expPlan - col.expFact);  // остаток плана по всем фактическим (как в верхней таблице)
        col.exp     = col.expFact + remExp;
        // Симметрично vatIn: max(fact, plan) — не меняется при вводе новых расходов, пока факт < плана
        col.vatOut  = col.vatOutPlan > 0 ? Math.max(col.vatOutFact, col.vatOutPlan) : col.vatOutFact;
      } else {
        col.inc    = col.incPlan;
        col.exp    = col.expPlan;
        col.vatIn  = col.vatInPlan;
        col.vatOut = col.vatOutPlan;
      }
    });
    dal.inc    = dal.incPlan;
    dal.exp    = dal.expPlan;
    dal.vatIn  = dal.vatInPlan;
    dal.vatOut = dal.vatOutPlan;

    var pls3144all    = (plsItems||[]).filter(function(p){return p.category_id===3144;});
    var pls3144count  = pls3144all.length;
    var pls3144tr     = pls3144all.filter(function(p){return p.project_id===TR_PID;});
    var pls3144trSum  = pls3144tr.reduce(function(s,p){return s+(parseFloat(p.outcome)||0);},0);
    var pmMapKeys     = Object.keys(planMoneyTypeMap).length;

    // Корректировка НДС: project_id=36 (Проект Корректировки НДС), org_account_id=149.
    // type=30 (доход = возврат НДС), type=40 (расход = НДС к уплате).
    // Диапазон: от начала текущего квартала до конца горизонта прогноза (включая dal).
    var vatAdjInc = 0, vatAdjExp = 0;
    var qStartYM = curYear * 100 + q0m;
    (planItems || []).forEach(function(item) {
      if (item.project_id !== 36) return;
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0,4)) * 100 + parseInt(dt.slice(5,7));
      if (pYM < qStartYM) return;  // раньше текущего квартала — не берём
      if (item.type === 30) vatAdjInc += parseFloat(item.total) || 0;
      if (item.type === 40) vatAdjExp += parseFloat(item.total) || 0;
    });
    var vatAdj = vatAdjInc - vatAdjExp;  // положительное = чистый возврат НДС (снижает к уплате)

    // Агрегаты Факт/ИТОГО по НДС — для сводной карточки
    var vfFVI = 0, vfFVO = 0, vfTVI = 0, vfTVO = 0;
    data.forEach(function(c) {
      vfTVI += c.vatIn; vfTVO += c.vatOut;
      if (c.isPast || c.isCurrent) { vfFVI += c.vatInFact; vfFVO += c.vatOutFact; }
    });
    vfTVI += dal.vatIn; vfTVO += dal.vatOut;
    // Формула: -НДС_поступлений + НДС_выплат + Корректировка_НДС.
    // Корректировка — только плановая: в Факт не входит, в ИТОГО входит.
    var vfFactVatRes  = -vfFVI + vfFVO;
    var vfItogoVatRes = -vfTVI + vfTVO + vatAdj;

    return {data: data, dal: dal, cols: cols, curYM: curYM, q0m: q0m, dalYM: dalYM,
            effRates: effRates, effExpByType: effExpByType, effVatByType: effVatByType,
            pls3144count: pls3144count, pls3144trSum: pls3144trSum,
            pmMapKeys: pmMapKeys, effQLabel: effQLabel,
            rejectedIncCats: rejectedIncCats,
            vatAdj: vatAdj,
            vfFactVatRes: vfFactVatRes,
            vfItogoVatRes: vfItogoVatRes,
            vfEbVatAdj: vfEbVatAdj, ebPmVatMap: ebPmVatMap, paidPmIds: paidPmIds, paidPmAmts: paidPmAmts, vfEbExpAdj: vfEbExpAdj,
            expFactCurByProj: expFactCurByProj,
            planMoneySubTypeMap: planMoneySubTypeMap};
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // СВОДНАЯ КАРТОЧКА — прогноз движения денежных средств (над Сводным отчётом)
  // ═══════════════════════════════════════════════════════════════════════════
  function buildSummaryCard(sd) {
    var K = 1000;
    function fK(v) {
      if (v === null || v === undefined) return '<span style="color:#9ca3af">—</span>';
      var abs = Math.round(Math.abs(v) / K);
      var s = abs.toLocaleString('ru-RU');
      if (v === 0) return '<span style="color:#9ca3af">0</span>';
      var clr = v < 0 ? '#dc2626' : '#15803d';
      var sgn = v < 0 ? '−' : '+';
      return '<span style="color:' + clr + ';font-weight:600">' + sgn + '&thinsp;' + s + '</span>';
    }
    function fKbal(v) {  // для остатка ДС: без знака, просто число
      var abs = Math.round(Math.abs(v) / K);
      var s = abs.toLocaleString('ru-RU');
      var clr = v < 0 ? '#dc2626' : '#1d4ed8';
      return '<span style="color:' + clr + ';font-weight:700">' + s + '</span>';
    }
    var CS = 'border-collapse:collapse;font-family:sans-serif;font-size:12px';
    var row = function(label, valHtml, bg, bTop) {
      var bgS  = bg   ? 'background:' + bg + ';' : '';
      var btS  = bTop ? 'border-top:2px solid #9ca3af;' : 'border-top:1px solid #f0f0f0;';
      return '<tr style="' + bgS + '">'
        + '<td style="padding:5px 14px 5px 8px;' + btS + 'white-space:nowrap;color:#374151">' + label + '</td>'
        + '<td style="padding:5px 8px;text-align:right;' + btS + 'white-space:nowrap">' + valHtml + '</td>'
        + '</tr>';
    };
    var planned = sd.cashBalance + sd.incOst - sd.expOst + sd.finOst + sd.vatFact + sd.vatPlan - sd.reserve;
    return '<div style="margin-bottom:20px">'
      + '<div style="font-size:10px;font-weight:700;color:#6b7280;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px">Прогноз движения денежных средств</div>'
      + '<table style="' + CS + '">'
      + row('Остаток денежных средств на ' + sd.dateStr, fKbal(sd.cashBalance), '', false)
      + row('Ожидаемые приходы',      fK(sd.incOst),           '', false)
      + row('Ожидаемые расходы',      fK(-sd.expOst),          '', false)
      + row('Ожидаемые займы',        fK(sd.finOst),           '', false)
      + row('Ожидаемый текущий НДС',  fK(sd.vatFact),          '', false)
      + row('Ожидаемый плановый НДС', fK(sd.vatPlan),          '', false)
      + row('Изменение резерва',      fK(-sd.reserve),         '#fefce8', false)
      + row('<strong>Контрольная сумма</strong>', '<strong>' + fK(planned) + '</strong>', '#f0fdf4', true)
      + '</table></div>';
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // НДС ПРОГНОЗ — РАЗБИВКА ПО СТАТЬЯМ (новая таблица по Макету9)
  // Колонки: Строка | Субстатья | Остаток | НДС Прогноз | НДС Факт тек.квартал
  // ═══════════════════════════════════════════════════════════════════════════
  function buildVatForecastTable2(vf, pm, factResult, offBrkPlan, epBrkPlan) {
    if (!vf || !pm || !factResult) return '';
    var acc2     = factResult.acc;
    var SUBTYPES = ['mat','smr','smrZ','other'];
    var SUBTYPE_LABELS = {mat:'Материалы', smr:'СМР с НДС', smrZ:'СМР без НДС', other:'Прочие'};
    function zeroByType() { return {mat:0,smr:0,smrZ:0,other:0}; }

    // ── Факт НДС текущего квартала (прошлые + текущий месяц) ──
    var factVatInByProj = {};
    var factVatOutByProjByType = {};
    (vf.data || []).forEach(function(c) {
      if (!c.isPast && !c.isCurrent) return;
      Object.keys(c.vatInByProj || {}).forEach(function(pn) {
        factVatInByProj[pn] = (factVatInByProj[pn] || 0) + c.vatInByProj[pn];
      });
      Object.keys(c.vatOutByProjByType || {}).forEach(function(pn) {
        if (!factVatOutByProjByType[pn]) factVatOutByProjByType[pn] = zeroByType();
        SUBTYPES.forEach(function(s) {
          factVatOutByProjByType[pn][s] += ((c.vatOutByProjByType[pn] || {})[s] || 0);
        });
      });
    });

    // ── Прогноз НДС (остаток плана) ──
    // Прошлые месяцы: 0; текущий: max(0, plan - fact) по субтипу; будущие + dal: plan целиком.
    var progVatInByProj = {};
    var progVatOutByProjByType = {};
    (vf.data || []).forEach(function(c) {
      if (c.isPast) return;
      if (c.isCurrent) {
        Object.keys(c.vatInPlanByProj || {}).forEach(function(pn) {
          var rem = Math.max(0, (c.vatInPlanByProj[pn] || 0) - (c.vatInByProj ? (c.vatInByProj[pn] || 0) : 0));
          if (rem) progVatInByProj[pn] = (progVatInByProj[pn] || 0) + rem;
        });
        Object.keys(c.vatOutPlanByProjByType || {}).forEach(function(pn) {
          if (!progVatOutByProjByType[pn]) progVatOutByProjByType[pn] = zeroByType();
          var factBT = (c.vatOutByProjByType || {})[pn] || {};
          SUBTYPES.forEach(function(s) {
            var rem2 = Math.max(0, ((c.vatOutPlanByProjByType[pn] || {})[s] || 0) - (factBT[s] || 0));
            progVatOutByProjByType[pn][s] += rem2;
          });
        });
      } else {
        Object.keys(c.vatInPlanByProj || {}).forEach(function(pn) {
          progVatInByProj[pn] = (progVatInByProj[pn] || 0) + (c.vatInPlanByProj[pn] || 0);
        });
        Object.keys(c.vatOutPlanByProjByType || {}).forEach(function(pn) {
          if (!progVatOutByProjByType[pn]) progVatOutByProjByType[pn] = zeroByType();
          SUBTYPES.forEach(function(s) {
            progVatOutByProjByType[pn][s] += ((c.vatOutPlanByProjByType[pn] || {})[s] || 0);
          });
        });
      }
    });
    Object.keys(vf.dal.vatInPlanByProj || {}).forEach(function(pn) {
      progVatInByProj[pn] = (progVatInByProj[pn] || 0) + (vf.dal.vatInPlanByProj[pn] || 0);
    });
    Object.keys(vf.dal.vatOutPlanByProjByType || {}).forEach(function(pn) {
      if (!progVatOutByProjByType[pn]) progVatOutByProjByType[pn] = zeroByType();
      SUBTYPES.forEach(function(s) {
        progVatOutByProjByType[pn][s] += ((vf.dal.vatOutPlanByProjByType[pn] || {})[s] || 0);
      });
    });

    // ── Остаток по проекту (совпадает с основной таблицей) ──
    function projOst2(p, type) {
      var d = pm[p], a = acc2[p];
      if (!d || !a) return 0;
      var b = type === 'inc'
        ? a.i25 + (a.i26 - a.iCur) + d.bi_plan
        : a.e25 + (a.e26 - a.eCur) + d.be_plan;
      var planPart = type === 'inc' ? d.bi_plan : d.be_plan;
      var eb = type === 'inc' ? (d.bi_eb || 0) : (d.be_eb || 0);
      var fact = type === 'inc' ? a.i25 + a.i26 : a.e25 + a.e26;
      return (b + eb === 0 || (!planPart && !eb)) ? 0 : b + eb - fact;
    }
    function projOstByType2(p, st) {
      var d = pm[p], a = acc2[p];
      if (!d || !a) return 0;
      return ((d.bePlanByType || {})[st] || 0) + ((d.beEbByType || {})[st] || 0) - ((a.eCurByType || {})[st] || 0);
    }
    function groupOst2(projName) {
      var d = pm[projName], a = acc2[projName];
      if (!d || !a) return 0;
      var b = a.e25 + (a.e26 - a.eCur) + d.be_plan;
      var eb = d.be_eb || 0, fact = a.e25 + a.e26;
      return (b + eb === 0 || (!d.be_plan && !eb)) ? 0 : b + eb - fact;
    }

    // ── Форматирование ──
    function fk2(v) {
      var n = Math.round((v || 0) / 1000);
      if (!n) return '<span style="color:#d1d5db">—</span>';
      return new Intl.NumberFormat('ru-RU').format(n);
    }
    function fkSign(v) {
      var n = Math.round((v || 0) / 1000);
      if (!n) return '<span style="color:#d1d5db">—</span>';
      var clr = v > 0 ? '#15803d' : '#dc2626';
      return '<span style="color:' + clr + ';font-weight:600">' + new Intl.NumberFormat('ru-RU').format(n) + '</span>';
    }

    var CS2 = 'border-collapse:collapse;width:auto;min-width:500px;font-family:sans-serif;font-size:11px';
    var TH2  = 'padding:3px 7px;font-size:10px;font-weight:600;color:#374151;border-bottom:2px solid #9ca3af;text-align:right;white-space:nowrap;background:#f8f9fd';
    var THL2 = TH2 + ';text-align:left;width:150px';
    var THS2 = TH2 + ';text-align:left;width:110px';
    var tdL  = function(v,bg){ return '<td style="padding:2px 7px;font-size:11px;border-bottom:1px solid #f0f0f0;color:#374151' + (bg?';background:'+bg:'') + '">' + v + '</td>'; };
    var tdLs = function(v)   { return '<td style="padding:1px 7px 1px 20px;font-size:10px;border-bottom:1px solid #f8f8f8;color:#78716c">' + v + '</td>'; };
    var tdR  = function(v,sty){ return '<td style="padding:2px 7px;font-size:11px;border-bottom:1px solid #f0f0f0;text-align:right' + (sty||'') + '">' + v + '</td>'; };
    var tdRs = function(v,sty){ return '<td style="padding:1px 7px;font-size:10px;border-bottom:1px solid #f8f8f8;text-align:right' + (sty||'') + '">' + v + '</td>'; };
    var tdTot= function(v,sty){ return '<td style="padding:3px 7px;font-size:11px;font-weight:700;border-top:2px solid #9ca3af;text-align:right' + (sty||'') + '">' + v + '</td>'; };
    var tdTotL=function(v,bg) { return '<td style="padding:3px 7px;font-size:11px;font-weight:700;border-top:2px solid #9ca3af;text-align:left;background:' + (bg||'#f8f9fd') + '">' + v + '</td>'; };

    var rows2 = '';

    // === ЗАГОЛОВОК ===
    rows2 += '<tr>'
      + '<th style="' + THL2 + '">Строка</th>'
      + '<th style="' + THS2 + '">Субстатья</th>'
      + '<th style="' + TH2 + ';width:75px">Остаток</th>'
      + '<th style="' + TH2 + ';width:75px">НДС<br>Прогноз</th>'
      + '<th style="' + TH2 + ';width:75px;background:#f0f4ff">НДС Факт<br>тек.кв.</th>'
      + '</tr>';

    // ── ДОХОДЫ ──
    var totIncOst2=0, totIncVatProg2=0, totIncVatFact2=0;
    var incRows = '';
    PROJECTS.forEach(function(p) {
      if (p === 'Офис (ВСИП+ТТ)' || p === 'Внепроектные расходы') return;
      var ost    = projOst2(p, 'inc');
      var vatFa  = factVatInByProj[p] || 0;
      var vatPr  = Math.round(ost * 22/122);
      if (!ost && !vatPr && !vatFa) return;
      totIncOst2 += ost; totIncVatProg2 += vatPr; totIncVatFact2 += vatFa;
      incRows += '<tr>'
        + tdL(p) + tdL('')
        + tdR(fk2(ost))
        + tdR(fk2(vatPr), ';color:#15803d')
        + tdR(fk2(vatFa), ';background:#eff6ff')
        + '</tr>';
    });
    rows2 += '<tr style="background:#f0fdf4"><td colspan="5" style="padding:2px 7px;font-size:10px;font-weight:700;color:#166534;border-bottom:1px solid #bbf7d0;letter-spacing:0.05em">ДОХОДЫ</td></tr>';
    rows2 += incRows;
    rows2 += '<tr style="background:#f0fdf4">'
      + tdTotL('Итого доходы','#f0fdf4') + tdTot('','background:#f0fdf4')
      + tdTot(fk2(totIncOst2),'background:#f0fdf4')
      + tdTot(fk2(totIncVatProg2),';background:#f0fdf4;color:#15803d')
      + tdTot(fk2(totIncVatFact2),';background:#dcfce7')
      + '</tr>';

    // ── РАСХОДЫ ──
    var totExpOst2=0, totExpVatProg2=0, totExpVatFact2=0;
    var expRows = '';
    PROJECTS.forEach(function(p) {
      if (p === 'Офис (ВСИП+ТТ)' || p === 'Внепроектные расходы') return;
      var totOst = projOst2(p, 'exp');
      var fbt    = factVatOutByProjByType[p] || {};
      var pVatFa = SUBTYPES.reduce(function(sum,k){return sum+(fbt[k]||0);},0);
      // Compute sub-row НДС прогноз from остаток (Fixes 2 & 4: use rate × ostByType, allow negatives)
      var pVatPr = 0;
      var subRowsHtml = '';
      SUBTYPES.forEach(function(s) {
        var stOst   = projOstByType2(p, s);
        var stVatFa = fbt[s] || 0;
        var stVatPr;
        if (s === 'mat')       { stVatPr = Math.round(stOst * 22/122); }
        else if (s === 'smr')  { stVatPr = Math.round(stOst * 5/105); }
        else if (s === 'smrZ') { stVatPr = 0; }
        else {
          var planOth    = ((pm[p] && pm[p].bePlanByType) ? (pm[p].bePlanByType['other'] || 0) : 0);
          var vatPlanOth = ((progVatOutByProjByType[p] || {})['other'] || 0);
          var rateOth    = (planOth > 0 && vatPlanOth > 0) ? Math.min(vatPlanOth / planOth, 22/122) : ((vf.effRates && vf.effRates['proj_other']) || 22/122);
          stVatPr = Math.round(stOst * rateOth);
        }
        pVatPr += stVatPr;
        if (!stOst && !stVatPr && !stVatFa) return;
        subRowsHtml += '<tr>'
          + tdL('') + tdLs('· ' + SUBTYPE_LABELS[s])
          + tdRs(fk2(stOst))
          + tdRs(fk2(stVatPr), ';color:#b45309')
          + tdRs(fk2(stVatFa), ';background:#fef9c3')
          + '</tr>';
      });
      if (!totOst && !pVatPr && !pVatFa) return;
      totExpOst2 += totOst; totExpVatProg2 += pVatPr; totExpVatFact2 += pVatFa;
      // Строка проекта
      expRows += '<tr style="background:#fff7ed">'
        + tdL('<strong>' + p + '</strong>','#fff7ed') + tdL('')
        + tdR(fk2(totOst), ';font-weight:600')
        + tdR(fk2(pVatPr), ';color:#b45309;font-weight:600')
        + tdR(fk2(pVatFa), ';background:#fef9c3')
        + '</tr>';
      expRows += subRowsHtml;
    });
    // Офисные расходы
    // НДС прогноз для группового проекта (без субтипов): blended rate от плана
    function groupVatProg2(projName, ost) {
      var pbt2 = progVatOutByProjByType[projName] || {};
      var d2   = pm[projName];
      var planTot = d2 ? SUBTYPES.reduce(function(s,k){return s+((d2.bePlanByType||{})[k]||0);},0) : 0;
      var vatPlanTot = SUBTYPES.reduce(function(s,k){return s+(pbt2[k]||0);},0);
      var r = (planTot > 0 && vatPlanTot > 0) ? Math.min(vatPlanTot/planTot, 22/122) : ((vf.effRates && vf.effRates['proj_other']) || 22/122);
      return Math.round(ost * r);
    }
    function groupVatFact2(projName) {
      var fbt2 = factVatOutByProjByType[projName] || {};
      return SUBTYPES.reduce(function(s,k){return s+(fbt2[k]||0);},0);
    }
    // Офисные расходы
    var offOst2    = groupOst2('Офис (ВСИП+ТТ)');
    var offVatPr2  = groupVatProg2('Офис (ВСИП+ТТ)', offOst2);
    var offVatFa2  = groupVatFact2('Офис (ВСИП+ТТ)');
    if (offOst2 || offVatPr2 || offVatFa2) {
      expRows += '<tr>'
        + tdL('Офисные расходы') + tdL('')
        + tdR(fk2(offOst2))
        + tdR(fk2(offVatPr2), ';color:#b45309')
        + tdR(fk2(offVatFa2), ';background:#fef9c3')
        + '</tr>';
      totExpOst2 += offOst2; totExpVatProg2 += offVatPr2; totExpVatFact2 += offVatFa2;
    }
    // Внепроектные расходы
    var epOst2    = groupOst2('Внепроектные расходы');
    var epVatPr2  = groupVatProg2('Внепроектные расходы', epOst2);
    var epVatFa2  = groupVatFact2('Внепроектные расходы');
    if (epOst2 || epVatPr2 || epVatFa2) {
      expRows += '<tr>'
        + tdL('Внепроектные расходы') + tdL('')
        + tdR(fk2(epOst2))
        + tdR(fk2(epVatPr2), ';color:#b45309')
        + tdR(fk2(epVatFa2), ';background:#fef9c3')
        + '</tr>';
      totExpOst2 += epOst2; totExpVatProg2 += epVatPr2; totExpVatFact2 += epVatFa2;
    }
    rows2 += '<tr style="background:#fff7ed"><td colspan="5" style="padding:2px 7px;font-size:10px;font-weight:700;color:#92400e;border-bottom:1px solid #fed7aa;letter-spacing:0.05em">РАСХОДЫ</td></tr>';
    rows2 += expRows;
    rows2 += '<tr style="background:#fff7ed">'
      + tdTotL('Итого расходы','#fff7ed') + tdTot('','background:#fff7ed')
      + tdTot(fk2(totExpOst2),'background:#fff7ed')
      + tdTot(fk2(totExpVatProg2),';background:#fff7ed;color:#92400e')
      + tdTot(fk2(totExpVatFact2),';background:#fef9c3')
      + '</tr>';

    // ── КОРРЕКТИРОВКА НДС ──
    var vatAdj2 = vf.vatAdj || 0;
    rows2 += '<tr style="background:#fefce8">'
      + tdL('Корректировка НДС','#fefce8') + tdL('')
      + tdR('<span style="color:#d1d5db">—</span>')
      + tdR(fkSign(vatAdj2), ';font-weight:600')
      + tdR('<span style="color:#d1d5db">—</span>', ';background:#fef9c3')
      + '</tr>';

    // ── ИТОГО НДС ──
    // Формула: -НДС_доходов + НДС_расходов + Корректировка. >0 = к уплате, <0 = к получению.
    var factNet2  = -totIncVatFact2 + totExpVatFact2;
    var progNet2  = -totIncVatProg2 + totExpVatProg2 + vatAdj2;
    var recvProg  = progNet2 <= 0 ? progNet2 : 0;
    var recvFact  = factNet2 <= 0 ? factNet2 : 0;
    var payProg   = progNet2 > 0  ? progNet2 : 0;
    var payFact   = factNet2 > 0  ? factNet2 : 0;
    rows2 += '<tr style="background:#eff6ff">'
      + tdTotL('НДС к получению','#eff6ff') + tdTot('','background:#eff6ff')
      + tdTot('','background:#eff6ff')
      + tdTot(fkSign(recvProg),';background:#eff6ff')
      + tdTot(fkSign(recvFact),';background:#dbeafe')
      + '</tr>';
    rows2 += '<tr style="background:#eff6ff">'
      + tdTotL('НДС к уплате','#eff6ff') + tdTot('','background:#eff6ff')
      + tdTot('','background:#eff6ff')
      + tdTot(fkSign(payProg),';background:#eff6ff')
      + tdTot(fkSign(payFact),';background:#dbeafe')
      + '</tr>';

    var _html2 = '<div style="margin-top:20px">'
      + '<div style="font-size:13px;font-weight:700;color:#374151;padding:3px 5px 2px;border-bottom:2px solid #9ca3af;background:#f8f9fd">'
      + 'НДС ПРОГНОЗ — РАЗБИВКА ПО СТАТЬЯМ (тыс. руб.)</div>'
      + '<table style="' + CS2 + '">' + rows2 + '</table></div>';
    return {html: _html2, vatFact: factNet2, vatPlan: progNet2};
  }

  // Раскрывающийся список транзакций по счёту Внебюджетный лимит
  function buildEbDetails(planItems, catMap, curYear, curMonth, effRates, ebPmVatMap, paidPmIds, paidPmAmts, matVatDiff) {
    effRates = effRates || {};
    ebPmVatMap = ebPmVatMap || {};
    paidPmIds = paidPmIds || {};
    paidPmAmts = paidPmAmts || {};
    var items = (planItems || []).filter(function(item) {
      if (item.org_account_id !== 150) return false;
      var iy = parseInt((item.plan_paid_date || '').substring(0, 4));
      var im = parseInt((item.plan_paid_date || '').substring(5, 7));
      return (iy > curYear) || (iy === curYear && im >= curMonth);
    });
    if (!items.length) return '';

    items.sort(function(a, b) {
      return (b.plan_paid_date || '').localeCompare(a.plan_paid_date || '');
    });

    var total = items.reduce(function(s, item) { return s + (item.total || 0); }, 0);
    var fmtFull = function(v) { return new Intl.NumberFormat('ru-RU').format(Math.round(v || 0)); };
    var fmtK    = function(v) { return new Intl.NumberFormat('ru-RU').format(Math.round((v || 0) / 1000)); };

    function ebVat(item) {
      var amt = item.total || 0;
      var catName = catMap[item.category_id] || '';
      // Оплачен — берём реальный НДС из PLS cat=3144/3147.
      // Для расходов (type=40): PLS 3144 ведётся → доверяем PLS даже если 0 (ИП, нулевая ставка).
      // Для доходов (type=30): PLS 3144/3147 не генерируются — откатываемся к оценке по ставке.
      if (paidPmIds[item.id]) {
        var vatPls = Math.round(ebPmVatMap[item.id] || 0);
        return { net: amt - Math.abs(vatPls), vat: Math.abs(vatPls) };
      }
      // Оценка по эффективной ставке (только для неоплаченных позиций)
      var rate;
      if (item.type === 40) {
        var t = getExpCatType(catName);
        rate = (t && t !== null) ? (effRates[t] || 0) : 0;
      } else {
        var zeroIncCats = {'Прочий доход':1,'Проценты к получению':1,'Получение займов':1,
                           'Налог - НДС':1,'Налоги - НДС':1};
        rate = zeroIncCats[catName] ? 0 : 22 / 122;
      }
      var vat = Math.round(amt * rate);
      return { net: amt - vat, vat: vat };
    }

    var totVatDiff = Math.round(matVatDiff || 0);
    var totAmt = 0, totNet = 0, totVat = 0;
        var rows = items.map(function(item) {
      var dt = item.plan_paid_date || '';
      var dateStr = dt.length >= 10
        ? dt.slice(8, 10) + '.' + dt.slice(5, 7) + '.' + dt.slice(0, 4) : dt;
      var cat  = catMap[item.category_id] || '';
      var proj = PID_MAP[item.project_id] || ('id:' + item.project_id);
      var name = item.name || item.note || cat;
      var isExp = item.type === 40;
      var amt   = (!isExp && paidPmIds[item.id]) ? (paidPmAmts[item.id] || item.total || 0) : (item.total || 0);
      var v = ebVat(item);
      var sign = isExp ? 1 : -1;
      totAmt += sign * amt; totNet += sign * v.net; totVat += sign * v.vat;
      return '<tr>'
        + '<td style="padding:2px 8px;font-size:10px;color:#6b7280;white-space:nowrap">' + dateStr + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;color:#374151;max-width:100px;overflow:hidden;text-overflow:ellipsis">' + name + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;color:#6b7280;white-space:nowrap">' + proj + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;white-space:nowrap;font-weight:600;color:'
          + (isExp ? '#dc2626' : '#15803d') + '">' 
          + (isExp ? '- ' : '+ ') + fmtFull(amt) + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;white-space:nowrap;color:#374151">' + (isExp ? '- ' : '+ ') + fmtFull(Math.abs(v.net)) + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;white-space:nowrap;color:#6b7280">' + (isExp ? '- ' : '+ ') + fmtFull(Math.abs(v.vat)) + '</td>'
        + '</tr>';
    }).join('');

    // Итого с учётом разницы в НДС по материалам
    var grandAmt  = totAmt  + totVatDiff;
    var grandNet  = totNet  + totVatDiff;  // разница идёт в «Без НДС»
    var totSign   = grandAmt >= 0 ? '- ' : '+ ';
    var totColor  = grandAmt >= 0 ? '#dc2626' : '#15803d';
    var totalRow  = '<tr style="background:#f3f4f6;font-weight:600">'
      + '<td colspan="3" style="padding:2px 8px;font-size:10px;color:#374151;text-align:right">Итого</td>'
      + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:' + totColor + '">' + totSign + fmtFull(Math.abs(grandAmt)) + '</td>'
      + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:#374151">' + totSign + fmtFull(Math.abs(grandNet)) + '</td>'
      + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:#6b7280">' + totSign + fmtFull(Math.abs(totVat)) + '</td>'
      + '</tr>';

    // Разница в НДС: плановый НДС 22% со всех оплаченных расходов со ставкой ≠ 22% минус фактический НДС.
    var vatDiffRow = '';
    if (totVatDiff !== 0) {
      var dSign  = totVatDiff > 0 ? '- ' : '+ ';
      var dColor = totVatDiff > 0 ? '#dc2626' : '#15803d';
      vatDiffRow = '<tr style="background:#fffbeb">'
        + '<td colspan="3" style="padding:2px 8px;font-size:10px;color:#92400e;text-align:right;font-style:italic">Разница в НДС (22% − факт)</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:' + dColor + ';white-space:nowrap">'
        + dSign + fmtFull(Math.abs(totVatDiff)) + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:' + dColor + ';white-space:nowrap">'
        + dSign + fmtFull(Math.abs(totVatDiff)) + '</td>'
        + '<td></td>'
        + '</tr>';
    }

    return '<details style="margin-top:6px;font-family:sans-serif;max-width:50%">'
      + '<summary style="cursor:pointer;padding:5px 8px;font-size:10.5px;color:#6b7280;'
      + 'list-style:none;-webkit-appearance:none;user-select:none;background:#f8f9fd;'
      + 'border-top:1px solid #e5e7eb">'
      + '&#9660; Внебюджетный лимит (' + items.length + ' тр. на ' + fmtK(totAmt) + ' тыс. р.)'
      + '</summary>'
      + '<table style="width:100%;border-collapse:collapse;background:#fff">'
      + '<tr style="background:#f3f4f6">'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:left;color:#9ca3af;font-weight:600;white-space:nowrap">Дата</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:left;color:#9ca3af;font-weight:600">Контрагент / Категория</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:left;color:#9ca3af;font-weight:600;white-space:nowrap">Проект</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:right;color:#9ca3af;font-weight:600;white-space:nowrap">Сумма</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:right;color:#9ca3af;font-weight:600;white-space:nowrap">Без НДС</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:right;color:#9ca3af;font-weight:600;white-space:nowrap">НДС</th>'
      + '</tr>'
      + rows
      + vatDiffRow
      + totalRow
      + '</table>'
      + '</details>';
  }

  // Построение таблицы
  function buildTable(result, pm, curYear, curMonth, nextMonths, offBrkPlan, epBrkPlan, vat, finPlan, vf, today, sd, sdPrev, ebHtml) {
    var acc    = result.acc;
    var fin    = result.fin;
    var offBrk = result.offBrk || newOffBrk();
    var epBrk  = result.epBrk  || newOffBrk();
    var vSt  = result.vSt,  tSt  = result.tSt;
    var vEnd = result.vEnd, tEnd = result.tEnd;
    var tSt0 = vSt + tSt, tEnd0 = vEnd + tEnd;

    var todayStr  = today.slice(8,10) + '.' + today.slice(5,7) + '.' + today.slice(0,4);
    var jan1Str   = '01.01.' + curYear;
    var curMon    = MS[curMonth - 1];
    var prevYear  = curYear - 1;

    var SEP = ';border-left:2px solid #3d5c7a';
    var BT  = ';border-top:2px solid #c5cfe8';
    var BT2 = ';border-top:2px solid #4a6a8a';
    var BL2 = ';border-left:2px solid #4a6a8a';

    function TH(v, s)  { return '<th style="padding:5px 6px;text-align:right;border-bottom:2px solid #3d5c7a;font-size:10px;font-weight:600;white-space:nowrap' + (s||'') + '">' + v + '</th>'; }
    function THl(v, s) { return '<th style="padding:5px 6px;text-align:left;border-bottom:2px solid #3d5c7a;font-size:10px;font-weight:600' + (s||'') + '">' + v + '</th>'; }
    function TD(v, s)  { return '<td style="padding:2px 6px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap' + (s||'') + '">' + v + '</td>'; }
    function TDl(v, s) { return '<td style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap' + (s||'') + '">' + v + '</td>'; }
    function dash()    { return '<span style="color:#ccc">—</span>'; }

    // 6 пустых ячеек для колонок плана (с SEP на первой)
    function planEmpty() {
      return TD(dash(), SEP) + TD(dash()) + TD(dash()) + TD(dash()) + TD(dash()) + TD(dash());
    }

    function getBudget(p, type) {
      var a = acc[p], d = pm[p];
      return type === 'inc'
        ? a.i25 + (a.i26 - a.iCur) + d.bi_plan
        : a.e25 + (a.e26 - a.eCur) + d.be_plan;
    }

    function totals(type) {
      var t = { b:0, f25:0, f26:0, fCur:0, fH:0, fH_eb:0, plan:[0,0,0,0,0,0] };
      var totalOst = 0;
      PROJECTS.forEach(function(p) {
        var d = pm[p], a = acc[p];
        var b        = getBudget(p, type);
        var planPart = (type === 'inc') ? d.bi_plan : d.be_plan;
        var eb       = (type === 'inc') ? (d.bi_eb || 0) : (d.be_eb || 0);
        var pf25     = (type === 'inc') ? a.i25  : a.e25;
        var pf26     = (type === 'inc') ? a.i26  : a.e26;
        var pFact    = pf25 + pf26;
        totalOst += (b + eb === 0 || (!planPart && !eb)) ? 0 : b + eb - pFact;
        t.b    += b;
        t.f25  += pf25;
        t.f26  += pf26;
        t.fCur += (type === 'inc') ? a.iCur : a.eCur;
        t.fH   += (type === 'inc') ? d.hI   : d.hE;
        t.fH_eb += (type === 'inc') ? (d.hI_eb || 0) : (d.hE_eb || 0);
        for (var i = 0; i < 6; i++)
          t.plan[i] += (type === 'inc') ? d.plan_i[i] : d.plan_e[i];
      });
      t.fact = t.f25 + t.f26;
      t.ost  = totalOst;
      return t;
    }

    function pRow(p, type, rowLabel) {
      var d = pm[p], a = acc[p];
      var b    = getBudget(p, type);
      var f25  = (type === 'inc') ? a.i25  : a.e25;
      var f26  = (type === 'inc') ? a.i26  : a.e26;
      var fCur = (type === 'inc') ? a.iCur : a.eCur;
      var h    = (type === 'inc') ? d.hI   : d.hE;
      var hEb  = (type === 'inc') ? (d.hI_eb || 0) : (d.hE_eb || 0);
      var plan = (type === 'inc') ? d.plan_i : d.plan_e;
      var planPart = (type === 'inc') ? d.bi_plan : d.be_plan;
      var eb   = (type === 'inc') ? (d.bi_eb || 0) : (d.be_eb || 0);
      var fact = f25 + f26, ost = (b + eb === 0 || (!planPart && !eb)) ? 0 : b + eb - fact;
      if (!b && !fact && plan.every(function(x){ return !x; })) return '';
      return '<tr>'
        + TDl(rowLabel !== undefined ? rowLabel : p)
        + TD(fmtK(b), ';color:#9ca3af')
        + TD(fmtK(f25), SEP) + TD(fmtK(f26))
        + TD(fmtK(fact, true))
        + TD(fmtK(ost, false, true), ost < 0 ? ';color:#dc2626' : '')
        + TD(fmtK(hEb), SEP) + TD(fmtK(h)) + TD(fmtK(fCur))
        + plan.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
        + '</tr>';
    }

    function totRow(label, t, bg) {
      bg = bg || '#eef2ff';
      return '<tr style="background:' + bg + '">'
        + TDl('<strong>' + label + '</strong>', BT)
        + TD(fmtK(t.b, true), ';color:#9ca3af' + BT)
        + TD(fmtK(t.f25, true), SEP + BT) + TD(fmtK(t.f26, true), BT)
        + TD(fmtK(t.fact, true), BT)
        + TD(fmtK(t.ost, true, true), (t.ost < 0 ? ';color:#dc2626' : '') + BT)
        + TD(fmtK(t.fH_eb, true), SEP + BT) + TD(fmtK(t.fH, true), BT) + TD(fmtK(t.fCur, true), BT)
        + t.plan.map(function(v, i) { return TD(fmtK(v, true), (i === 0 ? SEP : '') + BT); }).join('')
        + '</tr>';
    }

    // Секция офисных расходов с разбивкой по подкатегориям
    function offExpSection() {
      var proj = 'Офис (ВСИП+ТТ)';
      var d = pm[proj], a = acc[proj];
      // Подкатегории кроме po, отсортированные по f26 убыванию
      var subs = OFF_SUBCATS.filter(function(s) {
        return s.code !== 'po' && (offBrk[s.code].f25 || offBrk[s.code].f26 || offBrk[s.code].fCur
          || (offBrkPlan && offBrkPlan[s.code].be_plan));
      });
      subs.sort(function(a, b) { return (offBrk[b.code].f26||0) - (offBrk[a.code].f26||0); });
      // po всегда последние
      var poSub = OFF_SUBCATS.filter(function(s) { return s.code === 'po'; })[0];
      if (offBrk.po.f25 || offBrk.po.f26 || offBrk.po.fCur || (offBrkPlan && offBrkPlan.po.be_plan))
        subs.push(poSub);
      var subRows = subs.map(function(s) {
        var brk = offBrk[s.code];
        var obp = offBrkPlan ? offBrkPlan[s.code] : null;
        var tot = brk.f25 + brk.f26;
        // Бюджет = факт_25 + (факт_26 - тек.мес) + план_от_тек.мес − план. поступления НДС
        var vatInc = (s.code === 'ntax' && obp) ? (obp.bi_plan || 0) : 0;
        var b    = brk.f25 + (brk.f26 - brk.fCur) + (obp ? obp.be_plan : 0) - vatInc;
        var obEb = obp ? (obp.be_eb || 0) : 0;
        var ost  = (b + obEb === 0 || !obp || (!obp.be_plan && !obEb && !vatInc)) ? 0 : b + obEb - tot;
        var hE  = obp ? (obp.hE - (obp.bi_hE || 0)) : 0;
        return '<tr>'
          + TDl('<span style="padding-left:14px">' + s.label + '</span>')
          + TD(fmtK(b), ';color:#9ca3af')
          + TD(fmtK(brk.f25), SEP) + TD(fmtK(brk.f26))
          + TD(fmtK(tot, true))
          + TD(fmtK(ost, false, true), ost < 0 ? ';color:#dc2626' : '')
          + TD(fmtK(obp ? (obp.hE_eb || 0) : 0), SEP) + TD(fmtK(hE)) + TD(fmtK(brk.fCur))
          + (obp ? obp.plan_e : [0,0,0,0,0,0]).map(function(v, i) {
              return TD(fmtK(v), i === 0 ? SEP : '');
            }).join('')
          + '</tr>';
      }).join('');
      // Итого офисные
      var f25 = a ? a.e25 : 0, f26 = a ? a.e26 : 0, fCur = a ? a.eCur : 0;
      var b = getBudget(proj, 'exp');
      var eb_off = d ? (d.be_eb || 0) : 0;
      var hEb_off = d ? (d.hE_eb || 0) : 0;
      var plan = d ? d.plan_e : [0,0,0,0,0,0];
      var fact = f25 + f26, ost = (b + eb_off === 0 || (!d || (!d.be_plan && !eb_off))) ? 0 : b + eb_off - fact;
      return sectionHdr('ОФИСНЫЕ РАСХОДЫ', '#f3f0ff', '#4c1d95', '#c4b5fd')
        + subRows
        + '<tr style="background:#ede9fe">'
        + TDl('<strong>Итого офисные</strong>', BT)
        + TD(fmtK(b, true), ';color:#9ca3af' + BT)
        + TD(fmtK(f25, true), SEP + BT) + TD(fmtK(f26, true), BT)
        + TD(fmtK(fact, true), BT)
        + TD(fmtK(ost, true, true), (ost < 0 ? ';color:#dc2626' : '') + BT)
        + TD(fmtK(hEb_off, true), SEP + BT) + TD(fmtK(d ? d.hE : 0, true), BT) + TD(fmtK(fCur, true), BT)
        + plan.map(function(v, i) { return TD(fmtK(v, true), (i === 0 ? SEP : '') + BT); }).join('')
        + '</tr>';
    }

    // Секция внепроектных расходов (project 35) с разбивкой по статьям
    function epExpSection() {
      var proj = 'Внепроектные расходы';
      if (!acc[proj]) return '';
      var a = acc[proj], d = pm[proj];
      if (!a.i25 && !a.i26 && !a.iCur && !a.e25 && !a.e26 && !a.eCur
          && (!d || (!d.bi_plan && !d.be_plan && !d.bi_eb && !d.be_eb))) return '';

      // Подкатегории расходов по EP_SUBCATS, отфильтровать нулевые (кроме po — всегда последние)
      var subs = EP_SUBCATS.filter(function(s) {
        return s.code !== 'po' && (epBrk[s.code].f25 || epBrk[s.code].f26 || epBrk[s.code].fCur
          || (epBrkPlan && epBrkPlan[s.code].be_plan));
      });
      subs.sort(function(x, y) { return (epBrk[y.code].f26||0) - (epBrk[x.code].f26||0); });
      var poSub = EP_SUBCATS.filter(function(s) { return s.code === 'po'; })[0];
      if (epBrk.po.f25 || epBrk.po.f26 || epBrk.po.fCur || (epBrkPlan && epBrkPlan.po.be_plan))
        subs.push(poSub);

      var subRows = subs.map(function(s) {
        var brk = epBrk[s.code];
        var obp = epBrkPlan ? epBrkPlan[s.code] : null;
        var tot = brk.f25 + brk.f26;
        var b   = brk.f25 + (brk.f26 - brk.fCur) + (obp ? obp.be_plan : 0);
        var ost = (b === 0 || !obp || !obp.be_plan) ? 0 : b - tot;
        var hE  = obp ? obp.hE : 0;
        return '<tr>'
          + TDl('<span style="padding-left:14px">' + s.label + '</span>')
          + TD(fmtK(b), ';color:#9ca3af')
          + TD(fmtK(brk.f25), SEP) + TD(fmtK(brk.f26))
          + TD(fmtK(tot, true))
          + TD(fmtK(ost, false, true), ost < 0 ? ';color:#dc2626' : '')
          + TD(fmtK(0), SEP) + TD(fmtK(hE)) + TD(fmtK(brk.fCur))
          + (obp ? obp.plan_e : [0,0,0,0,0,0]).map(function(v, i) {
              return TD(fmtK(v), i === 0 ? SEP : '');
            }).join('')
          + '</tr>';
      }).join('');

      return sectionHdr('ВНЕПРОЕКТНЫЕ РАСХОДЫ', '#f0fdf4', '#065f46', '#6ee7b7')
        + pRow(proj, 'inc', 'Внепроектные доходы')
        + subRows
        + pRow(proj, 'exp', 'Итого расходы');
    }

    // Строка финансовой деятельности: только факт-колонки, план пустой
    function finRow(label, item) {
      var f25 = item.f25, f26 = item.f26, tot = f25 + f26, fCur = item.fCur;
      if (!tot && !fCur) return '';
      return '<tr>'
        + TDl(label, ';padding-left:14px')
        + TD(dash(), ';color:#9ca3af')
        + TD(fmtK(f25), SEP) + TD(fmtK(f26))
        + TD(fmtK(tot, true))
        + TD(dash())
        + TD(dash(), SEP) + TD(dash()) + TD(fmtK(fCur))
        + planEmpty()
        + '</tr>';
    }

    // Строка займов: факт + план (hPlan — тек.мес.бюджет, planArr — 6 план.месяцев)
    function finLoanRow(label, item, hPlan, planArr) {
      var f25 = item.f25, f26 = item.f26, tot = f25 + f26, fCur = item.fCur;
      hPlan = hPlan || 0;
      planArr = planArr || [0,0,0,0,0,0];
      var hasPlan = hPlan > 0 || planArr.some(function(v) { return v > 0; });
      if (!tot && !fCur && !hasPlan) return '';
      // Бюджет и Остаток — та же логика, что у остальных строк
      var planSum = planArr.reduce(function(s, v) { return s + v; }, 0);
      var b   = f25 + (f26 - fCur) + hPlan + planSum;
      var ost = (b === 0 || (!hPlan && !planSum)) ? 0 : b - tot;
      return '<tr>'
        + TDl(label, ';padding-left:14px')
        + TD(fmtK(b), ';color:#9ca3af')
        + TD(fmtK(f25), SEP) + TD(fmtK(f26))
        + TD(fmtK(tot, true))
        + TD(fmtK(ost, false, true), ost < 0 ? ';color:#dc2626' : '')
        + TD(dash(), SEP) + TD(fmtK(hPlan)) + TD(fmtK(fCur))
        + planArr.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
        + '</tr>';
    }

    // Итого нетто финансовой деятельности
    var finNetF25  = fin.skIn.f25  + fin.trIn.f25  - fin.skOut.f25  - fin.int.f25  - fin.trOut.f25;
    var finNetF26  = fin.skIn.f26  + fin.trIn.f26  - fin.skOut.f26  - fin.int.f26  - fin.trOut.f26;
    var finNetCur  = fin.skIn.fCur + fin.trIn.fCur - fin.skOut.fCur - fin.int.fCur - fin.trOut.fCur;
    var finNetTot  = finNetF25 + finNetF26;
    // Плановое нетто финансовой деятельности (займы; переводы и % — без плана)
    var fp = finPlan || {skIn:{hI:0,plan:[0,0,0,0,0,0]}, skOut:{hE:0,plan:[0,0,0,0,0,0]}};
    var finNetPlanCur = fp.skIn.hI - fp.skOut.hE;
    var finNetPlan    = fp.skIn.plan.map(function(v, i) { return v - fp.skOut.plan[i]; });
    // Бюджет и остаток — только по finLoanRow-строкам (у finRow нет плана → ост = 0)
    var skInPlanSum   = fp.skIn.plan.reduce(function(s,v){ return s+v; }, 0);
    var skInB         = fin.skIn.f25  + (fin.skIn.f26  - fin.skIn.fCur)  + fp.skIn.hI  + skInPlanSum;
    var skInOst       = (skInB === 0  || (!fp.skIn.hI  && !skInPlanSum))  ? 0 : skInB  - (fin.skIn.f25  + fin.skIn.f26);
    var skOutPlanSum  = fp.skOut.plan.reduce(function(s,v){ return s+v; }, 0);
    var skOutB        = fin.skOut.f25 + (fin.skOut.f26 - fin.skOut.fCur) + fp.skOut.hE + skOutPlanSum;
    var skOutOst      = (skOutB === 0 || (!fp.skOut.hE && !skOutPlanSum)) ? 0 : skOutB - (fin.skOut.f25 + fin.skOut.f26);
    var finNetB       = skInB - skOutB;
    var finNetOst     = skInOst - skOutOst;

    var ti = totals('inc'), te = totals('exp');

    // Контрольная сумма:
    // Остаток_нач + Доходы_26 + ФинПриход_26 - Расходы_26 - ФинРасход_26 = Остаток_кон
    var finIn26  = fin.skIn.f26  + fin.trIn.f26;
    var finOut26 = fin.skOut.f26 + fin.int.f26 + fin.trOut.f26;
    var ctrl = tSt0 + (ti.f26 + finIn26) - (te.f26 + finOut26) - tEnd0;
    var cOk  = Math.abs(ctrl) < 1000;

    var vatD = {in_25:0, in_26:0, in_cur:0, out_25:0, out_26:0, out_cur:0};
    var effVatIn = 0, effVatOut = 0;  // используются в расчёте планового результата
    // НДС Прогноз → Сводный отчёт: сдвиг на квартал
    // Текущий квартал (Q0) → следующий (Q+1): 1/3 в каждый месяц
    // Q+1 → "+дальше" (Q+2): одной суммой
    var vatInPlan  = [0,0,0,0,0,0];
    var vatOutPlan = [0,0,0,0,0,0];
    var vatInCurPlan  = 0;
    var vatOutCurPlan = 0;
    if (vf && vf.data) {
      var _getQ = function(m) { return Math.ceil(m / 3); };
      var curQ   = _getQ(curMonth);                           // 1-4
      var nextQ  = (curQ % 4) + 1;
      var nextQY = (curQ === 4) ? curYear + 1 : curYear;
      // Суммируем vatIn/vatOut из НДС Прогноз по кварталам
      var _qIn = {}, _qOut = {};
      vf.data.forEach(function(col) {
        var key = col.y + '-' + _getQ(col.m);
        _qIn[key]  = (_qIn[key]  || 0) + col.vatIn;
        _qOut[key] = (_qOut[key] || 0) + col.vatOut;
      });
      var cqIn  = _qIn[curYear + '-' + curQ]    || 0;  // Q0 НДС
      var cqOut = _qOut[curYear + '-' + curQ]   || 0;
      var nqIn  = _qIn[nextQY  + '-' + nextQ]   || 0;  // Q+1 НДС
      var nqOut = _qOut[nextQY + '-' + nextQ]   || 0;
      var nnQ   = (nextQ % 4) + 1;
      var nnQY  = (nextQ === 4) ? nextQY + 1 : nextQY;
      var nnIn  = _qIn[nnQY  + '-' + nnQ]       || 0;  // Q+2 НДС (платёж в Q+3)
      var nnOut = _qOut[nnQY + '-' + nnQ]       || 0;

      // Q0 → Q+1: по 1/3 в каждый месяц Q+1
      nextMonths.forEach(function(nm, i) {
        if (i === 5) return;
        if (_getQ(nm.month) === nextQ && nm.year === nextQY) {
          vatInPlan[i]  = Math.round(cqIn  / 3);
          vatOutPlan[i] = Math.round(cqOut / 3);
        }
      });
      // Q+1 → Q+2: по 1/3 в каждый месяц Q+2 (те что попадают в nextMonths[0..4])
      var nqInPer  = Math.round(nqIn  / 3);
      var nqOutPer = Math.round(nqOut / 3);
      var q2Count  = 0;
      nextMonths.forEach(function(nm, i) {
        if (i === 5) return;
        if (_getQ(nm.month) === nnQ && nm.year === nnQY) {
          vatInPlan[i]  = nqInPer;
          vatOutPlan[i] = nqOutPer;
          q2Count++;
        }
      });
      // "+далее": оставшиеся месяцы Q+2 (1/3 × оставшихся) + Q+2 НДС (→ Q+3, весь в "+далее")
      vatInPlan[5]  = (3 - q2Count) * nqInPer  + nnIn;
      vatOutPlan[5] = (3 - q2Count) * nqOutPer + nnOut;
    }
    var vatInTot  = vatD.in_25  + vatD.in_26;
    var vatOutTot = vatD.out_25 + vatD.out_26;
    // Плановый остаток нарастающим итогом (нетто по НДС + финансовая деятельность)
    // Правило: если план строки = 0, остаток = 0 (не вычитаем факт из нуля)
    var planBal_cur = Math.round(tEnd0
      + (ti.fH  > 0 ? ti.fH  - ti.fCur          : 0) * (1 - effVatIn)   // остаток план опер. поступлений
      - (te.fH  > 0 ? te.fH  - te.fCur          : 0) * (1 - effVatOut)  // остаток план опер. выплат
      + (fp.skIn.hI  > 0 ? fp.skIn.hI  - fin.skIn.fCur  : 0)            // остаток план получения займов
      - (fp.skOut.hE > 0 ? fp.skOut.hE - fin.skOut.fCur : 0));           // остаток план выплаты займов
    var planBal = [0, 0, 0, 0, 0, 0];
    for (var bi = 0; bi < 6; bi++) {
      var bPrev = bi === 0 ? planBal_cur : planBal[bi - 1];
      planBal[bi] = Math.round(bPrev
        + ti.plan[bi] * (1 - effVatIn)
        - te.plan[bi] * (1 - effVatOut)
        + fp.skIn.plan[bi]                         // плановое получение займов
        - fp.skOut.plan[bi]);                      // плановая выплата займов
    }

    var yearLabel = curYear + '<br><span style="font-weight:400;font-size:9px">янв–' + curMon.toLowerCase() + '</span>';

    var sectionHdr = function(text, bg, color, border) {
      return '<tr style="background:' + bg + '"><td colspan="15" style="padding:4px 8px;font-weight:700;font-size:11.5px;color:' + color + ';border-bottom:1px solid ' + border + '">' + text + '</td></tr>';
    };

    // Строка остатка: метка span на кол.1-3, значение в кол.4
    function balRow(lbl, v, total, bg) {
      return '<tr style="font-size:10.5px' + (bg ? ';background:' + bg : '') + '">'
        + '<td colspan="3" style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#374151">'
        + (total ? '<strong>' + lbl + '</strong>' : lbl)
        + '</td>'
        + TD(fmtBal(v, total), '')
        + TD(dash()) + TD(dash())
        + TD(dash(), SEP) + TD(dash()) + TD(dash())
        + planEmpty()
        + '</tr>';
    }
    function balOpenRow(entity, v, total) {
      return balRow('Остаток на ' + jan1Str + ' · ' + entity, v, total, total ? '#d1e8ff' : '');
    }
    function balCloseRow(entity, v, total) {
      return balRow('Остаток на ' + todayStr + ' · ' + entity, v, total, total ? '#d1e8ff' : '');
    }

    // Переводы между счетами — одна строка нетто
    var trNet = {
      f25:  fin.trIn.f25  - fin.trOut.f25,
      f26:  fin.trIn.f26  - fin.trOut.f26,
      fCur: fin.trIn.fCur - fin.trOut.fCur
    };

    var ctrlStr = (function() {
      var absV = Math.abs(ctrl) / 1000;
      var s = absV.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return ctrl < 0 ? '(' + s + ')' : s;
    })();

    return '<table style="width:100%;border-collapse:collapse;font-size:11px">'
      + '<thead>'
      // ── ПРОГНОЗ ДВИЖЕНИЯ ДЕНЕЖНЫХ СРЕДСТВ ────────────────────────────────

      + (function() {
        if (!sd) return '';
        function sdFmt(v) {
          if (v === 0) return '<span style="color:#9ca3af">0</span>';
          var absV = Math.abs(v) / 1000;
          var parts = absV.toFixed(1).split('.');
          parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
          var s = parts.join('.');
          var clr = v < 0 ? '#dc2626' : '#15803d';
          var sgn = v < 0 ? '− ' : '+ ';
          return '<span style="color:' + clr + ';font-weight:600">' + sgn + s + '</span>';
        }
        var LS  = 'padding:3px 6px;font-size:11px;white-space:nowrap;color:#374151;border-bottom:1px solid #e5e7eb';
        var VS  = 'padding:3px 6px;text-align:right;font-size:11px;white-space:nowrap;border-bottom:1px solid #e5e7eb';
        var VSP = VS + ';color:#6b7280';
        var VSD = VS + ';border-left:1px solid #e5e7eb';
        var ES  = 'border-bottom:1px solid #e5e7eb';
        function sdRow(lbl, valHtml, valPrevHtml, diffHtml, bg) {
          return '<tr' + (bg ? ' style="background:' + bg + '"' : '') + '>'
            + '<td colspan="2" style="' + LS + (bg ? ';background:' + bg : '') + '">' + lbl + '</td>'
            + '<td style="' + VS  + (bg ? ';background:' + bg : '') + '">' + valHtml + '</td>'
            + '<td style="' + VSP + (bg ? ';background:' + bg : '') + '">' + (valPrevHtml || '') + '</td>'
            + '<td style="' + VSD + (bg ? ';background:' + bg : '') + '">' + (diffHtml || '') + '</td>'
            + '<td colspan="10" style="' + ES + (bg ? ';background:' + bg : '') + '"></td>'
            + '</tr>';
        }
        var reserveDiff = sdPrev ? sdFmt(sdPrev.reserve - sd.reserve) : null;
        return '<tr style="background:#1e3a5f">'
          + '<td colspan="15" style="padding:3px 6px;font-size:9px;font-weight:700;color:#a8c4e0;letter-spacing:0.08em;text-transform:uppercase">ПРОГНОЗ ДВИЖЕНИЯ ДЕНЕЖНЫХ СРЕДСТВ · тыс. руб.</td>'
          + '</tr>'
          + '<tr style="background:#1e3a5f">'
          + '<td colspan="2" style="border-bottom:1px solid #2d4f7c"></td>'
          + '<td style="padding:2px 6px;text-align:right;font-size:9px;color:#a8c4e0;white-space:nowrap;border-bottom:1px solid #2d4f7c">' + sd.dateStr + '</td>'
          + '<td style="padding:2px 6px;text-align:right;font-size:9px;color:#6b8ba4;white-space:nowrap;border-bottom:1px solid #2d4f7c">' + (sdPrev ? sdPrev.dateStr : '') + '</td>'
          + '<td style="padding:2px 6px;text-align:center;font-size:9px;color:#6b8ba4;white-space:nowrap;border-bottom:1px solid #2d4f7c">Δ</td>'
          + '<td colspan="10" style="border-bottom:1px solid #2d4f7c"></td>'
          + '</tr>'
          + sdRow('Текущий остаток ДС', fmtBal(sd.cashBalance, false), sdPrev ? fmtBal(sdPrev.cashBalance, false) : null, null)
          + sdRow('Ожидаемые приходы',      sdFmt(sd.incOst),    sdPrev ? sdFmt(sdPrev.incOst)    : null, null)
          + sdRow('Ожидаемые расходы',      sdFmt(-sd.expOst),   sdPrev ? sdFmt(-sdPrev.expOst)   : null, null)
          + sdRow('Ожидаемые займы',        sdFmt(sd.finOst),    sdPrev ? sdFmt(sdPrev.finOst)    : null, null)
          + sdRow('Ожидаемый текущий НДС',  sdFmt(sd.vatFact),   sdPrev ? sdFmt(sdPrev.vatFact)   : null, null)
          + sdRow('Ожидаемый плановый НДС', sdFmt(sd.vatPlan),   sdPrev ? sdFmt(sdPrev.vatPlan)   : null, null)
          + sdRow('Плановый остаток ДС',      sdFmt(-sd.reserve),  sdPrev ? sdFmt(-sdPrev.reserve)  : null, reserveDiff, '#fefce8')
          + '<tr style="background:#f0fdf4">'
          + '<td colspan="2" style="padding:4px 6px;font-size:11px;font-weight:700;white-space:nowrap;color:#374151;border-top:2px solid #9ca3af;border-bottom:1px solid #e5e7eb">Контрольная сумма</td>'
          + '<td style="padding:4px 6px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;border-top:2px solid #9ca3af;border-bottom:1px solid #e5e7eb"><span style="color:#9ca3af">0</span></td>'
          + '<td style="padding:4px 6px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;border-top:2px solid #9ca3af;border-bottom:1px solid #e5e7eb;color:#6b7280"><span style="color:#9ca3af">0</span></td>'
          + '<td style="border-top:2px solid #9ca3af;border-bottom:1px solid #e5e7eb;border-left:1px solid #e5e7eb"></td>'
          + '<td colspan="10" style="border-top:2px solid #9ca3af;border-bottom:1px solid #e5e7eb"></td>'
          + '</tr>'
          + (ebHtml ? '<tr><td colspan="15" style="padding:0;background:#f8f9fd">' + ebHtml + '</td></tr>' : '')
          + '<tr><td colspan="15" style="height:8px;background:#e8edf3;border-bottom:3px solid #1e3a5f"></td></tr>'
      })()

      + '<tr style="background:#1e3a5f;color:#a8c4e0;font-size:9px">'
      + '<td style="padding:2px 6px;min-width:120px"></td><td></td>'
      + '<td colspan="4" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">ФАКТ</td>'
      + '<td colspan="3" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">Тек. месяц (' + curMon + ')</td>'
      + '<td colspan="6" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">&#9654; План</td>'
      + '</tr>'
      + '<tr style="background:#1e3a5f;color:#fff">'
      + THl('Проект', ';width:1%')
      + TH('Бюджет', ';color:#a8c4e0')
      + TH(String(prevYear), SEP + ';color:#a8c4e0')
      + TH(yearLabel)
      + TH('Итого') + TH('Остаток')
      + TH('Вне Бюджет', SEP) + TH('Бюджет') + TH('Факт')
      + nextMonths.map(function(nm, i) {
          var lbl = MS[nm.month-1] + (nm.year !== curYear ? ' \'' + String(nm.year).slice(2) : '');
          if (i === 5) lbl += '+далее';
          return TH(lbl, i === 0 ? SEP : '');
        }).join('')
      + '</tr>'
      + '</thead>'
      + '<tbody>'

      // Начальный остаток на 01.01
      + balOpenRow('ВСИП', vSt, false)
      + balOpenRow('ТТ', tSt, false)
      + balOpenRow('ИТОГО', tSt0, true)

      // ДОХОДЫ
      + sectionHdr('ДОХОДЫ', '#dce7f5', '#1e3a5f', '#c5cfe8')
      + PROJECTS.filter(function(p) { return p !== 'Внепроектные расходы'; }).map(function(p) { return pRow(p, 'inc'); }).join('')
      + totRow('ИТОГО ДОХОДЫ', ti)

      // НДС с поступлений
      + '<tr style="background:#fffbeb">'
      + TDl('<em style="color:#92400e">НДС с поступлений</em>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(vatD.in_25), SEP) + TD(fmtK(vatD.in_26))
      + TD(fmtK(vatInTot, true))
      + TD(dash())
      + TD(dash(), SEP) + TD(fmtK(vatInCurPlan)) + TD(fmtK(vatD.in_cur))
      + vatInPlan.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // Поступления без НДС = Итого доходы - НДС
      + '<tr style="background:#f0fdf4">'
      + TDl('<strong style="color:#15803d">Поступления без НДС</strong>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(ti.f25 - vatD.in_25), SEP) + TD(fmtK(ti.f26 - vatD.in_26))
      + TD(fmtK(ti.fact - vatInTot, true))
      + TD(dash())
      + TD(dash(), SEP) + TD(fmtK(ti.fH - vatInCurPlan)) + TD(fmtK(ti.fCur - vatD.in_cur))
      + vatInPlan.map(function(v, i) { return TD(fmtK(ti.plan[i] - v, true), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // РАСХОДЫ
      + sectionHdr('РАСХОДЫ', '#fae8e8', '#7f1d1d', '#fca5a5')
      + PROJECTS.filter(function(p) { return p !== 'Офис (ВСИП+ТТ)' && p !== 'Внепроектные расходы'; }).map(function(p) { return pRow(p, 'exp'); }).join('')
      + offExpSection()
      + epExpSection()
      + totRow('ИТОГО РАСХОДЫ', te, '#fef2f2')

      // НДС с выплат
      + '<tr style="background:#fff7ed">'
      + TDl('<em style="color:#9a3412">НДС с выплат</em>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(vatD.out_25), SEP) + TD(fmtK(vatD.out_26))
      + TD(fmtK(vatOutTot, true))
      + TD(dash())
      + TD(dash(), SEP) + TD(fmtK(vatOutCurPlan)) + TD(fmtK(vatD.out_cur))
      + vatOutPlan.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // Расходы без НДС = Итого расходы - НДС
      + '<tr style="background:#fff0f0">'
      + TDl('<strong style="color:#991b1b">Расходы без НДС</strong>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(te.f25 - vatD.out_25), SEP) + TD(fmtK(te.f26 - vatD.out_26))
      + TD(fmtK(te.fact - vatOutTot, true))
      + TD(dash())
      + TD(dash(), SEP) + TD(fmtK(te.fH - vatOutCurPlan)) + TD(fmtK(te.fCur - vatD.out_cur))
      + vatOutPlan.map(function(v, i) { return TD(fmtK(te.plan[i] - v, true), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // ФИНАНСОВАЯ ДЕЯТЕЛЬНОСТЬ
      + sectionHdr('ФИНАНСОВАЯ ДЕЯТЕЛЬНОСТЬ', '#f0f4ff', '#3730a3', '#c7d2fe')
      + finLoanRow('Выдача/Выплата займов',    fin.skOut, finPlan ? finPlan.skOut.hE   : 0, finPlan ? finPlan.skOut.plan : null)
      + finLoanRow('Получение/Возврат займов', fin.skIn,  finPlan ? finPlan.skIn.hI    : 0, finPlan ? finPlan.skIn.plan  : null)
      + finRow('Процентные расходы', fin.int)
      + finRow('Переводы между счетами', trNet)
      + '<tr style="background:#e0e7ff">'
      + TDl('<strong>ИТОГО финансовая деятельность</strong>', BT)
      + TD(fmtK(finNetB, true), ';color:#9ca3af' + BT)
      + TD(fmtK(finNetF25, true), SEP + BT) + TD(fmtK(finNetF26, true), BT)
      + TD(fmtK(finNetTot, true), BT)
      + TD(fmtK(finNetOst, true, true), (finNetOst < 0 ? ';color:#dc2626' : '') + BT)
      + TD(dash(), SEP + BT) + TD(fmtK(finNetPlanCur, true), BT) + TD(fmtK(finNetCur, true), BT)
      + finNetPlan.map(function(v, i) { return TD(fmtK(v, true), (i === 0 ? SEP : '') + BT); }).join('')
      + '</tr>'

      // Закрывающий остаток на текущую дату
      + balCloseRow('ВСИП', vEnd, false)
      + balCloseRow('ТТ', tEnd, false)
      + balCloseRow('ИТОГО', tEnd0, true)

      // Плановый остаток на конец периода
      // Тек.мес.: tEnd0 + остаток план поступлений нетто - остаток план выплат нетто
      // Плановые месяцы: остаток предыдущего + поступления нетто - выплаты нетто
      + '<tr style="background:#dbeafe;font-size:10.5px">'
      + '<td colspan="3" style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#1e40af"><strong>Плановый остаток на конец периода</strong></td>'
      + TD(dash())
      + TD(dash()) + TD(dash())
      + TD(dash(), SEP) + TD(fmtBal(planBal_cur, true)) + TD(dash())
      + planBal.map(function(v, i) { return TD(fmtBal(v, true), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // КОНТРОЛЬНАЯ СУММА
      + '<tr style="background:#1e3a5f">'
      + TDl('<strong style="color:#fff">' + (cOk ? '&#10003; Контрольная сумма' : '&#9888; Контрольная сумма') + '</strong>', BT2)
      + TD(dash(), BT2)
      + TD(dash(), BL2 + BT2) + TD(dash(), BT2)
      + TD('<strong style="color:' + (cOk ? '#6ee7b7' : '#fca5a5') + '">' + ctrlStr + '</strong>', BT2)
      + TD(dash(), BT2)
      + TD(dash(), BL2 + BT2) + TD(dash(), BT2) + TD(dash(), BT2)
      + TD(dash(), BL2 + BT2) + TD(dash(), BT2) + TD(dash(), BT2)
      + TD(dash(), BT2) + TD(dash(), BT2) + TD(dash(), BT2)
      + '</tr>'

      + '</tbody></table>';
  }

  // Загрузка
  var loading = false;

  // Инициализация датапикера: по умолчанию — сегодня
  (function() {
    var inp = document.getElementById('sel-date');
    var now = new Date();
    inp.value = now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-' + pad2(now.getDate());
    inp.max   = inp.value;  // нельзя выбрать будущую дату
  })();

  function load() {
    if (loading) return;
    loading = true;
    var statusEl  = document.getElementById('status');
    var contentEl = document.getElementById('content');

    // Читаем выбранную дату (или сегодня, если поле пустое)
    var selVal = document.getElementById('sel-date').value;
    var selD   = selVal ? new Date(selVal + 'T00:00:00') : new Date();
    var yr     = selD.getFullYear();
    var mo     = selD.getMonth() + 1;
    var today  = selD.getFullYear() + '-' + pad2(selD.getMonth()+1) + '-' + pad2(selD.getDate());

    statusEl.textContent = '&#9679; загрузка...';
    statusEl.style.color = '#d97706';
    contentEl.innerHTML  = '<div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>';

    var t0 = Date.now();
    // Следующие 6 месяцев после текущего (не включая текущий), с переходом в следующий год
    var nextMonths = [];
    for (var i = 0; i < 6; i++) {
      var nm = mo + 1 + i, ny = yr;
      if (nm > 12) { nm -= 12; ny++; }
      nextMonths.push({year: ny, month: nm});
    }
    // Загрузка в два этапа (как в Бюджет2): сначала лёгкие данные параллельно,
    // потом transaction отдельно — чтобы не конкурировать за Aspro и не получать 502.
    var _catMap, _planItems;
    Promise.all([
      fetchCategories().then(function(m) { _catMap = m; }),
      fetchPlanMoney(yr).then(function(items) { _planItems = items; })
    ])
    .then(function() {
      statusEl.textContent = '⬤ загрузка транзакций...';
      statusEl.style.color = '#d97706';
      return fetchAll('transaction');
    })
    .then(function(txns_) {
      statusEl.textContent = '⬤ загрузка НДС...';
      return Promise.all([
        Promise.resolve(txns_),
        fetchPls(yr).catch(function() { return []; }),
        fetchAll('bank_account').catch(function() { return []; })
      ]);
    })
    .then(function(results) {
      var txns         = results[0];
      var plsItems     = results[1];
      var bankAccounts = results[2];
      var catMap       = _catMap;
      var planItems    = _planItems;
      rebuildProjMap(txns, planItems, yr);  // динамическая группировка проектов
      var factResult  = calcFact(txns, catMap, yr, mo, today, bankAccounts);
      var planResult  = calcPlan(planItems, yr, mo, nextMonths, catMap);
      var vat         = calcVat(plsItems, yr, mo);
      var pm          = planResult.pm;
      var offBrkPlan  = planResult.offBrkPlan;
      var epBrkPlan   = planResult.epBrkPlan;
      var finPlan     = planResult.finPlan;
      var vf = calcVatForecast(txns, planItems, plsItems, catMap, yr, mo, today);

      // ── Сводная карточка: вычисление данных ─────────────────────────────
      var _acc = factResult.acc;
      var _fin = factResult.fin;

      // Остаток бюджета по доходам/расходам (логика totals())
      function _sumOst(type) {
        var tot = 0;
        PROJECTS.forEach(function(p) {
          var d = pm[p], a = _acc[p];
          var b = type === 'inc'
            ? a.i25 + (a.i26 - a.iCur) + d.bi_plan
            : a.e25 + (a.e26 - a.eCur) + d.be_plan;
          var planPart = type === 'inc' ? d.bi_plan : d.be_plan;
          var eb   = type === 'inc' ? (d.bi_eb || 0) : (d.be_eb || 0);
          var pFact = type === 'inc' ? a.i25 + a.i26 : a.e25 + a.e26;
          tot += (b + eb === 0 || (!planPart && !eb)) ? 0 : b + eb - pFact;
        });
        return tot;
      }
      var _incOst = _sumOst('inc');
      var _expOst = _sumOst('exp') + (vf ? (vf.vfEbExpAdj || 0) : 0);

      // finNetOst (аналог buildTable)
      var _fp = finPlan || {skIn:{hI:0,plan:[0,0,0,0,0,0]},skOut:{hE:0,plan:[0,0,0,0,0,0]}};
      var _skInPS  = _fp.skIn.plan.reduce(function(s,v){return s+v;},0);
      var _skInB   = _fin.skIn.f25  + (_fin.skIn.f26  - _fin.skIn.fCur)  + _fp.skIn.hI  + _skInPS;
      var _skInO   = (_skInB  === 0 || (!_fp.skIn.hI  && !_skInPS))  ? 0 : _skInB  - (_fin.skIn.f25  + _fin.skIn.f26);
      var _skOutPS = _fp.skOut.plan.reduce(function(s,v){return s+v;},0);
      var _skOutB  = _fin.skOut.f25 + (_fin.skOut.f26 - _fin.skOut.fCur) + _fp.skOut.hE + _skOutPS;
      var _skOutO  = (_skOutB === 0 || (!_fp.skOut.hE && !_skOutPS)) ? 0 : _skOutB - (_fin.skOut.f25 + _fin.skOut.f26);
      var _finNetOst = _skInO - _skOutO;

      // Изменение резерва: превышение факта тек.месяца над планом тек.месяца
      var _rezInc = 0, _rezExp = 0;
      PROJECTS.forEach(function(p) {
        var a = _acc[p], d = pm[p];
        _rezInc += Math.max(0, (a.iCur || 0) - (d.hI || 0));
        _rezExp += Math.max(0, (a.eCur || 0) - (d.hE || 0));
      });

      var _cashBal = factResult.vEnd + factResult.tEnd;

      // ── DEBUG: компоненты expOst и cashBal (удалить после диагностики) ──
      (function() {
        var _dbSumOst = _sumOst('exp');
        var _dbEbAdj  = vf ? (vf.vfEbExpAdj || 0) : 0;
        var _dbExpOst = _dbSumOst + _dbEbAdj;
        var _dbProj   = {};
        PROJECTS.forEach(function(p) {
          var d = pm[p], a = _acc[p];
          var bePlan = d.be_plan || 0, beEb = d.be_eb || 0, eCur = a.eCur || 0;
          var e26 = a.e26 || 0, e25 = a.e25 || 0;
          var planPart = bePlan, eb = beEb;
          var b = e25 + (e26 - eCur) + bePlan;
          var pFact = e25 + e26;
          var contrib = (b + eb === 0 || (!planPart && !eb)) ? 0 : b + eb - pFact;
          _dbProj[p] = { bePlan: bePlan, beEb: beEb, eCur: eCur, e26: e26, contrib: Math.round(contrib) };
        });
        console.log('DEBUG expOst', {
          sumOst:     Math.round(_dbSumOst),
          vfEbExpAdj: Math.round(_dbEbAdj),
          expOst:     Math.round(_dbExpOst),
          cashBal:    Math.round(_cashBal),
          vEnd:       Math.round(factResult.vEnd),
          tEnd:       Math.round(factResult.tEnd),
          projects:   _dbProj
        });
      })();
      // ── END DEBUG ──

      // НДС факт/план — из нижней таблицы (остаток × ставка). Вычисляем заранее для карточки.
      var _vat2 = buildVatForecastTable2(vf, pm, factResult, offBrkPlan, epBrkPlan);
      var _vF   = _vat2.vatFact;

      // База: конец предыдущего месяца — всегда считается заново из API-данных,
      // кеш не используется, чтобы все пользователи видели одинаковые значения.
      var _sdPrev = null;
      (function() {
        var _prevMonthEnd = (function() {
          var d = new Date(today); d.setDate(1); d.setDate(0);
          return d.toISOString().slice(0,10);
        })();
        var _frP = calcFact(txns, catMap, yr, mo, _prevMonthEnd, bankAccounts);
        // EB-позиции (org_account_id=150) не входят в прогноз прошлого месяца
        var _planNonEB = planItems.filter(function(i) { return i.org_account_id !== 150; });
        var _vfP = calcVatForecast(txns, _planNonEB, plsItems, catMap, yr, mo, _prevMonthEnd);
        var _aP = _frP.acc, _fnP = _frP.fin;
        var _sumOstP = function(type) {
          var tot = 0;
          PROJECTS.forEach(function(p) {
            var d = pm[p], a = _aP[p];
            var b = type === 'inc' ? a.i25 + (a.i26 - a.iCur) + d.bi_plan : a.e25 + (a.e26 - a.eCur) + d.be_plan;
            var pf = type === 'inc' ? a.i25 + a.i26 : a.e25 + a.e26;
            var pl = type === 'inc' ? d.bi_plan : d.be_plan;
            tot += (b === 0 || !pl) ? 0 : b - pf;
          });
          return tot;
        };
        var _skInBP  = _fnP.skIn.f25  + (_fnP.skIn.f26  - _fnP.skIn.fCur)  + _fp.skIn.hI  + _skInPS;
        var _skInOP  = (_skInBP  === 0 || (!_fp.skIn.hI  && !_skInPS))  ? 0 : _skInBP  - (_fnP.skIn.f25  + _fnP.skIn.f26);
        var _skOutBP = _fnP.skOut.f25 + (_fnP.skOut.f26 - _fnP.skOut.fCur) + _fp.skOut.hE + _skOutPS;
        var _skOutOP = (_skOutBP === 0 || (!_fp.skOut.hE && !_skOutPS)) ? 0 : _skOutBP - (_fnP.skOut.f25 + _fnP.skOut.f26);
        var _pCashBal = _frP.vEnd + _frP.tEnd;
        var _pIncOst  = _sumOstP('inc');
        var _pExpOst  = _sumOstP('exp');
        var _pFinOst  = _skInOP - _skOutOP;
        var _vfP2     = buildVatForecastTable2(_vfP, pm, _frP, offBrkPlan, epBrkPlan);
        var _pVatFact = _vfP2.vatFact;
        var _pVatPlan = _vfP2.vatPlan;
        _sdPrev = {
          dateStr:     _prevMonthEnd.slice(8,10) + '.' + _prevMonthEnd.slice(5,7) + '.' + _prevMonthEnd.slice(0,4),
          cashBalance: _pCashBal,
          incOst:      _pIncOst,
          expOst:      _pExpOst,
          finOst:      _pFinOst,
          vatFact:     _pVatFact,
          vatPlan:     _pVatPlan,
          reserve:     -(_pCashBal + _pIncOst - _pExpOst + _pFinOst + _pVatFact + _pVatPlan)
        };
      })();

      var _vP = _vat2.vatPlan;

      var _sd = {
        dateStr:     today.slice(8,10) + '.' + today.slice(5,7) + '.' + today.slice(0,4),
        cashBalance: _cashBal,
        incOst:      _incOst,
        expOst:      _expOst,
        finOst:      _finNetOst,
        vatFact:     _vF,
        vatPlan:     _vP,
        reserve:     -(_cashBal + _incOst - _expOst + _finNetOst + _vF + _vP)
      };
      // ────────────────────────────────────────────────────────────────────

      // Разница в НДС: Σ(матер. транзакции тек. месяца × 22/122) − Σ(фактический НДС из PLS 3144)
      // Материальные категории: имя начинается с "мат" (Материалы*, Мат(*, Мат-* и т.п.)
      // Фактический НДС: PLS 3144 за тек. месяц, привязка по reference_id транзакции
      var _matVatDiff = (function() {
        var _curYM = yr * 100 + mo;
        // Шаг 1: карта reference_id → сумма НДС из PLS 3144 за текущий месяц
        var _refVatMap = {};
        (plsItems || []).forEach(function(p) {
          if (p.category_id !== 3144) return;
          if (p.project_id === 27) return;          // исключаем переводы ВСИП↔ТТ
          var dt = p.date || '';
          if (dt.length < 7) return;
          if (today && dt > today) return;
          var pYM = parseInt(dt.slice(0,4)) * 100 + parseInt(dt.slice(5,7));
          if (pYM !== _curYM) return;
          var v = parseFloat(p.outcome) || 0;
          if (v && p.reference_id) _refVatMap[p.reference_id] = (_refVatMap[p.reference_id] || 0) + v;
        });
        // Шаг 2: сканируем txns — все материальные расходы тек. месяца
        var _calcVat = 0, _factVat = 0;
        txns.forEach(function(tx) {
          var dt = tx.date || '';
          if (dt.length < 7) return;
          var tYM = parseInt(dt.slice(0,4)) * 100 + parseInt(dt.slice(5,7));
          if (tYM !== _curYM) return;
          if (today && dt > today) return;
          var expAmt = parseFloat(tx.outcome) || 0;
          if (!expAmt) return;
          var catName = catMap[tx.category_id] || '';
          if (!/^мат/i.test(catName)) return;   // только Материал*/Мат*/мат* категории
          _calcVat += expAmt * 22 / 122;
          _factVat += _refVatMap[tx.reference_id] || 0;
        });
        return Math.round(_calcVat - _factVat);
      })();
      var _ebHtml = buildEbDetails(planItems, catMap, yr, mo, vf ? vf.effRates : {}, vf ? vf.ebPmVatMap : {}, vf ? vf.paidPmIds : {}, vf ? vf.paidPmAmts : {}, _matVatDiff);
      contentEl.innerHTML = buildTable(factResult, pm, yr, mo, nextMonths, offBrkPlan, epBrkPlan, vat, finPlan, vf, today, _sd, _sdPrev, _ebHtml)
        + _vat2.html;
      var elapsed = ((Date.now() - t0) / 1000).toFixed(0);
      statusEl.innerHTML = '&#9679; live · ' + today.slice(8,10) + '.' + today.slice(5,7) + '.' + today.slice(0,4) + ' · ' + txns.length + ' тр. · ' + elapsed + 'с';
      statusEl.style.color = '#059669';
      loading = false;
    }).catch(function(err) {
      contentEl.innerHTML = '<div style="padding:16px;color:#dc2626">&#10060; Ошибка: ' + err.message + '</div>';
      statusEl.textContent = '&#9679; ошибка';
      statusEl.style.color = '#dc2626';
      loading = false;
    });
  }

  document.getElementById('sel-date').addEventListener('change', function() {
    loading = false;
    load();
  });

  document.getElementById('refresh-btn').addEventListener('click', function() {
    loading = false;
    load();
  });

  load();
})();
</script>
</body>
</html>
