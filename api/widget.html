<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сводный финансовый отчёт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    background: #f8f9fd;
    padding: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .title { font-size: 14px; font-weight: 700; color: #111827; }
  .subtitle { font-size: 10px; color: #9ca3af; margin-left: 8px; }
  .status-row { display: flex; gap: 6px; align-items: center; }
  #status { font-size: 10.5px; color: #d97706; }
  #refresh-btn {
    background: none;
    border: 1px solid #d1d5db;
    color: #6b7280;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #refresh-btn:hover { background: #f3f4f6; }
  #content { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { white-space: nowrap; }
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="title">&#128202; Сводный финансовый отчёт</span>
    <span class="subtitle">Все суммы в тысячах рублей</span>
  </div>
  <div class="status-row">
    <span id="status">&#9679; инициализация...</span>
    <input type="date" id="sel-date" style="font-size:11px;border:1px solid #d1d5db;border-radius:4px;padding:2px 6px;color:#374151;background:#fff;cursor:pointer" title="Дата отчёта">
    <button id="refresh-btn" title="Обновить">&#8635;</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>
</div>

<script>
(function () {
  'use strict';

  // Банковские счета для расчёта остатков (org_account_id)
  // ВСИП: 2-Альфа, 4-Совком, 5-РХСБ, 6-Сбер, 7-ВТБ, 8-Депозиты
  // ТТ:   18-Альфа ТТ (ВСИП)
  var VSIP_ACC_IDS = {2:1, 3:1, 4:1, 5:1, 6:1, 7:1, 8:1, 161:1, 166:1}; // 3=ИП и СС, 161=Прочие счета, 166=Альфа Т (ТБанк)
  var TT_ACC_IDS   = {18:1};

  // Справочники проектов
  var PID_MAP = {
    1:'Кемерово',
    6:'Десногорск',
    12:'Киров',
    23:'Сыктывкар',
    13:'Барнаул',
    9:'Рузаевка',
    3:'Ю-Сахалинск',
    25:'Ю-Сахалинск',
    7:'Иволгинск',
    10:'Большое Болдино',
    2:'Прочие/ Закрытые проекты',
    18:'Центр. договор',
    19:'Центр. договор',
    29:'Центр. договор',
    30:'Центр. договор',
    31:'Центр. договор',
    32:'Центр. договор',
    33:'Голутвинский',
    4:'Прочие',
    22:'Прочие',
    20:'Прочие',
    17:'Прочие',
    21:'Прочие',
    35:'Прочие/ Закрытые проекты',
    24:'Офис (ВСИП+ТТ)',
    26:'Офис (ВСИП+ТТ)'
  };

  var PROJECTS = [
    'Кемерово',
    'Десногорск',
    'Киров',
    'Сыктывкар',
    'Барнаул',
    'Рузаевка',
    'Ю-Сахалинск',
    'Иволгинск',
    'Большое Болдино',
    'Голутвинский',
    'Центр. договор',
    'Прочие',
    'Прочие/ Закрытые проекты',
    'Офис (ВСИП+ТТ)'
  ];

  // Проекты ОХР для финансовой деятельности
  var OXR_PIDS = {24:1, 26:1};

  // Краткие имена всех проектов (кроме технических 24/26/27/28/35/36)
  var PROJ_SHORT_NAMES = {
    1:'Кемерово', 2:'Рассказово', 3:'Ю-Сахалинск', 4:'Омутнинск',
    5:'Строитель', 6:'Десногорск', 7:'Иволгинск', 9:'Рузаевка',
    10:'Большое Болдино', 11:'Новокуйбышевск', 12:'Киров', 13:'Барнаул',
    14:'Тамбов', 15:'Одинцово', 16:'Покровское', 17:'Прочие РСХБ',
    18:'Уни', 19:'Красногорское', 20:'Чечня', 21:'Сити', 22:'Гарпия',
    23:'Сыктывкар', 29:'Первомайское', 30:'Угловское',
    31:'Тогул', 32:'Менжинского', 33:'Голутвинский', 34:'Толбазы'
  };
  // Проекты с «ЦДА» в официальном названии
  var PROJ_CDA_PIDS = {2:1, 4:1, 6:1, 7:1, 9:1, 10:1, 34:1};

  // Динамически пересчитывает PID_MAP и PROJECTS на основе активных проектов
  // (наличие транзакций в curYear или плана на curYear/curYear+1).
  function rebuildProjMap(txns, planItems, curYear) {
    var activePids = {};
    txns.forEach(function(tx) {
      var pid = parseInt(tx.project_id) || 0;
      if (!PROJ_SHORT_NAMES[pid]) return;
      var yr = parseInt((tx.date || '').slice(0, 4)) || 0;
      if (yr === curYear) activePids[pid] = 1;
    });
    (planItems || []).forEach(function(item) {
      var pid = parseInt(item.project_id) || 0;
      if (!PROJ_SHORT_NAMES[pid]) return;
      var yr = parseInt((item.plan_paid_date || '').slice(0, 4)) || 0;
      if (yr === curYear || yr === curYear + 1) activePids[pid] = 1;
    });

    var newPidMap = {24:'Офис (ВСИП+ТТ)', 26:'Офис (ВСИП+ТТ)', 35:'Внепроектные расходы'};
    var projSet   = {};  // name → sort key

    Object.keys(PROJ_SHORT_NAMES).forEach(function(pidStr) {
      var pid  = parseInt(pidStr);
      var name = PROJ_SHORT_NAMES[pid];
      if (activePids[pid]) {
        newPidMap[pid] = name;
        projSet[name]  = name;
      } else {
        var grp = PROJ_CDA_PIDS[pid] ? 'Прочие проекты ЦДА' : 'Прочие проекты ИКП';
        newPidMap[pid] = grp;
        projSet[grp]   = grp;
      }
    });

    // Build PROJECTS: alphabetically sorted active + grouped; Office and EP last
    var newProjects = Object.keys(projSet)
      .filter(function(p) { return p !== 'Офис (ВСИП+ТТ)' && p !== 'Внепроектные расходы'; })
      .sort(function(a, b) { return a.localeCompare(b, 'ru'); });
    newProjects.push('Офис (ВСИП+ТТ)');
    newProjects.push('Внепроектные расходы');

    PID_MAP  = newPidMap;
    PROJECTS = newProjects;
  }

  // Категории, исключаемые из секций ДОХОДЫ/РАСХОДЫ
  var SKIP = {
    'Перевод между счетами (поступление)': 1,
    'Перевод между счетами (списание)': 1,
    'Получение кредита': 1,
    'Выплата кредита': 1,
    'Получение займа': 1,
    'Выплата займа': 1,
    'Проценты к уплате': 1
  };

  // Типы займов/кредитов — идут в финансовую деятельность, не в доходы/расходы
  var LOAN_CATS = {
    'Получение займа': 1,
    'Выплата займа': 1,
    'Получение кредита': 1,
    'Выплата кредита': 1
  };

  var INC_TYPES = {
    'Оказание услуг': 1,
    'Возврат ДС. за заказы': 1,
    'Проценты к получению': 1,
    'Прочий доход': 1,
    'Возврат депозита': 1   // ВБ-доходы: учитываются в iCur → корректно снижают _incOst
  };

  // Категории расходов с нулевой ставкой НДС (для планового расчёта)
  var ZERO_RATE_CATS = {
    'Зарплата': 1, 'Налоги с зарплаты': 1, 'Командировки': 1,
    'Страхование': 1, 'Расходы на услуги банков': 1, 'Банковские услуги': 1,
    'Налоги и взносы': 1, 'Налоги - НДС': 1, 'Налог - НДС': 1,
    'Проценты к уплате': 1, 'Прочее': 1
  };

  function getPlanExpVatRate(catName) {
    if (!catName) return 22 / 122;
    if (LOAN_CATS[catName] || SKIP[catName]) return 0;
    if (ZERO_RATE_CATS[catName]) return 0;
    return 22 / 122;
  }

  // Классифицирует название категории в тип для расчёта эффективной ставки НДС.
  // Возвращает null — категория исключается из расчёта (переводы, займы).
  // Возвращает 'zero' — НДС всегда 0%.
  // Возвращает строку типа — для подстановки эффективной ставки из фактических PLS.
  function getExpCatType(catName) {
    if (!catName) return 'proj_other';
    if (LOAN_CATS[catName]) return null;
    if (catName === 'Перевод между счетами (поступление)' ||
        catName === 'Перевод между счетами (списание)') return null;
    if (ZERO_RATE_CATS[catName]) return 'zero';
    var l = catName.toLowerCase();
    if (l.indexOf('без ндс') >= 0) return 'zero';
    if (/^смр/.test(l))      return 'smr';
    if (/^материал/.test(l)) return 'mat';
    if (l === 'проектирование-изыскание' || l.indexOf('изыскан') >= 0 ||
        l === 'составление исполнительной документации' ||
        l === 'услуги по сертификации' || l === 'тесты и испытания') return 'design';
    if (l.indexOf('банковские гарантии') >= 0) return 'bg';
    if (l.indexOf('аренд') >= 0) return 'ar';
    if (l.indexOf('лизинг') >= 0) return 'lz';
    if (l.indexOf('бухгалтер') >= 0) return 'buh';
    if (l.indexOf('возврат') >= 0) return 'ret';
    return 'proj_other';
  }

  // Классификация в 4 бакета: mat / smr / smrZ (любые «без НДС») / other — для новой НДС-таблицы.
  function expSubType(catName) {
    var l = (catName || '').toLowerCase();
    // Любая категория «без НДС» → нулевая ставка (smrZ), независимо от типа (СМР, материалы и пр.)
    if (l.indexOf('без ндс') >= 0) return 'smrZ';
    var t = getExpCatType(catName);
    if (t === 'mat') return 'mat';
    if (t === 'smr') return 'smr';
    if (t === 'zero') return 'smrZ';  // страховочная ветка для остальных нулевых категорий
    return 'other';
  }

  // Ставки по умолчанию — применяются если нет фактических PLS-данных для данного типа
  var DEFAULT_EFF_RATES = {
    smr: 0, mat: 0, design: 0, bg: 0,
    ar: 0, lz: 0, buh: 0, proj_other: 0, zero: 0
  };

  function isIncome(t) { return !!INC_TYPES[t]; }

  function isExpense(t, proj) {
    if (proj === 'Офис (ВСИП+ТТ)') {
      // Для офисных проектов: всё кроме переводов, кредитов и займов (они — финансовая деятельность)
      return t !== 'Перевод между счетами (поступление)'
          && t !== 'Перевод между счетами (списание)'
          && t !== 'Получение кредита'
          && t !== 'Выплата кредита'
          && t !== 'Получение займа'
          && t !== 'Выплата займа';
    }
    if (SKIP[t]) return false;
    var l = t.toLowerCase();
    // Для Прочих и Прочих/Закрытых: все расходные транзакции в себестоимость
    // (plan_money уже включает ВСЕ type=40 без фильтра по категории)
    if (proj === 'Прочие' || proj === 'Прочие/ Закрытые проекты'
        || proj === 'Прочие проекты ЦДА' || proj === 'Прочие проекты ИКП') return true;
    // Внепроектные расходы: всё кроме финансовых операций (они уже в fin.skIn/skOut/int)
    if (proj === 'Внепроектные расходы') {
      return t !== 'Перевод между счетами (поступление)'
          && t !== 'Перевод между счетами (списание)'
          && t !== 'Получение кредита'
          && t !== 'Выплата кредита'
          && t !== 'Получение займа'
          && t !== 'Выплата займа'
          && t !== 'Проценты к уплате';
    }
    // Для всех остальных проектов — учитывать все расходы
    // (переводы и займы уже отфильтрованы SKIP и предыдущими условиями)
    return true;
  }

  var MS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

  var OFF_SUBCATS = [
    {code:'zp',  label:'Зарплата'},
    {code:'nzp', label:'Налоги с зарплаты'},
    {code:'km',  label:'Командировочные'},
    {code:'bk',  label:'Банковские комиссии'},
    {code:'lz',  label:'Лизинг'},
    {code:'ar',  label:'Аренда'},
    {code:'buh', label:'Бухгалтерия'},
    {code:'ntax',label:'Налоги (НДС, Прибыль)'},
    {code:'pct', label:'Проценты к уплате'},
    {code:'bg',  label:'Банковские гарантии'},
    {code:'ret', label:'Возвраты клиентам'},
    {code:'po',  label:'Прочие офисные'}
  ];

  // Статьи Внепроектных расходов
  var EP_SUBCATS = [
    {code:'mat', label:'Материалы'},
    {code:'smr', label:'Подрядчики (СМР)'},
    {code:'div', label:'Дивиденды'},
    {code:'ret', label:'Возвраты'},
    {code:'po',  label:'Прочие'}
  ];
  function epSubcat(name) {
    var l = (name || '').toLowerCase();
    if (l.indexOf('материал') === 0 || l.indexOf('оборудован') >= 0) return 'mat';
    if (l.indexOf('смр') === 0 || l.indexOf('подряд') >= 0
        || l.indexOf('проектирован') >= 0 || l.indexOf('изыскан') >= 0
        || l.indexOf('сертификац') >= 0 || l.indexOf('испытан') >= 0
        || l.indexOf('исполнительн') >= 0 || l.indexOf('мобилизац') >= 0) return 'smr';
    if (l.indexOf('дивиденд') >= 0) return 'div';
    if (l.indexOf('возврат') >= 0) return 'ret';
    return 'po';
  }
  function newEpBrk() {
    var r = {};
    EP_SUBCATS.forEach(function(s) { r[s.code] = {f25:0, f26:0, fCur:0}; });
    return r;
  }

  function offSubcat(name) {
    var l = name.toLowerCase();
    // "Налоги с зарплаты" содержит 'зарплат' — проверяем раньше, чем общий zp
    if (l.indexOf('налог') >= 0 && (l.indexOf('зарплат') >= 0 || l.indexOf('фот') >= 0)) return 'nzp';
    if (l.indexOf('зарплат') >= 0 || l.indexOf('фот') >= 0 || l.indexOf('оплата труда') >= 0) return 'zp';
    if (l.indexOf('командир') >= 0) return 'km';
    if (l.indexOf('гарант') >= 0) return 'bg';
    if (l.indexOf('лизинг') >= 0) return 'lz';
    if (l.indexOf('аренд') >= 0) return 'ar';
    if (l.indexOf('бухгалтер') >= 0 || l.indexOf('аудит') >= 0) return 'buh';
    if (l.indexOf('налог') >= 0 || l.indexOf('взнос') >= 0 || l.indexOf('страхов') >= 0
        || l.indexOf('усн') >= 0 || l.indexOf('ндс') >= 0 || l.indexOf('ифнс') >= 0
        || l.indexOf('пенсионн') >= 0 || l.indexOf('пфр') >= 0 || l.indexOf('фсс') >= 0
        || l.indexOf('ффомс') >= 0) return 'ntax';
    if (l.indexOf('процент') >= 0) return 'pct';
    if (l.indexOf('банков') >= 0 || l.indexOf('комисс') >= 0) return 'bk';
    if (l.indexOf('возврат') >= 0) return 'ret';
    return 'po';
  }

  function newOffBrk() {
    var r = {};
    OFF_SUBCATS.forEach(function(s) { r[s.code] = {f25:0, f26:0, fCur:0}; });
    return r;
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // Форматирование
  function fmtK(v, bold, neg_red) {
    if (!v) return '<span style="color:#ccc">—</span>';
    var absV = Math.abs(v) / 1000;
    var parts = absV.toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    var s = parts.join('.');
    var isNeg = v < 0;
    var wrapped = isNeg ? '(' + s + ')' : s;
    if (neg_red && isNeg) {
      return bold
        ? '<strong style="color:#dc2626">' + wrapped + '</strong>'
        : '<span style="color:#dc2626">' + wrapped + '</span>';
    }
    return bold ? '<strong>' + wrapped + '</strong>' : wrapped;
  }

  function fmtBal(v, bold) {
    if (!v && v !== 0) return '<span style="color:#ccc">—</span>';
    var absV = Math.abs(v) / 1000;
    var parts = absV.toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    var s = parts.join('.');
    var isNeg = v < 0;
    var wrapped = isNeg ? '(' + s + ')' : s;
    var col = isNeg ? '#dc2626' : '#059669';
    return bold
      ? '<strong style="color:' + col + '">' + wrapped + '</strong>'
      : '<span style="color:' + col + '">' + wrapped + '</span>';
  }

  // API через серверный прокси /api/data
  function fetchAll(entity, extra) {
    var all = [], page = 1;
    function next() {
      var p = new URLSearchParams();
      p.append('entity', entity);
      p.append('limit', '100');
      p.append('page', String(page));
      if (extra) Object.keys(extra).forEach(function(k) { p.append(k, extra[k]); });
      return fetch('/api/data?' + p.toString())
        .then(function(r) {
          if (!r.ok) throw new Error(entity + ' HTTP ' + r.status);
          return r.json();
        })
        .then(function(d) {
          if (d.error) throw new Error(entity + ': ' + JSON.stringify(d.error));
          var items = (d.response && d.response.items) || [];
          all = all.concat(items);
          var total = (d.response && d.response.total) || 0;
          if (all.length >= total || items.length < 100) return all;
          page++;
          return next();
        });
    }
    return next();
  }

  function fetchCategories() {
    return fetchAll('categories').then(function(items) {
      var map = {};
      items.forEach(function(c) { map[c.id] = c.name || ''; });
      return map;
    });
  }

  function fetchPlanMoney(curYear) {
    return fetchAll('plan_money').then(function(items) {
      return items.filter(function(i) {
        if (!i.plan_paid_date) return false;
        var iy = parseInt(i.plan_paid_date.substring(0, 4));
        // Включаем curYear-1, чтобы plan_paid_date прошлого года (Анадырь, Рассказово и т.п.)
        // попали в pmDateMap и корректно исключились из текущего квартала (period-attribution).
        return iy >= curYear - 1;  // org_account_id фильтруется в Step 5
      });
    });
  }

  // Загрузка PLS-записей (НДС) за curYear и год до.
  // Запрос 1: без фильтра → 3157/3158 (исходящий/входящий НДС per-transaction).
  // Запрос 2: filter 3144 — точно по образцу nds.html (fetchAllPls).
  var _pls3144err = null;

  function fetchPls3144(curYear) {
    // Отдельный прокси /api/pls3144 — минует entity/ALLOWED логику /api/data
    var prevYear = curYear - 1;
    var now = new Date();
    var todayStr = now.getFullYear() + '-'
      + String(now.getMonth() + 1).padStart(2, '0') + '-'
      + String(now.getDate()).padStart(2, '0');
    var all = [], page = 1;
    function next() {
      return fetch('/api/pls3144?page=' + page)
        .then(function(r) {
          var status = r.status;
          return r.json().then(function(d) {
            if (status >= 400) {
              var why = d && d.error ? JSON.stringify(d.error).slice(0, 60) : ('HTTP ' + status);
              throw new Error('3144: ' + why);
            }
            if (d.error) throw new Error('3144: ' + JSON.stringify(d.error).slice(0, 60));
            var items = (d.response && d.response.items) || [];
            all = all.concat(items);
            var total = (d.response && d.response.total) || 0;
            if (all.length >= total || items.length < 100) return all;
            page++;
            return next();
          });
        });
    }
    return next();
  }

  function fetchPls(curYear) {
    _pls3144err = null;
    var prevYear = curYear - 1;
    // req1 может вернуть 400 "entity not allowed" — подавляем ошибку
    var req1 = fetchAll('transaction_pls').catch(function() { return []; });
    var req2 = fetchPls3144(curYear).catch(function(e) {
      _pls3144err = (e && e.message) ? e.message.slice(0, 80) : 'ошибка req2';
      console.warn('[fetchPls] req2 failed:', _pls3144err);
      return [];
    });
    return Promise.all([req1, req2]).then(function(res) {
      // req2 (pls3144) — полный список cat=3144, включая записи ВБ-позиций (plan_money_id)
      // которые могут отсутствовать в req1 (transaction_pls — только привязанные к транзакциям).
      // Используем req2 для 3144 (более полный), req1 — для 3147/1000.
      // Если req2 пустой (ошибка эндпоинта) — откатываемся на req1 целиком.
      var from3144   = res[1];  // pls3144 endpoint: все записи cat=3144
      var fromEntity = res[0];  // transaction_pls: 3147, 1000 (и 3144 но неполный)
      var combined;
      if (from3144.length > 0) {
        // 3144 — из полного endpoint (фильтруем только 3144, т.к. сервер возвращает все категории);
        // остальные (3147, 1000) — из entity, чтобы не задваивать.
        var only3144 = from3144.filter(function(i) { return i.category_id === 3144; });
        var other = fromEntity.filter(function(i) { return i.category_id !== 3144; });
        combined = only3144.concat(other);
      } else {
        combined = fromEntity;
      }
      return combined.filter(function(i) {
        if (!i.date) return false;
        var iy = parseInt(i.date.substring(0, 4));
        return (iy === curYear || iy === prevYear)
            && (i.category_id === 3144 || i.category_id === 3147 || i.category_id === 1000);
      });
    });
  }

  // Расчёт фактического НДС из PLS-записей
  // category 3158 (OUTPUT_VAT): income → НДС с поступлений
  // category 3157 (INPUT_VAT): outcome → НДС с выплат
  function calcVat(plsItems, curYear, curMonth) {
    var v = {in_25:0, in_26:0, in_cur:0, out_25:0, out_26:0, out_cur:0};
    plsItems.forEach(function(p) {
      var yr   = parseInt(p.date.slice(0, 4));
      var mo   = parseInt(p.date.slice(5, 7));
      var prev = (yr === curYear - 1);
      var cur  = (yr === curYear && mo === curMonth);
      if (p.category_id === 3158) {
        var a = parseFloat(p.income) || 0;
        if (prev) v.in_25 += a;
        else if (yr === curYear) { v.in_26 += a; if (cur) v.in_cur += a; }
      } else if (p.category_id === 3157) {
        var b = parseFloat(p.outcome) || 0;
        if (prev) v.out_25 += b;
        else if (yr === curYear) { v.out_26 += b; if (cur) v.out_cur += b; }
      }
    });
    return v;
  }

  // Расчёт факта + остатки + финансовая деятельность
  function calcFact(txns, catMap, curYear, curMonth, today, bankAccounts) {
    var jan1  = curYear + '-01-01';

    var acc = {};
    PROJECTS.forEach(function(p) {
      acc[p] = { i25:0, e25:0, i26:0, e26:0, iCur:0, eCur:0,
                 eCurByType:{mat:0,smr:0,smrZ:0,other:0} };
    });

    // Финансовая деятельность (только проекты 24 и 26)
    var fin = {
      skIn:  { f25:0, f26:0, fCur:0 },   // Получение займов
      skOut: { f25:0, f26:0, fCur:0 },   // Выдача займов
      int:   { f25:0, f26:0, fCur:0 },   // Процентные расходы (не-офис; офисные % — в offBrk.pct)
      trIn:  { f25:0, f26:0, fCur:0 },   // Переводы поступление
      trOut: { f25:0, f26:0, fCur:0 }    // Переводы списание
    };
    var offBrk = newOffBrk();
    var epBrk  = newEpBrk();   // разбивка Внепроектных расходов

    // Остатки по банковским счетам
    var vSt = 0, tSt = 0, vEnd = 0, tEnd = 0;

    txns.forEach(function(tx) {
      var dt     = tx.date || '';
      var incAmt = parseFloat(tx.income)  || 0;
      var expAmt = parseFloat(tx.outcome) || 0;

      // Остатки по всем транзакциям банковских счетов
      var aid = tx.org_account_id;
      if (VSIP_ACC_IDS[aid]) {
        if (dt < jan1)   vSt  += incAmt - expAmt;
        if (dt <= today) vEnd += incAmt - expAmt;
      }
      if (TT_ACC_IDS[aid]) {
        if (dt < jan1)   tSt  += incAmt - expAmt;
        if (dt <= today) tEnd += incAmt - expAmt;
      }

      // Только текущий и прошлый год для факта
      var yr = parseInt(dt.slice(0, 4)) || 0;
      var mo = parseInt(dt.slice(5, 7)) || 0;
      if (yr !== curYear && yr !== curYear - 1) return;

      var typeName = catMap[tx.category_id] || '';

      var isPrev = (yr === curYear - 1);
      var isCur  = (yr === curYear && mo === curMonth);
      var fKey   = isPrev ? 'f25' : 'f26';

      // Для текущего года: только транзакции до выбранной даты включительно
      if (!isPrev && dt > today) return;

      // Займы/кредиты — по всем проектам и счетам (включая Прочие/Закрытые и Прочие счета ВСИП)
      if ((typeName === 'Получение кредита' || typeName === 'Получение займа') && incAmt > 0) {
        fin.skIn[fKey]  += incAmt; if (isCur) fin.skIn.fCur  += incAmt;
      }
      if ((typeName === 'Выплата кредита' || typeName === 'Выплата займа') && expAmt > 0) {
        fin.skOut[fKey] += expAmt; if (isCur) fin.skOut.fCur += expAmt;
      }
      // Процентные расходы не-офисных проектов → fin.int (офисные % уже идут в offBrk.pct)
      if (typeName === 'Проценты к уплате' && expAmt > 0 && !OXR_PIDS[tx.project_id]) {
        fin.int[fKey] += expAmt; if (isCur) fin.int.fCur += expAmt;
      }

      var proj = PID_MAP[tx.project_id];
      if (!proj) return;

      // Финансовая деятельность (переводы и офисная разбивка) — только проекты 24 и 26
      if (OXR_PIDS[tx.project_id]) {
        // Проценты к уплате офисных проектов идут в offBrk.pct, не в fin.int
        if (typeName === 'Перевод между счетами (поступление)' && incAmt > 0) {
          fin.trIn[fKey]  += incAmt; if (isCur) fin.trIn.fCur  += incAmt;
        }
        if (typeName === 'Перевод между счетами (списание)' && expAmt > 0) {
          fin.trOut[fKey] += expAmt; if (isCur) fin.trOut.fCur += expAmt;
        }
        // Разбивка офисных расходов по подкатегориям
        if (expAmt && isExpense(typeName, 'Офис (ВСИП+ТТ)')) {
          var sub = offSubcat(typeName);
          var brk = offBrk[sub];
          if (isPrev) { brk.f25 += expAmt; }
          else { brk.f26 += expAmt; if (isCur) brk.fCur += expAmt; }
        }
      }

      // Внепроектные расходы (project 35) — разбивка по подкатегориям
      if (tx.project_id === 35 && expAmt && isExpense(typeName, 'Внепроектные расходы')) {
        var sub35 = epSubcat(typeName);
        var brk35 = epBrk[sub35];
        if (isPrev) { brk35.f25 += expAmt; }
        else { brk35.f26 += expAmt; if (isCur) brk35.fCur += expAmt; }
      }

      // Доходы и расходы по проектам
      var a = acc[proj];
      if (incAmt > 0 && isIncome(typeName)) {
        if (isPrev) { a.i25 += incAmt; }
        else { a.i26 += incAmt; if (isCur) a.iCur += incAmt; }
      }
      if (expAmt && isExpense(typeName, proj)) {
        if (isPrev) { a.e25 += expAmt; }
        else {
          a.e26 += expAmt;
          if (isCur) {
            a.eCur += expAmt;
            var _st = expSubType(typeName);
            a.eCurByType[_st] = (a.eCurByType[_st] || 0) + expAmt;
          }
        }
      }
    });

    // Начальный остаток (fixed_balance из bank_account — не транзакция)
    if (bankAccounts) {
      bankAccounts.forEach(function(ba) {
        var fb  = parseFloat(ba.fixed_balance) || 0;
        var fbd = ba.fixed_balance_date || '';
        if (!fb || !fbd) return;
        var baid = +ba.id;
        if (VSIP_ACC_IDS[baid]) {
          if (fbd < jan1)    vSt  += fb;
          if (fbd <= today)  vEnd += fb;
        }
        if (TT_ACC_IDS[baid]) {
          if (fbd < jan1)    tSt  += fb;
          if (fbd <= today)  tEnd += fb;
        }
      });
    }

    return { acc:acc, fin:fin, offBrk:offBrk, epBrk:epBrk, vSt:vSt, tSt:tSt, vEnd:vEnd, tEnd:tEnd };
  }

  // Расчёт плана
  function calcPlan(planItems, curYear, curMonth, nextMonths, catMap) {
    var pm = {};
    PROJECTS.forEach(function(p) {
      pm[p] = { bi_plan:0, be_plan:0, hI:0, hE:0,
                bi_eb:0, be_eb:0, hI_eb:0, hE_eb:0,
                plan_i:[0,0,0,0,0,0], plan_e:[0,0,0,0,0,0],
                bePlanByType:{mat:0,smr:0,smrZ:0,other:0},
                beEbByType:{mat:0,smr:0,smrZ:0,other:0} };
    });
    var offBrkPlan = {};
    OFF_SUBCATS.forEach(function(s) {
      offBrkPlan[s.code] = {be_plan:0, bi_plan:0, bi_hE:0, hE:0, hE_eb:0, be_eb:0, plan_e:[0,0,0,0,0,0]};
    });
    var epBrkPlan = {};
    EP_SUBCATS.forEach(function(s) {
      epBrkPlan[s.code] = {be_plan:0, hE:0, plan_e:[0,0,0,0,0,0]};
    });
    // Плановые поступления/выплаты займов → финансовая деятельность
    var finPlan = {
      skIn:  {hI:0, plan:[0,0,0,0,0,0]},
      skOut: {hE:0, plan:[0,0,0,0,0,0]}
    };

    planItems.forEach(function(item) {
      if (item.org_account_id !== 36) return;  // только ВСИП Бюджетный лимит
      var proj = PID_MAP[item.project_id];
      if (!proj) return;
      var iy  = parseInt(item.plan_paid_date.substring(0, 4));
      var im  = parseInt(item.plan_paid_date.substring(5, 7));
      var val = item.total || 0;
      var isI = (item.type === 30), isE = (item.type === 40);
      var catName = (catMap && catMap[item.category_id]) || '';

      // Займы/кредиты в офисных и внепроектных проектах → финансовая деятельность, не в pm
      if (OXR_PIDS[item.project_id] || item.project_id === 35) {
        if (LOAN_CATS[catName]) {
          if (iy === curYear && im === curMonth) {
            if (isI) finPlan.skIn.hI  += val;
            if (isE) finPlan.skOut.hE += val;
          }
          nextMonths.forEach(function(nm, idx) {
            var nmYM = nm.year * 100 + nm.month, itemYM = iy * 100 + im;
            var match = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
            if (match) {
              if (isI) finPlan.skIn.plan[idx]  += val;
              if (isE) finPlan.skOut.plan[idx] += val;
            }
          });
          return; // не попадает в pm и offBrkPlan
        }
      }

      // Операционные статьи — как прежде
      var d = pm[proj];
      if (iy > curYear || (iy === curYear && im >= curMonth)) {
        if (isI) d.bi_plan += val;
        if (isE) {
          d.be_plan += val;
          var _stp = expSubType(catName);
          d.bePlanByType[_stp] = (d.bePlanByType[_stp] || 0) + val;
        }
      }
      if (iy === curYear && im === curMonth) {
        if (isI) d.hI += val;
        if (isE) d.hE += val;
      }
      nextMonths.forEach(function(nm, idx) {
        // Последний столбец (idx=5) накапливает все месяцы начиная с 6-го
        var nmYM   = nm.year * 100 + nm.month;
        var itemYM = iy * 100 + im;
        var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
        if (match) {
          if (isI) d.plan_i[idx] += val;
          if (isE) d.plan_e[idx] += val;
        }
      });
      // Разбивка плана по подкатегориям для офисных проектов
      if (OXR_PIDS[item.project_id] && isE) {
        var sub = offSubcat(catName || (catMap && catMap[item.category_id]) || '');
        var obp = offBrkPlan[sub];
        if (iy > curYear || (iy === curYear && im >= curMonth)) obp.be_plan += val;
        if (iy === curYear && im === curMonth) obp.hE += val;
        nextMonths.forEach(function(nm, idx) {
          var nmYM   = nm.year * 100 + nm.month;
          var itemYM = iy * 100 + im;
          var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
          if (match) obp.plan_e[idx] += val;
        });
      }
      // Плановые поступления по НДС (ntax) переносим из доходов в расходы офиса со знаком минус
      if (OXR_PIDS[item.project_id] && isI) {
        var subI = offSubcat(catName || (catMap && catMap[item.category_id]) || '');
        if (subI === 'ntax') {
          var projI = PID_MAP[item.project_id];
          var d2 = pm[projI];
          // Убираем из income (отменяем накопление выше)
          if (iy > curYear || (iy === curYear && im >= curMonth)) {
            if (d2) d2.bi_plan -= val;
            offBrkPlan[subI].bi_plan += val;
            if (d2) d2.be_plan -= val;  // корректируем «Итого офисные»
          }
          if (iy === curYear && im === curMonth) {
            if (d2) d2.hI -= val;                // убираем из income текущего месяца
            offBrkPlan[subI].bi_hE += val;       // текущий месяц: вычет в колонке Окт
          }
          nextMonths.forEach(function(nm, idx) {
            var nmYM   = nm.year * 100 + nm.month;
            var itemYM = iy * 100 + im;
            var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
            if (match) {
              if (d2) d2.plan_i[idx] -= val;               // убираем из income помесячно
              offBrkPlan[subI].plan_e[idx] -= val;         // строка Налоги: помесячно
              if (d2) d2.plan_e[idx] -= val;               // Итого офисные: помесячно
            }
          });
        }
      }
      // Разбивка плана по подкатегориям для внепроектных расходов (project 35)
      if (item.project_id === 35 && isE) {
        var catNameEp = (catMap && catMap[item.category_id]) || '';
        var subEp = epSubcat(catNameEp);
        var obpEp = epBrkPlan[subEp];
        if (iy > curYear || (iy === curYear && im >= curMonth)) obpEp.be_plan += val;
        if (iy === curYear && im === curMonth) obpEp.hE += val;
        nextMonths.forEach(function(nm, idx) {
          var nmYM   = nm.year * 100 + nm.month;
          var itemYM = iy * 100 + im;
          var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
          if (match) obpEp.plan_e[idx] += val;
        });
      }
    });
    // Внебюджетный лимит (org_account_id=150)
    planItems.forEach(function(item) {
      if (item.org_account_id !== 150) return;
      var proj = PID_MAP[item.project_id];
      if (!proj || !pm[proj]) return;
      var catNameEb = (catMap && catMap[item.category_id]) || '';
      if (SKIP[catNameEb]) return;  // категория в SKIP → транзакции тоже не войдут в eCur
      var iy  = parseInt(item.plan_paid_date.substring(0, 4));
      var im  = parseInt(item.plan_paid_date.substring(5, 7));
      var val = item.total || 0;
      var isI = (item.type === 30), isE = (item.type === 40);
      var d = pm[proj];
      if (iy > curYear || (iy === curYear && im >= curMonth)) {
        if (isI) d.bi_eb += val;
        if (isE) {
          d.be_eb += val;
          var _steb = expSubType(catNameEb);
          d.beEbByType[_steb] = (d.beEbByType[_steb] || 0) + val;
        }
      }
      if (iy === curYear && im === curMonth) {
        if (isI) d.hI_eb += val;
        if (isE) d.hE_eb += val;
      }
      // Разбивка внебюджета по подкатегориям для офисных проектов
      if (OXR_PIDS[item.project_id] && isE) {
        var subEb = offSubcat(catNameEb);
        if (offBrkPlan[subEb]) {
          if (iy > curYear || (iy === curYear && im >= curMonth)) offBrkPlan[subEb].be_eb += val;
          if (iy === curYear && im === curMonth) offBrkPlan[subEb].hE_eb += val;
        }
      }
    });
    // Плановые поступления НДС с реальных счетов (не 36/150) в офисных проектах → ntax.bi_plan
    // Пример: «Возврат НДС» на Альфа ВСИП (org_account_id=2), категория «Налог - НДС»
    planItems.forEach(function(item) {
      if (item.org_account_id === 36 || item.org_account_id === 150) return; // уже учтены выше
      if (item.type !== 30) return;  // только поступления (income)
      if (!OXR_PIDS[item.project_id]) return;  // только офисные проекты (pid 24, 26)
      var catNameR = (catMap && catMap[item.category_id]) || '';
      if (offSubcat(catNameR) !== 'ntax') return;  // только налоговые категории
      var iy = parseInt(item.plan_paid_date.substring(0, 4));
      var im = parseInt(item.plan_paid_date.substring(5, 7));
      var val = item.total || 0;
      var proj = PID_MAP[item.project_id];
      // Итоговый бюджет (be_plan) и разбивка ntax
      if (iy > curYear || (iy === curYear && im >= curMonth)) {
        offBrkPlan.ntax.bi_plan += val;
        if (proj && pm[proj]) pm[proj].be_plan -= val;  // корректируем «Итого офисные»
      }
      if (iy === curYear && im === curMonth) {
        offBrkPlan.ntax.bi_hE += val;  // текущий месяц: вычет в колонке Окт
      }
      // Помесячная разбивка (plan_e) для ntax-строки и «Итого офисные»
      nextMonths.forEach(function(nm, idx) {
        var nmYM   = nm.year * 100 + nm.month;
        var itemYM = iy * 100 + im;
        var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
        if (match) {
          offBrkPlan.ntax.plan_e[idx] -= val;          // строка Налоги: помесячно
          if (proj && pm[proj]) pm[proj].plan_e[idx] -= val;  // Итого офисные: помесячно
        }
      });
    });
    return {pm: pm, offBrkPlan: offBrkPlan, epBrkPlan: epBrkPlan, finPlan: finPlan};
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // НДС ПРОГНОЗ — расчёт и отображение
  // ═══════════════════════════════════════════════════════════════════════════

  function calcVatForecast(txns, planItems, plsItems, catMap, curYear, curMonth, today) {
    // Текущий квартал: первый месяц квартала
    var q0m = curMonth <= 3 ? 1 : curMonth <= 6 ? 4 : curMonth <= 9 ? 7 : 10;
    var curYM = curYear * 100 + curMonth;

    // 9 колонок: Q0 + Q+1 + Q+2
    var cols = [];
    for (var qi = 0; qi < 9; qi++) {
      var cm = q0m + qi, cy = curYear;
      while (cm > 12) { cm -= 12; cy++; }
      cols.push({y: cy, m: cm, ym: cy * 100 + cm});
    }
    // Далее: всё после 9-го месяца
    var dalM = cols[8].m + 1, dalY = cols[8].y;
    if (dalM > 12) { dalM = 1; dalY++; }
    var dalYM = dalY * 100 + dalM;

    // ── Шаг 1: вычисляем эффективные ставки по категориям из фактических PLS ─
    var TR_PID = 27;  // project_id переводов ВСИП↔ТТ, как в nds.html

    // Период для расчёта ставок = все завершённые кварталы curYear (Янв–конец предыдущего квартала).
    var prevQEndM = q0m - 1, prevQEndY = curYear;
    if (prevQEndM <= 0) { prevQEndM += 12; prevQEndY--; }
    var prevQStartYM = curYear * 100 + 1;           // Янв curYear
    var prevQEndYM   = prevQEndY * 100 + prevQEndM;
    var MO_EFF = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    var effQLabel = 'Янв–' + MO_EFF[prevQEndM-1] + '\'' + String(prevQEndY).slice(2);

    // Карта plan_money.id → catType.
    // PLS-запись содержит plan_money_id — прямую FK на план. У плана есть category_id.
    var planMoneyTypeMap = {};
    var planMoneySubTypeMap = {};  // id → 'mat'|'smr'|'smrZ'|'other' (4 бакета для новой таблицы)
    (planItems || []).forEach(function(pm) {
      if (!pm.id) return;
      var catName = catMap[pm.category_id] || '';
      var t = getExpCatType(catName);
      if (t && t !== 'zero') planMoneyTypeMap[pm.id] = t;
      planMoneySubTypeMap[pm.id] = expSubType(catName);
    });

    // Карта plan_money.id → plan_paid_date (period-attribution PLS).
    // PLS-записи, введённые в текущем периоде, но относящиеся к прошлым периодам,
    // используют plan_paid_date плана как дату периода вместо p.date (даты ввода).
    var pmDateMap = {};
    (planItems || []).forEach(function(pm) {
      if (pm.id && pm.plan_paid_date) pmDateMap[pm.id] = pm.plan_paid_date;
    });
