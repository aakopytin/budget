<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сводный финансовый отчёт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    background: #f8f9fd;
    padding: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .title { font-size: 14px; font-weight: 700; color: #111827; }
  .subtitle { font-size: 10px; color: #9ca3af; margin-left: 8px; }
  .status-row { display: flex; gap: 6px; align-items: center; }
  #status { font-size: 10.5px; color: #d97706; }
  #refresh-btn {
    background: none;
    border: 1px solid #d1d5db;
    color: #6b7280;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #refresh-btn:hover { background: #f3f4f6; }
  #content { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { white-space: nowrap; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="header">
  <div>
    <span class="title">&#128202; Сводный финансовый отчёт</span>
    <span class="subtitle">Все суммы в тысячах рублей</span>
  </div>
  <div class="status-row">
    <span id="status">&#9679; инициализация...</span>
    <input type="date" id="sel-date" style="font-size:11px;border:1px solid #d1d5db;border-radius:4px;padding:2px 6px;color:#374151;background:#fff;cursor:pointer" title="Дата отчёта">
    <button id="refresh-btn" title="Обновить">&#8635;</button>
    <button id="export-btn" title="Выгрузить в Excel" style="font-size:11px;padding:3px 10px;border:1px solid #16a34a;border-radius:4px;background:#f0fdf4;color:#15803d;cursor:pointer;font-weight:600" onclick="exportWidgetToExcel()">&#8595; Excel</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>
</div>

<script>
(function () {
  'use strict';

  // Банковские счета для расчёта остатков (org_account_id)
  // ВСИП: 2-Альфа, 4-Совком, 5-РХСБ, 6-Сбер, 7-ВТБ, 8-Депозиты
  // ТТ:   18-Альфа ТТ (ВСИП)
  var VSIP_ACC_IDS = {2:1, 3:1, 4:1, 5:1, 6:1, 7:1, 8:1, 161:1, 166:1}; // 3=ИП и СС, 161=Прочие счета, 166=Альфа Т (ТБанк)
  var TT_ACC_IDS   = {18:1};

  // Справочники проектов
  var PID_MAP = {
    1:'Кемерово',
    6:'Десногорск',
    12:'Киров',
    23:'Сыктывкар',
    13:'Барнаул',
    9:'Рузаевка',
    3:'Ю-Сахалинск',
    25:'Ю-Сахалинск',
    7:'Иволгинск',
    10:'Большое Болдино',
    2:'Центр. договор',
    18:'Центр. договор',
    19:'Центр. договор',
    29:'Центр. договор',
    30:'Центр. договор',
    31:'Центр. договор',
    32:'Центр. договор',
    33:'Голутвинский',
    4:'Прочие',
    22:'Прочие',
    20:'Прочие',
    17:'Прочие',
    21:'Прочие',
    35:'Прочие/ Закрытые проекты',
    24:'Офис (ВСИП+ТТ)',
    26:'Офис (ВСИП+ТТ)'
  };

  var PROJECTS = [
    'Кемерово',
    'Десногорск',
    'Киров',
    'Сыктывкар',
    'Барнаул',
    'Рузаевка',
    'Ю-Сахалинск',
    'Иволгинск',
    'Большое Болдино',
    'Голутвинский',
    'Центр. договор',
    'Прочие',
    'Прочие/ Закрытые проекты',
    'Офис (ВСИП+ТТ)'
  ];

  // Проекты ОХР для финансовой деятельности
  var OXR_PIDS = {24:1, 26:1};

  // Категории, исключаемые из секций ДОХОДЫ/РАСХОДЫ
  var SKIP = {
    'Перевод между счетами (поступление)': 1,
    'Перевод между счетами (списание)': 1,
    'Получение кредита': 1,
    'Выплата кредита': 1,
    'Получение займа': 1,
    'Выплата займа': 1,
    'Проценты к уплате': 1
  };

  // Типы займов/кредитов — идут в финансовую деятельность, не в доходы/расходы
  var LOAN_CATS = {
    'Получение займа': 1,
    'Выплата займа': 1,
    'Получение кредита': 1,
    'Выплата кредита': 1
  };

  var INC_TYPES = {
    'Оказание услуг': 1,
    'Возврат ДС. за заказы': 1,
    'Проценты к получению': 1,
    'Прочий доход': 1
  };

  // Категории расходов с нулевой ставкой НДС (для планового расчёта)
  var ZERO_RATE_CATS = {
    'Зарплата': 1, 'Налоги с зарплаты': 1, 'Командировки': 1,
    'Страхование': 1, 'Расходы на услуги банков': 1, 'Банковские услуги': 1,
    'Налоги и взносы': 1, 'Налоги - НДС': 1, 'Налог - НДС': 1,
    'Проценты к уплате': 1
  };

  function getPlanExpVatRate(catName) {
    if (!catName) return 22 / 122;
    if (LOAN_CATS[catName] || SKIP[catName]) return 0;
    if (ZERO_RATE_CATS[catName]) return 0;
    return 22 / 122;
  }

  // Классифицирует название категории в тип для расчёта эффективной ставки НДС.
  // Возвращает null — категория исключается из расчёта (переводы, займы).
  // Возвращает 'zero' — НДС всегда 0%.
  // Возвращает строку типа — для подстановки эффективной ставки из фактических PLS.
  function getExpCatType(catName) {
    if (!catName) return 'proj_other';
    if (LOAN_CATS[catName]) return null;
    if (catName === 'Перевод между счетами (поступление)' ||
        catName === 'Перевод между счетами (списание)') return null;
    if (ZERO_RATE_CATS[catName]) return 'zero';
    var l = catName.toLowerCase();
    if (l.indexOf('без ндс') >= 0) return 'zero';
    if (/^смр/.test(l))      return 'smr';
    if (/^материал/.test(l)) return 'mat';
    if (l === 'проектирование-изыскание' || l.indexOf('изыскан') >= 0 ||
        l === 'составление исполнительной документации' ||
        l === 'услуги по сертификации' || l === 'тесты и испытания') return 'design';
    if (l.indexOf('банковские гарантии') >= 0) return 'bg';
    if (l.indexOf('аренд') >= 0) return 'ar';
    if (l.indexOf('лизинг') >= 0) return 'lz';
    if (l.indexOf('бухгалтер') >= 0) return 'buh';
    if (l.indexOf('возврат') >= 0) return 'ret';
    return 'proj_other';
  }

  // Ставки по умолчанию — применяются если нет фактических PLS-данных для данного типа
  var DEFAULT_EFF_RATES = {
    smr: 0, mat: 0, design: 0, bg: 0,
    ar: 0, lz: 0, buh: 0, proj_other: 0, zero: 0
  };

  function isIncome(t) { return !!INC_TYPES[t]; }

  function isExpense(t, proj) {
    if (proj === 'Офис (ВСИП+ТТ)') {
      // Для офисных проектов: всё кроме переводов, кредитов и займов (они — финансовая деятельность)
      return t !== 'Перевод между счетами (поступление)'
          && t !== 'Перевод между счетами (списание)'
          && t !== 'Получение кредита'
          && t !== 'Выплата кредита'
          && t !== 'Получение займа'
          && t !== 'Выплата займа';
    }
    if (SKIP[t]) return false;
    var l = t.toLowerCase();
    if ((proj === 'Прочие' || proj === 'Прочие/ Закрытые проекты') && t === 'Возвраты клиентам') return true;
    return (
      l.indexOf('материал') === 0 ||
      l.indexOf('смр') === 0 ||
      (l.indexOf('банков') >= 0 && l.indexOf('гарант') >= 0) ||
      l.indexOf('проектирован') >= 0 ||
      l.indexOf('изыскан') >= 0 ||
      l.indexOf('оборудован') >= 0 ||
      l.indexOf('мобилизац') >= 0 ||
      t === 'Командировки' ||
      t === 'Составление исполнительной документации' ||
      t === 'Услуги по сертификации' ||
      t === 'Тесты и испытания'
    );
  }

  var MS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

  var OFF_SUBCATS = [
    {code:'zp',  label:'Зарплата'},
    {code:'nzp', label:'Налоги с зарплаты'},
    {code:'km',  label:'Командировочные'},
    {code:'bk',  label:'Банковские комиссии'},
    {code:'lz',  label:'Лизинг'},
    {code:'ar',  label:'Аренда'},
    {code:'buh', label:'Бухгалтерия'},
    {code:'ntax',label:'Налоги и взносы'},
    {code:'pct', label:'Проценты к уплате'},
    {code:'bg',  label:'Банковские гарантии'},
    {code:'ret', label:'Возвраты клиентам'},
    {code:'po',  label:'Прочие офисные'}
  ];

  function offSubcat(name) {
    var l = name.toLowerCase();
    // "Налоги с зарплаты" содержит 'зарплат' — проверяем раньше, чем общий zp
    if (l.indexOf('налог') >= 0 && (l.indexOf('зарплат') >= 0 || l.indexOf('фот') >= 0)) return 'nzp';
    if (l.indexOf('зарплат') >= 0 || l.indexOf('фот') >= 0 || l.indexOf('оплата труда') >= 0) return 'zp';
    if (l.indexOf('командир') >= 0) return 'km';
    if (l.indexOf('гарант') >= 0) return 'bg';
    if (l.indexOf('лизинг') >= 0) return 'lz';
    if (l.indexOf('аренд') >= 0) return 'ar';
    if (l.indexOf('бухгалтер') >= 0 || l.indexOf('аудит') >= 0) return 'buh';
    if (l.indexOf('налог') >= 0 || l.indexOf('взнос') >= 0 || l.indexOf('страхов') >= 0
        || l.indexOf('усн') >= 0 || l.indexOf('ндс') >= 0 || l.indexOf('ифнс') >= 0
        || l.indexOf('пенсионн') >= 0 || l.indexOf('пфр') >= 0 || l.indexOf('фсс') >= 0
        || l.indexOf('ффомс') >= 0) return 'ntax';
    if (l.indexOf('процент') >= 0) return 'pct';
    if (l.indexOf('банков') >= 0 || l.indexOf('комисс') >= 0) return 'bk';
    if (l.indexOf('возврат') >= 0) return 'ret';
    return 'po';
  }

  function newOffBrk() {
    var r = {};
    OFF_SUBCATS.forEach(function(s) { r[s.code] = {f25:0, f26:0, fCur:0}; });
    return r;
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // Форматирование
  function fmtK(v, bold, neg_red) {
    if (!v) return '<span style="color:#ccc">—</span>';
    var absV = Math.abs(v) / 1000;
    var parts = absV.toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    var s = parts.join('.');
    var isNeg = v < 0;
    var wrapped = isNeg ? '(' + s + ')' : s;
    if (neg_red && isNeg) {
      return bold
        ? '<strong style="color:#dc2626">' + wrapped + '</strong>'
        : '<span style="color:#dc2626">' + wrapped + '</span>';
    }
    return bold ? '<strong>' + wrapped + '</strong>' : wrapped;
  }

  function fmtBal(v, bold) {
    if (!v && v !== 0) return '<span style="color:#ccc">—</span>';
    var absV = Math.abs(v) / 1000;
    var parts = absV.toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    var s = parts.join('.');
    var isNeg = v < 0;
    var wrapped = isNeg ? '(' + s + ')' : s;
    var col = isNeg ? '#dc2626' : '#059669';
    return bold
      ? '<strong style="color:' + col + '">' + wrapped + '</strong>'
      : '<span style="color:' + col + '">' + wrapped + '</span>';
  }

  // API через серверный прокси /api/data
  function fetchAll(entity, extra) {
    var all = [], page = 1;
    function next() {
      var p = new URLSearchParams();
      p.append('entity', entity);
      p.append('limit', '100');
      p.append('page', String(page));
      if (extra) Object.keys(extra).forEach(function(k) { p.append(k, extra[k]); });
      return fetch('/api/data?' + p.toString())
        .then(function(r) {
          if (!r.ok) throw new Error(entity + ' HTTP ' + r.status);
          return r.json();
        })
        .then(function(d) {
          if (d.error) throw new Error(entity + ': ' + JSON.stringify(d.error));
          var items = (d.response && d.response.items) || [];
          all = all.concat(items);
          var total = (d.response && d.response.total) || 0;
          if (all.length >= total || items.length < 100) return all;
          page++;
          return next();
        });
    }
    return next();
  }

  function fetchCategories() {
    return fetchAll('categories').then(function(items) {
      var map = {};
      items.forEach(function(c) { map[c.id] = c.name || ''; });
      return map;
    });
  }

  function fetchPlanMoney(curYear) {
    return fetchAll('plan_money').then(function(items) {
      return items.filter(function(i) {
        if (!i.plan_paid_date) return false;
        var iy = parseInt(i.plan_paid_date.substring(0, 4));
        return iy >= curYear;  // org_account_id фильтруется в Step 5
      });
    });
  }

  // Загрузка PLS-записей (НДС) за curYear и год до.
  // Запрос 1: без фильтра → 3157/3158 (исходящий/входящий НДС per-transaction).
  // Запрос 2: filter 3144 — точно по образцу nds.html (fetchAllPls).
  var _pls3144err = null;

  function fetchPls3144(curYear) {
    // Отдельный прокси /api/pls3144 — минует entity/ALLOWED логику /api/data
    var prevYear = curYear - 1;
    var now = new Date();
    var todayStr = now.getFullYear() + '-'
      + String(now.getMonth() + 1).padStart(2, '0') + '-'
      + String(now.getDate()).padStart(2, '0');
    var all = [], page = 1;
    function next() {
      return fetch('/api/pls3144?page=' + page)
        .then(function(r) {
          var status = r.status;
          return r.json().then(function(d) {
            if (status >= 400) {
              var why = d && d.error ? JSON.stringify(d.error).slice(0, 60) : ('HTTP ' + status);
              throw new Error('3144: ' + why);
            }
            if (d.error) throw new Error('3144: ' + JSON.stringify(d.error).slice(0, 60));
            var items = (d.response && d.response.items) || [];
            all = all.concat(items);
            var total = (d.response && d.response.total) || 0;
            if (all.length >= total || items.length < 100) return all;
            page++;
            return next();
          });
        });
    }
    return next();
  }

  function fetchPls(curYear) {
    _pls3144err = null;
    var prevYear = curYear - 1;
    // req1 может вернуть 400 "entity not allowed" — подавляем ошибку
    var req1 = fetchAll('transaction_pls').catch(function() { return []; });
    var req2 = fetchPls3144(curYear).catch(function(e) {
      _pls3144err = (e && e.message) ? e.message.slice(0, 80) : 'ошибка req2';
      console.warn('[fetchPls] req2 failed:', _pls3144err);
      return [];
    });
    return Promise.all([req1, req2]).then(function(res) {
      // Если req1 вернул данные — используем только его (req2 содержит те же записи,
      // конкатенация привела бы к двойному счёту).
      var combined = res[0].length > 0 ? res[0] : res[1];
      return combined.filter(function(i) {
        if (!i.date) return false;
        var iy = parseInt(i.date.substring(0, 4));
        // 3144 = НДС к вычету (input VAT, outcome) — единственная категория в transaction_pls
        // category_id=1000 (НДС начисленный) в transaction_pls не существует
        return (iy === curYear || iy === prevYear)
            && (i.category_id === 3144 || i.category_id === 3147 || i.category_id === 1000);
      });
    });
  }

  // Расчёт фактического НДС из PLS-записей
  // category 3158 (OUTPUT_VAT): income → НДС с поступлений
  // category 3157 (INPUT_VAT): outcome → НДС с выплат
  function calcVat(plsItems, curYear, curMonth) {
    var v = {in_25:0, in_26:0, in_cur:0, out_25:0, out_26:0, out_cur:0};
    plsItems.forEach(function(p) {
      var yr   = parseInt(p.date.slice(0, 4));
      var mo   = parseInt(p.date.slice(5, 7));
      var prev = (yr === curYear - 1);
      var cur  = (yr === curYear && mo === curMonth);
      if (p.category_id === 3158) {
        var a = parseFloat(p.income) || 0;
        if (prev) v.in_25 += a;
        else if (yr === curYear) { v.in_26 += a; if (cur) v.in_cur += a; }
      } else if (p.category_id === 3157) {
        var b = parseFloat(p.outcome) || 0;
        if (prev) v.out_25 += b;
        else if (yr === curYear) { v.out_26 += b; if (cur) v.out_cur += b; }
      }
    });
    return v;
  }

  // Расчёт факта + остатки + финансовая деятельность
  function calcFact(txns, catMap, curYear, curMonth, today) {
    var jan1  = curYear + '-01-01';

    var acc = {};
    PROJECTS.forEach(function(p) {
      acc[p] = { i25:0, e25:0, i26:0, e26:0, iCur:0, eCur:0 };
    });

    // Финансовая деятельность (только проекты 24 и 26)
    var fin = {
      skIn:  { f25:0, f26:0, fCur:0 },   // Получение займов
      skOut: { f25:0, f26:0, fCur:0 },   // Выдача займов
      int:   { f25:0, f26:0, fCur:0 },   // Процентные расходы (не-офис; офисные % — в offBrk.pct)
      trIn:  { f25:0, f26:0, fCur:0 },   // Переводы поступление
      trOut: { f25:0, f26:0, fCur:0 }    // Переводы списание
    };
    var offBrk = newOffBrk();

    // Остатки по банковским счетам
    var vSt = 0, tSt = 0, vEnd = 0, tEnd = 0;

    txns.forEach(function(tx) {
      var dt     = tx.date || '';
      var incAmt = parseFloat(tx.income)  || 0;
      var expAmt = parseFloat(tx.outcome) || 0;

      // Остатки по всем транзакциям банковских счетов
      var aid = tx.org_account_id;
      if (VSIP_ACC_IDS[aid]) {
        if (dt < jan1)   vSt  += incAmt - expAmt;
        if (dt <= today) vEnd += incAmt - expAmt;
      }
      if (TT_ACC_IDS[aid]) {
        if (dt < jan1)   tSt  += incAmt - expAmt;
        if (dt <= today) tEnd += incAmt - expAmt;
      }

      // Только текущий и прошлый год для факта
      var yr = parseInt(dt.slice(0, 4)) || 0;
      var mo = parseInt(dt.slice(5, 7)) || 0;
      if (yr !== curYear && yr !== curYear - 1) return;

      var typeName = catMap[tx.category_id] || '';
      var proj     = PID_MAP[tx.project_id];
      if (!proj) return;

      var isPrev = (yr === curYear - 1);
      var isCur  = (yr === curYear && mo === curMonth);
      var fKey   = isPrev ? 'f25' : 'f26';

      // Для текущего года: только транзакции до выбранной даты включительно
      if (!isPrev && dt > today) return;

      // Финансовая деятельность — только проекты 24 и 26
      if (OXR_PIDS[tx.project_id]) {
        if ((typeName === 'Получение кредита' || typeName === 'Получение займа') && incAmt > 0) {
          fin.skIn[fKey]  += incAmt; if (isCur) fin.skIn.fCur  += incAmt;
        }
        if ((typeName === 'Выплата кредита' || typeName === 'Выплата займа') && expAmt > 0) {
          fin.skOut[fKey] += expAmt; if (isCur) fin.skOut.fCur += expAmt;
        }
        // Проценты к уплате офисных проектов идут в offBrk.pct, не в fin.int
        if (typeName === 'Перевод между счетами (поступление)' && incAmt > 0) {
          fin.trIn[fKey]  += incAmt; if (isCur) fin.trIn.fCur  += incAmt;
        }
        if (typeName === 'Перевод между счетами (списание)' && expAmt > 0) {
          fin.trOut[fKey] += expAmt; if (isCur) fin.trOut.fCur += expAmt;
        }
        // Разбивка офисных расходов по подкатегориям
        if (expAmt && isExpense(typeName, 'Офис (ВСИП+ТТ)')) {
          var sub = offSubcat(typeName);
          var brk = offBrk[sub];
          if (isPrev) { brk.f25 += expAmt; }
          else { brk.f26 += expAmt; if (isCur) brk.fCur += expAmt; }
        }
      }

      // Доходы и расходы по проектам
      var a = acc[proj];
      if (incAmt > 0 && isIncome(typeName)) {
        if (isPrev) { a.i25 += incAmt; }
        else { a.i26 += incAmt; if (isCur) a.iCur += incAmt; }
      }
      if (expAmt && isExpense(typeName, proj)) {
        if (isPrev) { a.e25 += expAmt; }
        else { a.e26 += expAmt; if (isCur) a.eCur += expAmt; }
      }
    });

    return { acc:acc, fin:fin, offBrk:offBrk, vSt:vSt, tSt:tSt, vEnd:vEnd, tEnd:tEnd };
  }

  // Расчёт плана
  function calcPlan(planItems, curYear, curMonth, nextMonths, catMap) {
    var pm = {};
    PROJECTS.forEach(function(p) {
      pm[p] = { bi_plan:0, be_plan:0, hI:0, hE:0,
                bi_eb:0, be_eb:0, hI_eb:0, hE_eb:0,
                plan_i:[0,0,0,0,0,0], plan_e:[0,0,0,0,0,0] };
    });
    var offBrkPlan = {};
    OFF_SUBCATS.forEach(function(s) {
      offBrkPlan[s.code] = {be_plan:0, hE:0, hE_eb:0, plan_e:[0,0,0,0,0,0]};
    });
    // Плановые поступления/выплаты займов → финансовая деятельность
    var finPlan = {
      skIn:  {hI:0, plan:[0,0,0,0,0,0]},
      skOut: {hE:0, plan:[0,0,0,0,0,0]}
    };

    planItems.forEach(function(item) {
      if (item.org_account_id !== 36) return;  // только ВСИП Бюджетный лимит
      var proj = PID_MAP[item.project_id];
      if (!proj) return;
      var iy  = parseInt(item.plan_paid_date.substring(0, 4));
      var im  = parseInt(item.plan_paid_date.substring(5, 7));
      var val = item.total || 0;
      var isI = (item.type === 30), isE = (item.type === 40);

      // Займы/кредиты в офисных проектах → финансовая деятельность, не в pm
      if (OXR_PIDS[item.project_id]) {
        var catName = (catMap && catMap[item.category_id]) || '';
        if (LOAN_CATS[catName]) {
          if (iy === curYear && im === curMonth) {
            if (isI) finPlan.skIn.hI  += val;
            if (isE) finPlan.skOut.hE += val;
          }
          nextMonths.forEach(function(nm, idx) {
            var nmYM = nm.year * 100 + nm.month, itemYM = iy * 100 + im;
            var match = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
            if (match) {
              if (isI) finPlan.skIn.plan[idx]  += val;
              if (isE) finPlan.skOut.plan[idx] += val;
            }
          });
          return; // не попадает в pm и offBrkPlan
        }
      }

      // Операционные статьи — как прежде
      var d = pm[proj];
      if (iy > curYear || (iy === curYear && im >= curMonth)) {
        if (isI) d.bi_plan += val;
        if (isE) d.be_plan += val;
      }
      if (iy === curYear && im === curMonth) {
        if (isI) d.hI += val;
        if (isE) d.hE += val;
      }
      nextMonths.forEach(function(nm, idx) {
        // Последний столбец (idx=5) накапливает все месяцы начиная с 6-го
        var nmYM   = nm.year * 100 + nm.month;
        var itemYM = iy * 100 + im;
        var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
        if (match) {
          if (isI) d.plan_i[idx] += val;
          if (isE) d.plan_e[idx] += val;
        }
      });
      // Разбивка плана по подкатегориям для офисных проектов
      if (OXR_PIDS[item.project_id] && isE) {
        var sub = offSubcat(catName || (catMap && catMap[item.category_id]) || '');
        var obp = offBrkPlan[sub];
        if (iy > curYear || (iy === curYear && im >= curMonth)) obp.be_plan += val;
        if (iy === curYear && im === curMonth) obp.hE += val;
        nextMonths.forEach(function(nm, idx) {
          var nmYM   = nm.year * 100 + nm.month;
          var itemYM = iy * 100 + im;
          var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
          if (match) obp.plan_e[idx] += val;
        });
      }
    });
    // Внебюджетный лимит (org_account_id=150)
    planItems.forEach(function(item) {
      if (item.org_account_id !== 150) return;
      var proj = PID_MAP[item.project_id];
      if (!proj || !pm[proj]) return;
      var iy  = parseInt(item.plan_paid_date.substring(0, 4));
      var im  = parseInt(item.plan_paid_date.substring(5, 7));
      var val = item.total || 0;
      var isI = (item.type === 30), isE = (item.type === 40);
      var d = pm[proj];
      if (iy > curYear || (iy === curYear && im >= curMonth)) {
        if (isI) d.bi_eb += val;
        if (isE) d.be_eb += val;
      }
      if (iy === curYear && im === curMonth) {
        if (isI) d.hI_eb += val;
        if (isE) d.hE_eb += val;
      }
      // Разбивка внебюджета по подкатегориям для офисных проектов
      if (OXR_PIDS[item.project_id] && isE && iy === curYear && im === curMonth) {
        var catNameEb = (catMap && catMap[item.category_id]) || '';
        var subEb = offSubcat(catNameEb);
        if (offBrkPlan[subEb]) offBrkPlan[subEb].hE_eb += val;
      }
    });
    return {pm: pm, offBrkPlan: offBrkPlan, finPlan: finPlan};
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // НДС ПРОГНОЗ — расчёт и отображение
  // ═══════════════════════════════════════════════════════════════════════════

  function calcVatForecast(txns, planItems, plsItems, catMap, curYear, curMonth, today) {
    // Текущий квартал: первый месяц квартала
    var q0m = curMonth <= 3 ? 1 : curMonth <= 6 ? 4 : curMonth <= 9 ? 7 : 10;
    var curYM = curYear * 100 + curMonth;

    // 9 колонок: Q0 + Q+1 + Q+2
    var cols = [];
    for (var qi = 0; qi < 9; qi++) {
      var cm = q0m + qi, cy = curYear;
      while (cm > 12) { cm -= 12; cy++; }
      cols.push({y: cy, m: cm, ym: cy * 100 + cm});
    }
    // Далее: всё после 9-го месяца
    var dalM = cols[8].m + 1, dalY = cols[8].y;
    if (dalM > 12) { dalM = 1; dalY++; }
    var dalYM = dalY * 100 + dalM;

    // ── Шаг 1: вычисляем эффективные ставки по категориям из фактических PLS ─
    var TR_PID = 27;  // project_id переводов ВСИП↔ТТ, как в nds.html

    // Период для расчёта ставок = все завершённые кварталы curYear (Янв–конец предыдущего квартала).
    var prevQEndM = q0m - 1, prevQEndY = curYear;
    if (prevQEndM <= 0) { prevQEndM += 12; prevQEndY--; }
    var prevQStartYM = curYear * 100 + 1;           // Янв curYear
    var prevQEndYM   = prevQEndY * 100 + prevQEndM;
    var MO_EFF = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    var effQLabel = 'Янв–' + MO_EFF[prevQEndM-1] + '\'' + String(prevQEndY).slice(2);

    // Карта plan_money.id → catType.
    // PLS-запись содержит plan_money_id — прямую FK на план. У плана есть category_id.
    var planMoneyTypeMap = {};
    (planItems || []).forEach(function(pm) {
      if (!pm.id) return;
      var catName = catMap[pm.category_id] || '';
      var t = getExpCatType(catName);
      if (t && t !== 'zero') planMoneyTypeMap[pm.id] = t;
    });

    // Суммируем фактические расходы и НДС по типам за весь curYear.
    var effExpByType = {}, effVatByType = {};
    txns.forEach(function(tx) {
      var aid = tx.org_account_id;
      if (!VSIP_ACC_IDS[aid] && !TT_ACC_IDS[aid]) return;
      var txDate = tx.date || '';
      if (txDate.length < 7) return;
      var txYM = parseInt(txDate.slice(0,4)) * 100 + parseInt(txDate.slice(5,7));
      if (txYM < prevQStartYM || txYM > prevQEndYM) return;
      var catName = catMap[tx.category_id] || '';
      var expAmt = parseFloat(tx.outcome) || 0;
      if (!expAmt) return;
      var t = getExpCatType(catName);
      if (!t || t === 'zero') return;
      effExpByType[t] = (effExpByType[t] || 0) + expAmt;
    });
    // PLS 3144 — НДС к вычету за весь curYear. ВСИП + ТТ, без трансферов (project_id=27).
    // Классификация только через plan_money_id → planMoneyTypeMap.
    // reference_id → tx.id НЕ является надёжной ссылкой (разные суммы), fallback убран.
    (plsItems || []).forEach(function(p) {
      if (p.category_id !== 3144) return;
      if (p.project_id === TR_PID) return;
      var pEffDate = p.date || '';
      if (pEffDate.length < 7) return;
      var pEffYM = parseInt(pEffDate.slice(0,4)) * 100 + parseInt(pEffDate.slice(5,7));
      if (pEffYM < prevQStartYM || pEffYM > prevQEndYM) return;
      var vatAmt = parseFloat(p.outcome) || 0;
      if (!vatAmt) return;
      var t = planMoneyTypeMap[p.plan_money_id];
      if (!t) return;
      effVatByType[t] = (effVatByType[t] || 0) + vatAmt;
    });

    // Эффективная ставка = НДС / Расходы.
    // Если числитель = 0 (нет PLS-данных или привязка не сработала) — берём DEFAULT_EFF_RATES.
    var effRates = {};
    ['smr', 'mat', 'design', 'bg', 'ar', 'lz', 'buh', 'proj_other'].forEach(function(t) {
      var denom = effExpByType[t] || 0;
      var numer = effVatByType[t] || 0;
      effRates[t] = (denom > 0 && numer > 0) ? Math.min(numer / denom, 22/122) : DEFAULT_EFF_RATES[t];
    });
    effRates['zero'] = 0;
    effRates['ret']  = 22 / 122;  // возвраты клиентам — ставка НДС всегда 22%
    // Жёсткие ставки: Материалы → 22/122, СМР → 5/105 (статьи «Без НДС» уже→'zero'→0)
    effRates['mat'] = 22 / 122;
    effRates['smr'] = 5 / 105;

    // ── Шаг 2: инициализируем слоты данных ───────────────────────────────
    function makeSlot() {
      return {
        inc: 0, exp: 0, vatIn: 0, vatOut: 0,
        incFact: 0, expFact: 0, expFactBud: 0, vatInFact: 0, vatOutFact: 0,
        incPlan: 0, expPlan: 0, vatInPlan: 0, vatOutPlan: 0,
        vatInByProj: {}, vatOutByProj: {},
        vatInPlanByProj: {}, vatOutPlanByProj: {}
      };
    }
    var data = cols.map(function(c) {
      var s = makeSlot();
      s.y = c.y; s.m = c.m; s.ym = c.ym;
      s.isPast    = c.ym < curYM;
      s.isCurrent = c.ym === curYM;
      return s;
    });
    var dal = makeSlot();

    // ── Шаг 2b: множество бюджетных (project_id, category_id) из acc=36 по месяцу ─
    // Ключ: ym → catName → 1. Используется для вычисления остатка бюджета.
    var budgetedCatsByYM = {};
    (planItems || []).forEach(function(item) {
      if (item.org_account_id !== 36 || item.type !== 40) return;
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var catName = catMap[item.category_id] || '';
      if (!catName) return;
      if (!budgetedCatsByYM[pYM]) budgetedCatsByYM[pYM] = {};
      budgetedCatsByYM[pYM][catName] = 1;
    });

    // ── Шаг 3: факт — транзакции ──────────────────────────────────────────
    var rejectedIncCats = {};
    var expFactCurByProj = {};  // per-project expFact current month (for debug table)
    txns.forEach(function(tx) {
      var dt = tx.date || '';
      if (dt.length < 7) return;
      var tYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var aid = tx.org_account_id;
      if (!VSIP_ACC_IDS[aid] && !TT_ACC_IDS[aid]) return;
      var catName  = catMap[tx.category_id] || '';
      var projName = PID_MAP[tx.project_id] || '';
      if (catName === 'Перевод между счетами (поступление)' ||
          catName === 'Перевод между счетами (списание)') return;
      if (LOAN_CATS[catName]) return;  // займы — финансовая деятельность, не в НДС
      var incAmt = parseFloat(tx.income)  || 0;
      var expAmt = parseFloat(tx.outcome) || 0;
      var isInc = isIncome(catName);
      var isExp = isExpense(catName, projName);
      for (var ci = 0; ci < 9; ci++) {
        if (cols[ci].ym === tYM && (data[ci].isPast || data[ci].isCurrent)) {
          if (data[ci].isCurrent && today && dt > today) break;  // текущий месяц: только до выбранной даты
          if (incAmt > 0 && isInc) data[ci].incFact += incAmt;
          if (incAmt > 0 && !isInc) rejectedIncCats[catName] = (rejectedIncCats[catName] || 0) + incAmt;
          if (expAmt && isExp) {
            data[ci].expFact += expAmt;  // весь isExpense-факт, включая сторно (отрицательные)
            if (budgetedCatsByYM[tYM] && budgetedCatsByYM[tYM][catName])
              data[ci].expFactBud += expAmt;
            if (data[ci].isCurrent && projName)
              expFactCurByProj[projName] = (expFactCurByProj[projName] || 0) + expAmt;
          }
          break;
        }
      }
    });

    // ── Шаг 4a: vatInFact = НДС к вычету из PLS cat=3144 (нетто = outcome − income)
    // Алгоритм Виджета НДС (группа): cat=3144 = НДС входящий по каждой транзакции.
    // Квартальный расчётный платёж (project_id=27) исключаем — он не является вычетом.
    // Знаковая конвенция: vatIn > vatOut → к возмещению (vfFactVatRes > 0, _vF < 0 → положит. число в карточке).
    (plsItems || []).forEach(function(p) {
      if (p.category_id !== 3144) return;
      if (p.project_id === TR_PID) return;
      var dt = p.date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var pn = PID_MAP[p.project_id] || 'Прочие';
      for (var ci = 0; ci < 9; ci++) {
        if (cols[ci].ym === pYM && (data[ci].isPast || data[ci].isCurrent)) {
          if (data[ci].isCurrent && today && dt > today) break;
          var amt4a = (parseFloat(p.outcome) || 0) - (parseFloat(p.income) || 0);  // нетто
          if (!amt4a) break;
          data[ci].vatInFact += amt4a;
          data[ci].vatInByProj[pn] = (data[ci].vatInByProj[pn] || 0) + amt4a;
          break;
        }
      }
    });

    // ── Шаг 4b: vatOutFact = НДС начисленный из PLS cat=1000 (income = output VAT)
    // Алгоритм Виджета НДС (группа): cat=1000 = НДС исходящий с выручки.
    // Переводы ВСИП↔ТТ (project_id=27) исключаем — они взаимно компенсируются в группе.
    (plsItems || []).forEach(function(p) {
      if (p.category_id !== 1000) return;
      if (p.project_id === TR_PID) return;
      var dt = p.date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var pn = PID_MAP[p.project_id] || 'Прочие';
      for (var ci = 0; ci < 9; ci++) {
        if (cols[ci].ym === pYM && (data[ci].isPast || data[ci].isCurrent)) {
          if (data[ci].isCurrent && today && dt > today) break;
          var amt4b = parseFloat(p.income) || 0;
          if (!amt4b) break;
          data[ci].vatOutFact += amt4b;
          data[ci].vatOutByProj[pn] = (data[ci].vatOutByProj[pn] || 0) + amt4b;
          break;
        }
      }
    });

    // ── Шаг 5: план — только ВСИП Бюджетный лимит (org_account_id=36) ────
    (planItems || []).forEach(function(item) {
      if (item.org_account_id !== 36) return;  // только ВСИП Бюджет (план)
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var val     = item.total || 0;
      var isI     = item.type === 30;
      var isE     = item.type === 40;
      var catName = catMap[item.category_id] || '';
      if (catName === 'Перевод между счетами (поступление)' ||
          catName === 'Перевод между счетами (списание)') return;
      if (LOAN_CATS[catName]) return;  // займы — финансовая деятельность, без НДС
      var tgt = null;
      if (pYM >= dalYM) {
        tgt = dal;
      } else {
        for (var ci = 0; ci < 9; ci++) {
          if (cols[ci].ym === pYM) { tgt = data[ci]; break; }
        }
      }
      if (!tgt) return;
      var pn5 = PID_MAP[item.project_id] || 'Прочие';
      if (isI) {
        tgt.incPlan += val;
        var zeroIncCats = {'Прочий доход':1,'Проценты к получению':1,'Получение займов':1};
        if (!zeroIncCats[catName]) {
          var vi5 = Math.round(val * 22 / 122);
          tgt.vatInPlan += vi5;
          tgt.vatInPlanByProj[pn5] = (tgt.vatInPlanByProj[pn5] || 0) + vi5;
        }
      }
      if (isE) {
        var t = getExpCatType(catName);
        var rOut = (t && t !== null) ? (effRates[t] || 0) : 0;
        if (OXR_PIDS[item.project_id] && offSubcat(catName) === 'po') rOut = 0;
        var vo5 = Math.round(val * rOut);
        tgt.expPlan    += val;
        tgt.vatOutPlan += vo5;
        tgt.vatOutPlanByProj[pn5] = (tgt.vatOutPlanByProj[pn5] || 0) + vo5;
      }
    });

    // ── Шаг 5b: план — Внебюджетный лимит (org_account_id=150) ──────────
    (planItems || []).forEach(function(item) {
      if (item.org_account_id !== 150) return;
      if (item.type !== 40 && item.type !== 30) return;  // расходы и доходы
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var val     = item.total || 0;
      var catName = catMap[item.category_id] || '';
      // VAT_REFUND_CATS: LOAN_CATS-статьи с возможным НДС (возвраты депозитов и т.п.)
      // Для них добавляем только vatInPlan (оценка), но НЕ incPlan.
      var VAT_REFUND_CATS = {'Возврат ДС. за заказы': 1};
      if (LOAN_CATS[catName]) {
        if (VAT_REFUND_CATS[catName] && item.type === 30) {
          var tgtR = null;
          if (pYM >= dalYM) { tgtR = dal; } else {
            for (var ri = 0; ri < 9; ri++) { if (cols[ri].ym === pYM) { tgtR = data[ri]; break; } }
          }
          if (tgtR) tgtR.vatInPlan += Math.round(val * 22 / 122);
        }
        return;
      }
      var tgt = null;
      if (pYM >= dalYM) {
        tgt = dal;
      } else {
        for (var ci = 0; ci < 9; ci++) {
          if (cols[ci].ym === pYM) { tgt = data[ci]; break; }
        }
      }
      if (!tgt) return;
      var pn5b = PID_MAP[item.project_id] || 'Прочие';
      if (item.type === 40) {  // расходы
        var t = getExpCatType(catName);
        var rOut = (t && t !== null) ? (effRates[t] || 0) : 0;
        var vo5b = Math.round(val * rOut);
        tgt.expPlan    += val;
        tgt.vatOutPlan += vo5b;
        tgt.vatOutPlanByProj[pn5b] = (tgt.vatOutPlanByProj[pn5b] || 0) + vo5b;
      } else {  // доходы (type=30)
        var zeroIncCats = {'Прочий доход':1,'Проценты к получению':1,'Получение займов':1};
        tgt.incPlan    += val;
        if (!zeroIncCats[catName]) {
          var vi5b = Math.round(val * 22 / 122);
          tgt.vatInPlan += vi5b;
          tgt.vatInPlanByProj[pn5b] = (tgt.vatInPlanByProj[pn5b] || 0) + vi5b;
        }
      }
    });

    // ── Шаг 5c: фактический НДС из plsItems cat=3144 по plan_money_id внебюджета ──
    var ebPlanIds = {}, ebExpPlanIds = {};
    (planItems || []).forEach(function(item) {
      if (item.org_account_id === 150 && item.id) {
        ebPlanIds[item.id] = true;
        if (item.type === 40) ebExpPlanIds[item.id] = true;  // только расходные EB-позиции
      }
    });
    // paidPmIds — план-пункты с фактическим платежом (из txns)
    var paidPmIds = {};
    txns.forEach(function(tx) {
      var pmId = tx.plan_money_id;
      if (!pmId || !ebPlanIds[pmId]) return;
      var dt = tx.date || '';
      if (!today || dt <= today) paidPmIds[pmId] = true;
    });
    // ebPmVatMap — реальный НДС из PLS cat=3144/3147 по ВБ-позициям
    // vfEbVatPaid — только оплаченные ВБ-платежи (PLS 3144/3147), используется в формуле планового НДС
    var ebPmVatMap = {}, vfEbVatAdj = 0, vfEbVatPaid = 0;
    (plsItems || []).forEach(function(p) {
      var pmId = p.plan_money_id;
      if (!pmId || !ebPlanIds[pmId]) return;
      var dt = p.date || '';
      if (today && dt > today) return;
      if (p.category_id === 3144) {
        var v = parseFloat(p.outcome) || 0;
        vfEbVatAdj += v;
        vfEbVatPaid += v;
        ebPmVatMap[pmId] = (ebPmVatMap[pmId] || 0) + v;
      } else if (p.category_id === 3147) {
        var v = parseFloat(p.income) || 0;
        vfEbVatAdj -= v;
        vfEbVatPaid -= v;
        ebPmVatMap[pmId] = (ebPmVatMap[pmId] || 0) - v;
      }
    });
    // Для неоплаченных внебюджетных позиций добавляем расчётный НДС по эффективной ставке
    // (чтобы reserve учитывал чистый расход, как в таблице buildEbDetails)
    (planItems || []).forEach(function(item) {
      if (item.org_account_id !== 150 || item.type !== 40) return;
      if (paidPmIds[item.id]) return;
      var iy = parseInt((item.plan_paid_date || '').substring(0, 4));
      var im = parseInt((item.plan_paid_date || '').substring(5, 7));
      if (iy < curYear || (iy === curYear && im < curMonth)) return;
      var catName = (catMap || {})[item.category_id] || '';
      var t = getExpCatType(catName);
      var rate = (t && t !== null) ? (effRates[t] || 0) : 0;
      vfEbVatAdj += (item.total || 0) * rate;
    });
    // vfEbExpAdj: замена плановой валовой суммы на фактическую (для _expOst)
    // Только расходные EB-позиции (type=40); EB-приходы не влияют на ожидаемые расходы
    var ebActualGross = 0;
    txns.forEach(function(tx) {
      var pmId = tx.plan_money_id;
      if (!pmId || !ebExpPlanIds[pmId]) return;
      var dt = tx.date || '';
      if (today && dt > today) return;
      var catName = catMap[tx.category_id] || '';
      if (LOAN_CATS[catName]) return;
      if (tx.category_id === 3144 || tx.category_id === 3147) return;
      ebActualGross += (parseFloat(tx.outcome) || 0) - (parseFloat(tx.income) || 0);
    });
    var ebPlanGrossForPaid = 0;
    (planItems || []).forEach(function(item) {
      if (item.org_account_id === 150 && item.type === 40 && paidPmIds[item.id])
        ebPlanGrossForPaid += item.total || 0;
    });
    var vfEbExpAdj = ebActualGross - ebPlanGrossForPaid;

    // ── Шаг 5d: коррекция vatOutPlan / vatInPlan для оплаченных ВБ-позиций ─
    // Шаг 5a добавил расчётный НДС по эффективной ставке (vatEst) в vatOutPlan/vatInPlan.
    // Если фактический НДС из PLS 3144/3147 уже известен — заменяем оценку фактом.
    // Если PLS ещё нет (например, та же дата, квартальная уплата не произошла) —
    // оставляем оценку как есть, чтобы резерв менялся на НЕТТО, а не на БРУТТО.
    // В ebPmVatMap: type=40 → положительное (3144); type=30 → отрицательное (3147).
    var _zeroIncCats = {'Прочий доход':1,'Проценты к получению':1,'Получение займов':1};
    (planItems || []).forEach(function(item) {
      if (item.org_account_id !== 150) return;
      if (!paidPmIds[item.id]) return;  // только оплаченные
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var tgt = null;
      if (pYM >= dalYM) { tgt = dal; } else {
        for (var ci = 0; ci < 9; ci++) { if (cols[ci].ym === pYM) { tgt = data[ci]; break; } }
      }
      if (!tgt) return;
      var catName = catMap[item.category_id] || '';
      if (item.type === 40) {  // расходы: корректируем vatOutPlan
        var t = LOAN_CATS[catName] ? null : getExpCatType(catName);
        var rOut   = (t && t !== null) ? (effRates[t] || 0) : 0;
        var vatEst = Math.round((item.total || 0) * rOut);
        var vatReal_raw = ebPmVatMap[item.id];               // undefined если PLS нет
        if (vatReal_raw !== undefined) {
          // PLS 3144 есть — заменяем расчётную оценку фактическим НДС
          tgt.vatOutPlan += (vatReal_raw - vatEst);
        }
        // Нет PLS — оставляем vatEst без изменений
      } else if (item.type === 30) {  // доходы: корректируем vatInPlan
        var _vatRefundCats = {'Возврат ДС. за заказы': 1};
        var vatEst  = (_vatRefundCats[catName] || (!LOAN_CATS[catName] && !_zeroIncCats[catName]))
          ? Math.round((item.total || 0) * 22 / 122) : 0;
        var vatReal_raw = ebPmVatMap[item.id];               // undefined если PLS нет
        if (vatReal_raw !== undefined) {
          var vatReal = -vatReal_raw;                        // 3147 хранится отрицательным
          tgt.vatInPlan += (vatReal - vatEst);
        }
      }
    });

    // ── Шаг 6: итоговые значения — факт / факт+остаток / план ────────────
    data.forEach(function(col) {
      if (col.isPast) {
        col.inc    = col.incFact;
        col.exp    = col.expFact;
        col.vatIn  = col.vatInFact;
        col.vatOut = col.vatOutFact;
      } else if (col.isCurrent) {
        col.inc   = col.incPlan > 0 ? Math.max(col.incFact, col.incPlan) : col.incFact;
        col.vatIn = col.vatInPlan > 0 ? Math.max(col.vatInFact, col.vatInPlan) : col.vatInFact;
        var remExp  = Math.max(0, col.expPlan - col.expFact);  // остаток плана по всем фактическим (как в верхней таблице)
        col.exp     = col.expFact + remExp;
        // Симметрично vatIn: max(fact, plan) — не меняется при вводе новых расходов, пока факт < плана
        col.vatOut  = col.vatOutPlan > 0 ? Math.max(col.vatOutFact, col.vatOutPlan) : col.vatOutFact;
      } else {
        col.inc    = col.incPlan;
        col.exp    = col.expPlan;
        col.vatIn  = col.vatInPlan;
        col.vatOut = col.vatOutPlan;
      }
    });
    dal.inc    = dal.incPlan;
    dal.exp    = dal.expPlan;
    dal.vatIn  = dal.vatInPlan;
    dal.vatOut = dal.vatOutPlan;

    var pls3144all    = (plsItems||[]).filter(function(p){return p.category_id===3144;});
    var pls3144count  = pls3144all.length;
    var pls3144tr     = pls3144all.filter(function(p){return p.project_id===TR_PID;});
    var pls3144trSum  = pls3144tr.reduce(function(s,p){return s+(parseFloat(p.outcome)||0);},0);
    var pmMapKeys     = Object.keys(planMoneyTypeMap).length;

    // Корректировка НДС: project_id=36 (Проект Корректировки НДС), org_account_id=149, текущий квартал
    // type=30 (доход = возврат НДС), type=40 (расход = НДС к уплате)
    var vatAdjInc = 0, vatAdjExp = 0;
    var qEndM = q0m + 2, qEndY = curYear;
    while (qEndM > 12) { qEndM -= 12; qEndY++; }
    var qStartYM = curYear * 100 + q0m;
    var qEndYM   = qEndY  * 100 + qEndM;
    (planItems || []).forEach(function(item) {
      if (item.project_id !== 36) return;
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0,4)) * 100 + parseInt(dt.slice(5,7));
      if (pYM < qStartYM || pYM > qEndYM) return;
      if (item.type === 30) vatAdjInc += parseFloat(item.total) || 0;
      if (item.type === 40) vatAdjExp += parseFloat(item.total) || 0;
    });
    var vatAdj = vatAdjInc - vatAdjExp;  // положительное = чистый возврат НДС (снижает к уплате)

    // Агрегаты Факт/ИТОГО по НДС — для сводной карточки
    // vfFVI/vfFVO = "Ожидаемый текущий НДС":
    //   прошедшие месяцы → PLS-факт (3144/3147), т.к. квартальные платежи уже проведены
    //   текущий месяц → лучшая оценка (col.vatIn/vatOut = max(PLS-факт, план от транзакций)),
    //   т.к. PLS 3144 за текущий квартал появится только после квартальной уплаты
    var vfFVI = 0, vfFVO = 0, vfTVI = 0, vfTVO = 0;
    data.forEach(function(c) {
      vfTVI += c.vatIn; vfTVO += c.vatOut;
      if (c.isPast || c.isCurrent) {
        vfFVI += c.vatInFact;
        vfFVO += c.vatOutFact;
      }
    });
    vfTVI += dal.vatIn; vfTVO += dal.vatOut;
    // vatAdj (project_id=36 плановые корректировки) НЕ включаем в factVatRes —
    // чтобы _vF совпадало с расчётом Виджета НДС (только PLS 3144 + 1000, без плановых корр.)
    var vfFactVatRes  = vfFVI - vfFVO;   // <0 = к возмещению, >0 = к уплате; _vF = -(vfFactVatRes) → >0 = к возмещению в карточке
    var vfItogoVatRes = vfTVI - vfTVO;  // итого план без vatAdj — чтобы _vP = -progVatRes (нижняя таблица)

    return {data: data, dal: dal, cols: cols, curYM: curYM, q0m: q0m, dalYM: dalYM,
            effRates: effRates, effExpByType: effExpByType, effVatByType: effVatByType,
            pls3144count: pls3144count, pls3144trSum: pls3144trSum,
            pmMapKeys: pmMapKeys, effQLabel: effQLabel,
            rejectedIncCats: rejectedIncCats,
            vatAdj: vatAdj,
            vfFactVatRes: vfFactVatRes,
            vfItogoVatRes: vfItogoVatRes,
            vfEbVatAdj: vfEbVatAdj, vfEbVatPaid: vfEbVatPaid, ebPmVatMap: ebPmVatMap, paidPmIds: paidPmIds, vfEbExpAdj: vfEbExpAdj,
            expFactCurByProj: expFactCurByProj};
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // СВОДНАЯ КАРТОЧКА — прогноз движения денежных средств (над Сводным отчётом)
  // ═══════════════════════════════════════════════════════════════════════════
  function buildSummaryCard(sd) {
    var K = 1000;
    function fK(v) {
      if (v === null || v === undefined) return '<span style="color:#9ca3af">—</span>';
      var abs = Math.round(Math.abs(v) / K);
      var s = abs.toLocaleString('ru-RU');
      if (v === 0) return '<span style="color:#9ca3af">0</span>';
      var clr = v < 0 ? '#dc2626' : '#15803d';
      var sgn = v < 0 ? '−' : '+';
      return '<span style="color:' + clr + ';font-weight:600">' + sgn + '&thinsp;' + s + '</span>';
    }
    function fKbal(v) {  // для остатка ДС: без знака, просто число
      var abs = Math.round(Math.abs(v) / K);
      var s = abs.toLocaleString('ru-RU');
      var clr = v < 0 ? '#dc2626' : '#1d4ed8';
      return '<span style="color:' + clr + ';font-weight:700">' + s + '</span>';
    }
    var CS = 'border-collapse:collapse;font-family:sans-serif;font-size:12px';
    var row = function(label, valHtml, bg, bTop) {
      var bgS  = bg   ? 'background:' + bg + ';' : '';
      var btS  = bTop ? 'border-top:2px solid #9ca3af;' : 'border-top:1px solid #f0f0f0;';
      return '<tr style="' + bgS + '">'
        + '<td style="padding:5px 14px 5px 8px;' + btS + 'white-space:nowrap;color:#374151">' + label + '</td>'
        + '<td style="padding:5px 8px;text-align:right;' + btS + 'white-space:nowrap">' + valHtml + '</td>'
        + '</tr>';
    };
    // reserve = -(cashBal + incOst - expOst + finOst + vatFact + vatPlan) → сумма строк = 0
    var planned = sd.cashBalance + sd.incOst - sd.expOst + sd.finOst + sd.vatFact + sd.vatPlan + sd.reserve;
    return '<div style="margin-bottom:20px">'
      + '<div style="font-size:10px;font-weight:700;color:#6b7280;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px">Прогноз движения денежных средств</div>'
      + '<table style="' + CS + '">'
      + row('Остаток денежных средств на ' + sd.dateStr, fKbal(sd.cashBalance), '', false)
      + row('Ожидаемые приходы',      fK(sd.incOst),           '', false)
      + row('Ожидаемые расходы',      fK(-sd.expOst),          '', false)
      + row('Ожидаемые займы',        fK(sd.finOst),           '', false)
      + row('Ожидаемый текущий НДС',  fK(sd.vatFact),          '', false)
      + row('Ожидаемый плановый НДС', fK(sd.vatPlan),          '', false)
      + row('Изменение резерва',      fK(sd.reserve),          '#fefce8', false)
      + row('<strong>Планируемый доход</strong>', '<strong>' + fK(planned) + '</strong>', '#f0fdf4', true)
      + '</table></div>';
  }

  function buildVatForecastTable(vf) {
    if (!vf) return '';
    var data = vf.data, dal = vf.dal, cols = vf.cols;

    // Факт = сумма по прошедшим и текущему месяцам
    var factInc = 0, factVatIn = 0, factExp = 0, factVatOut = 0;
    var factVatInByProj = {}, factVatOutByProj = {};
    data.forEach(function(c) {
      if (c.isPast || c.isCurrent) {
        factInc    += c.incFact;
        factVatIn  += c.vatInFact;
        factExp    += c.expFact;
        factVatOut += c.vatOutFact;
        Object.keys(c.vatInByProj).forEach(function(pn) {
          factVatInByProj[pn] = (factVatInByProj[pn] || 0) + c.vatInByProj[pn];
        });
        Object.keys(c.vatOutByProj).forEach(function(pn) {
          factVatOutByProj[pn] = (factVatOutByProj[pn] || 0) + c.vatOutByProj[pn];
        });
      }
    });

    // Прогноз = оставшийся план (сумма c.inc/exp по всем месяцам − факт + Далее)
    var progInc = 0, progVatIn = 0, progExp = 0, progVatOut = 0;
    data.forEach(function(c) {
      progInc    += c.inc;
      progVatIn  += c.vatIn;
      progExp    += c.exp;
      progVatOut += c.vatOut;
    });
    progInc    += dal.inc;    progVatIn  += dal.vatIn;
    progExp    += dal.exp;    progVatOut += dal.vatOut;
    data.forEach(function(c) {
      if (c.isPast || c.isCurrent) {
        progInc    -= c.incFact;    progVatIn  -= c.vatInFact;
        progExp    -= c.expFact;    progVatOut -= c.vatOutFact;
      }
    });

    // ИТОГО ПЛАН = Факт + Прогноз
    var itogoInc    = factInc    + progInc;
    var itogoVatIn  = factVatIn  + progVatIn;
    var itogoExp    = factExp    + progExp;
    var itogoVatOut = factVatOut + progVatOut;

    // Прогноз НДС по проектам = план будущих месяцев + Далее
    var progVatInByProj = {}, progVatOutByProj = {};
    data.forEach(function(c) {
      if (!c.isPast && !c.isCurrent) {
        Object.keys(c.vatInPlanByProj).forEach(function(pn) {
          progVatInByProj[pn] = (progVatInByProj[pn] || 0) + c.vatInPlanByProj[pn];
        });
        Object.keys(c.vatOutPlanByProj).forEach(function(pn) {
          progVatOutByProj[pn] = (progVatOutByProj[pn] || 0) + c.vatOutPlanByProj[pn];
        });
      }
    });
    Object.keys(dal.vatInPlanByProj || {}).forEach(function(pn) {
      progVatInByProj[pn] = (progVatInByProj[pn] || 0) + dal.vatInPlanByProj[pn];
    });
    Object.keys(dal.vatOutPlanByProj || {}).forEach(function(pn) {
      progVatOutByProj[pn] = (progVatOutByProj[pn] || 0) + dal.vatOutPlanByProj[pn];
    });

    var MO = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
    function mlbl(c) { return MO[c.m - 1] + '\'' + String(c.y).slice(2); }
    var dalM2 = vf.dalYM % 100, dalY2 = Math.floor(vf.dalYM / 100);
    var dalLabel = MO[dalM2 - 1] + '\'' + String(dalY2).slice(2) + '+';

    var HS  = 'padding:3px 5px;text-align:right;font-size:10px;font-weight:600;color:#374151;border-bottom:2px solid #9ca3af;white-space:nowrap';
    var HSl = 'padding:3px 5px;font-size:10px;font-weight:600;color:#374151;border-bottom:2px solid #9ca3af;width:140px';
    var HSm = HS + ';width:54px';
    var HSfp = HS + ';width:72px';
    var HSi = HS + ';width:80px';
    var BL  = 'border-left:2px solid #3d5c7a';

    function fv(v) {
      var n = Math.round((v || 0) / 1000);
      if (!n) return '<span style="color:#ccc">—</span>';
      return new Intl.NumberFormat('ru-RU').format(n);
    }
    function fvC(v, clr) {
      var n = Math.round((v || 0) / 1000);
      var c = clr || (v > 0 ? '#15803d' : v < 0 ? '#dc2626' : '#6b7280');
      return '<span style="color:' + c + ';font-weight:700">' + (n ? new Intl.NumberFormat('ru-RU').format(n) : '—') + '</span>';
    }
    function colBg(c) {
      if (!c) return '';
      if (c.isPast)    return 'background:#f3f4f6';
      if (c.isCurrent) return 'background:#eff6ff';
      return '';
    }

    // Строка 1 заголовка: кварталы
    var h1 = '<tr>'
      + '<th style="' + HSl + '"></th>'
      + '<th colspan="3" style="' + HS + ';' + BL + ';text-align:center">Текущий квартал</th>'
      + '<th colspan="3" style="' + HS + ';' + BL + ';text-align:center">Квартал +1</th>'
      + '<th colspan="3" style="' + HS + ';' + BL + ';text-align:center">Квартал +2</th>'
      + '<th style="' + HS + ';' + BL + ';text-align:center">Далее</th>'
      + '<th style="' + HSfp + ';' + BL + ';text-align:center;color:#374151">Факт</th>'
      + '<th style="' + HSfp + ';' + BL + ';text-align:center;color:#374151">Прогноз</th>'
      + '<th style="' + HS + ';' + BL + ';text-align:center;color:#1d4ed8">ИТОГО ПЛАН</th>'
      + '</tr>';

    // Строка 2 заголовка: месяцы
    // Периоды для заголовков Факт / Прогноз
    var _curM = vf.curYM % 100, _curY = Math.floor(vf.curYM / 100);
    var _factFirst = MO[vf.q0m - 1] + '\'' + String(_curY).slice(2);
    var _factLast  = MO[_curM - 1]  + '\'' + String(_curY).slice(2);
    var _factPeriod = (vf.q0m === _curM) ? _factFirst : _factFirst + '–' + _factLast;
    var _progFirstM = _curM + 1, _progFirstY = _curY;
    if (_progFirstM > 12) { _progFirstM -= 12; _progFirstY++; }
    var _progPeriod = MO[_progFirstM - 1] + '\'' + String(_progFirstY).slice(2) + '–' + dalLabel;

    var h2 = '<tr><th style="' + HSl + '">тыс. руб.</th>';
    cols.forEach(function(c, ci) {
      var bg = data[ci].isPast ? 'background:#e5e7eb' : data[ci].isCurrent ? 'background:#dbeafe' : 'background:#f8f9fd';
      var bl = (ci % 3 === 0) ? ';' + BL : '';
      h2 += '<th style="' + HSm + ';' + bg + bl + '">' + mlbl(c) + '</th>';
    });
    h2 += '<th style="' + HSm + ';' + BL + '">' + dalLabel + '</th>';
    h2 += '<th style="' + HSfp + ';' + BL + ';background:#f3f4f6">' + _factPeriod + '</th>';
    h2 += '<th style="' + HSfp + ';' + BL + '">' + _progPeriod + '</th>';
    h2 += '<th style="' + HSi + ';' + BL + ';color:#1d4ed8">ИТОГО</th>';
    h2 += '</tr>';

    function dataRow(label, fn, vatColor, factVal, progVal, itogoVal) {
      var row = '<tr>';
      var ls = 'padding:2px 5px;font-size:11px;border-bottom:1px solid #f0f0f0;white-space:normal;color:#374151;overflow:hidden';
      row += '<td style="' + ls + '">' + label + '</td>';
      data.forEach(function(c, ci) {
        var bg = colBg(c);
        var bl = (ci % 3 === 0) ? ';' + BL : '';
        var st = 'padding:2px 5px;text-align:right;font-size:11px;white-space:nowrap;border-bottom:1px solid #f0f0f0' + (bg ? ';' + bg : '') + bl;
        if (vatColor) st += ';color:' + vatColor;
        row += '<td style="' + st + '">' + fv(fn(c)) + '</td>';
      });
      var dSt = 'padding:2px 5px;text-align:right;font-size:11px;white-space:nowrap;border-bottom:1px solid #f0f0f0;' + BL + (vatColor ? ';color:' + vatColor : '');
      row += '<td style="' + dSt + '">' + fv(fn(dal)) + '</td>';
      var fSt = dSt + ';background:#f3f4f6;width:65px;max-width:65px';
      row += '<td style="' + fSt + '">' + fv(factVal) + '</td>';
      var pSt = 'padding:2px 5px;text-align:right;font-size:11px;white-space:nowrap;border-bottom:1px solid #f0f0f0;' + BL + (vatColor ? ';color:' + vatColor : '') + ';width:65px;max-width:65px';
      row += '<td style="' + pSt + '">' + fv(progVal) + '</td>';
      var iSt = 'padding:2px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;border-bottom:1px solid #f0f0f0;' + BL + (vatColor ? ';color:' + vatColor : ';color:#1d4ed8');
      row += '<td style="' + iSt + '">' + fv(itogoVal) + '</td>';
      row += '</tr>';
      return row;
    }

    // Строка разбивки НДС по проекту (факт + план)
    function projSubRow(projName, factByProjFn, planByProjFn, factByProj, progByProj) {
      var factVal = factByProj[projName] || 0;
      var progVal = progByProj[projName] || 0;
      if (!factVal && !progVal) return '';
      var itogoVal = factVal + progVal;
      var row = '<tr>';
      var ls = 'padding:1px 5px 1px 16px;font-size:10px;border-bottom:1px solid #f8f8f8;color:#78716c;white-space:normal;overflow:hidden';
      row += '<td style="' + ls + '">· ' + projName + '</td>';
      data.forEach(function(c, ci) {
        var bg = colBg(c);
        var bl = (ci % 3 === 0) ? ';' + BL : '';
        var val = (c.isPast || c.isCurrent) ? (factByProjFn(c)[projName] || 0) : (planByProjFn(c)[projName] || 0);
        var st = 'padding:1px 5px;text-align:right;font-size:10px;white-space:nowrap;border-bottom:1px solid #f8f8f8;color:#92400e' + (bg ? ';' + bg : '') + bl;
        row += '<td style="' + st + '">' + fv(val) + '</td>';
      });
      var dalVal = (planByProjFn(dal) || {})[projName] || 0;
      var dSt = 'padding:1px 5px;text-align:right;font-size:10px;white-space:nowrap;border-bottom:1px solid #f8f8f8;color:#92400e;' + BL;
      row += '<td style="' + dSt + '">' + fv(dalVal) + '</td>';
      row += '<td style="' + dSt + ';background:#f3f4f6;width:65px;max-width:65px">' + fv(factVal) + '</td>';
      row += '<td style="' + dSt + ';width:65px;max-width:65px">' + fv(progVal) + '</td>';
      row += '<td style="' + dSt + ';font-weight:600">' + fv(itogoVal) + '</td>';
      row += '</tr>';
      return row;
    }
    function projSubRows(factByProjFn, planByProjFn, factByProj, progByProj) {
      return PROJECTS.map(function(pn) { return projSubRow(pn, factByProjFn, planByProjFn, factByProj, progByProj); }).join('');
    }

    function resRow(label, fnV, factV, progV, itogoV, bg) {
      var brdT = 'border-top:2px solid #9ca3af';
      var rowBg = bg || '#f0fdf4';
      var lclr = bg ? '#374151' : '#15803d';
      var row = '<tr style="background:' + rowBg + '">';
      row += '<td style="padding:3px 5px;font-size:11px;' + brdT + ';white-space:normal;width:90px;max-width:90px"><strong style="color:' + lclr + '">' + label + '</strong></td>';
      data.forEach(function(c, ci) {
        var cbg = colBg(c);
        var bl = (ci % 3 === 0) ? ';' + BL : '';
        var v = fnV(c);
        var clr = v > 0 ? '#15803d' : v < 0 ? '#dc2626' : '#6b7280';
        row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + (cbg ? ';' + cbg : '') + bl + ';color:' + clr + '">' + fv(v) + '</td>';
      });
      var dalV2 = fnV(dal);
      var dalClr = dalV2 > 0 ? '#15803d' : dalV2 < 0 ? '#dc2626' : '#6b7280';
      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + ';' + BL + ';color:' + dalClr + '">' + fv(dalV2) + '</td>';
      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + ';' + BL + ';background:#f3f4f6">' + fvC(factV) + '</td>';
      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + ';' + BL + '">' + fvC(progV) + '</td>';
      var iClr = itogoV > 0 ? '#15803d' : itogoV < 0 ? '#dc2626' : '#6b7280';
      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + ';' + BL + ';color:' + iClr + '">' + fv(itogoV) + '</td>';
      row += '</tr>';
      return row;
    }

    // Строка Корректировка НДС: в Факт — нетто результат из Проекта Корректировки НДС (project_id=36)
    function adjRow(label, factVal) {
      var brdT = 'border-top:1px solid #e5e7eb';
      var row = '<tr style="background:#fefce8">';
      row += '<td style="padding:3px 5px;font-size:11px;' + brdT + ';white-space:normal;width:90px;max-width:90px;color:#92400e"><strong>' + label + '</strong></td>';

      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;' + brdT + ';' + BL + '"><span style="color:#ccc">—</span></td>';

      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;' + brdT + ';' + BL + ';color:' + iClr + '">' + fv(factVal) + '</td>';

    }

    // Строки ИТОГО НДС к получению / к уплате (одна и та же формула, фильтрация по знаку)
    function vatSplitRow(label, fnV, factV, progV, itogoV, bg, isPositive, first) {
      var brdT = first ? 'border-top:2px solid #9ca3af' : 'border-top:1px solid #bfdbfe';
      var rowBg = bg || '#eff6ff';
      var dash = '<span style="color:#ccc">—</span>';
      var cellStyle = function(extra) {
        return 'padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + (extra || '');
      };
      var colorFor = function(v) { return v > 0 ? '#15803d' : v < 0 ? '#dc2626' : '#6b7280'; };
      var showIf   = function(v) { return isPositive ? v > 0 : v < 0; };
      var cellVal  = function(v, extra) {
        if (showIf(v)) return '<td style="' + cellStyle(extra) + ';color:' + colorFor(v) + '">' + fv(v) + '</td>';
        return '<td style="' + cellStyle(extra) + '">' + dash + '</td>';
      };
      var row = '<tr style="background:' + rowBg + '">';
      row += '<td style="padding:3px 5px;font-size:11px;' + brdT + ';white-space:normal;width:90px;max-width:90px"><strong style="color:#374151">' + label + '</strong></td>';
      data.forEach(function(c, ci) {
        var bl = (ci % 3 === 0) ? ';' + BL : '';
        var v = fnV(c);
        var cbg = colBg(c) ? ';' + colBg(c) : '';
        row += cellVal(v, bl + cbg);
      });
      row += cellVal(fnV(dal), ';' + BL);
      row += cellVal(factV, ';' + BL + ';background:#f3f4f6');
      row += cellVal(progV, ';' + BL);
      row += cellVal(itogoV, ';' + BL);
      row += '</tr>';
      return row;
    }

    // Таблица эффективных ставок
    var TYPES_LABELS = {smr:'СМР', mat:'Материалы', design:'Проектирование/Изыскание', ar:'Аренда', lz:'Лизинг', buh:'Бухгалтерия', proj_other:'Прочие проектные', bg:'Банк. гарантии', zero:'Без НДС'};
    var DEFAULT_EFF_RATES_REF = {smr:22/122, mat:22/122, design:22/122, bg:0, ar:22/122, lz:22/122, buh:0, proj_other:22/122, zero:0};
    var rateRows = '';
    var TS = 'padding:2px 6px;font-size:10px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#374151';
    var TSr = TS + ';text-align:right';
    ['smr','mat','design','ar','lz','buh','proj_other','bg','zero'].forEach(function(t) {
      var exp = vf.effExpByType[t] || 0;
      var vat = vf.effVatByType[t] || 0;
      var rate = vf.effRates[t] || 0;
      var fromFact = exp > 0 && vat > 0;
      var srcLabel = fromFact ? '<span style="color:#15803d;font-weight:600">факт PLS</span>' : '<span style="color:#9ca3af">дефолт</span>';
      var rateStr = rate > 0 ? (rate * 100).toFixed(2) + '%' : '0%';
      var expStr  = exp  > 0 ? new Intl.NumberFormat('ru-RU').format(Math.round(exp / 1000)) + ' тыс.' : '—';
      var vatStr  = vat  > 0 ? new Intl.NumberFormat('ru-RU').format(Math.round(vat / 1000)) + ' тыс.' : '—';
      rateRows += '<tr>'
        + '<td style="' + TS  + '">' + TYPES_LABELS[t] + '</td>'
        + '<td style="' + TSr + '">' + expStr + '</td>'
        + '<td style="' + TSr + '">' + vatStr + '</td>'
        + '<td style="' + TSr + ';font-weight:600;color:#1d4ed8">' + rateStr + '</td>'
        + '<td style="' + TSr + '">' + srcLabel + '</td>'
        + '</tr>';
    });
    var TH = 'padding:2px 6px;font-size:10px;font-weight:600;color:#6b7280;border-bottom:1.5px solid #9ca3af;white-space:nowrap;text-align:right';
    var totalEffExp = Object.keys(vf.effExpByType||{}).reduce(function(s,k){return s+(vf.effExpByType[k]||0);},0);
    var totalEffVat = Object.keys(vf.effVatByType||{}).reduce(function(s,k){return s+(vf.effVatByType[k]||0);},0);
    var rateTable = '<div style="margin-top:10px">'
      + '<div onclick="var b=document.getElementById(\'effRateBody\');var a=document.getElementById(\'effRateArr\');if(b.style.display===\'none\'){b.style.display=\'block\';a.textContent=\'▾\';}else{b.style.display=\'none\';a.textContent=\'▸\';}" style="font-size:11px;font-weight:600;color:#6b7280;padding:3px 6px 2px;border-bottom:1px solid #d1d5db;background:#f8f9fd;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center">'
      + '<span>Эффективные ставки НДС (расходы)</span><span id="effRateArr" style="font-size:12px">▸</span></div>'
      + '<div id="effRateBody" style="display:none">'
      + '<table style="border-collapse:collapse;width:auto;min-width:420px">'
      + '<tr>'
      + '<th style="' + TH + ';text-align:left">Тип расходов</th>'
      + '<th style="' + TH + '">Расходы-факт</th>'
      + '<th style="' + TH + '">НДС-факт (PLS 3144)</th>'
      + '<th style="' + TH + '">Ставка</th>'
      + '<th style="' + TH + '">Источник</th>'
      + '</tr>'
      + rateRows
      + '</table></div></div>';

    var vatAdj      = vf.vatAdj || 0;  // нетто Корректировка НДС (project_id=36, текущий квартал)
    var factVatRes  = factVatIn  - factVatOut;           // без vatAdj — чтобы совпадать с Виджетом НДС
    var progVatRes  = progVatIn  - progVatOut;
    var itogoVatRes = itogoVatIn - itogoVatOut - vatAdj;
    var factRes     = (factInc  - factVatIn)  - (factExp  - factVatOut);
    var progRes     = (progInc  - progVatIn)  - (progExp  - progVatOut);
    var itogoRes    = (itogoInc - itogoVatIn) - (itogoExp - itogoVatOut);

    return '<div style="margin-top:16px">'
      + '<div style="font-size:13px;font-weight:700;color:#374151;padding:3px 5px 2px;border-bottom:2px solid #9ca3af;background:#f8f9fd">'
      + 'НДС ПРОГНОЗ (тыс. руб.)</div>'
      + '<table style="border-collapse:collapse;width:100%;table-layout:fixed">'
      + h1 + h2
      + dataRow('Поступления',       function(c){return c.inc;},    undefined, factInc,    progInc,    itogoInc)
      + dataRow('НДС к вычету',      function(c){return c.vatIn;},  '#92400e', factVatIn,  progVatIn,  itogoVatIn)
      + projSubRows(function(c){return c.vatInByProj;}, function(c){return c.vatInPlanByProj;}, factVatInByProj, progVatInByProj)
      + dataRow('Выплаты',           function(c){return c.exp;},    undefined, factExp,    progExp,    itogoExp)
      + dataRow('НДС начисленный',   function(c){return c.vatOut;}, '#92400e', factVatOut, progVatOut, itogoVatOut)
      + projSubRows(function(c){return c.vatOutByProj;}, function(c){return c.vatOutPlanByProj;}, factVatOutByProj, progVatOutByProj)
      + resRow('Результат (без НДС)', function(c){return (c.inc-c.vatIn)-(c.exp-c.vatOut);},
               factRes, progRes, itogoRes)
      + adjRow('Корректировка НДС', vatAdj)
      + vatSplitRow('Итого НДС к получению',
                   function(c){ return (c.isPast || c.isCurrent) ? (c.vatOut - c.vatIn) : (c.vatIn - c.vatOut); },
                   -factVatRes, progVatRes, itogoVatRes, '#eff6ff', false, true)
      + vatSplitRow('Итого НДС к уплате',
                   function(c){ return (c.isPast || c.isCurrent) ? (c.vatOut - c.vatIn) : (c.vatIn - c.vatOut); },
                   -factVatRes, progVatRes, itogoVatRes, '#eff6ff', true,  false)
      + '</table>'
      + rateTable
      + '</div>';
  }

  // Раскрывающийся список транзакций по счёту Внебюджетный лимит
  function buildEbDetails(planItems, catMap, curYear, curMonth, effRates, ebPmVatMap, paidPmIds) {
    effRates = effRates || {};
    ebPmVatMap = ebPmVatMap || {};
    paidPmIds = paidPmIds || {};
    var items = (planItems || []).filter(function(item) {
      if (item.org_account_id !== 150) return false;
      var iy = parseInt((item.plan_paid_date || '').substring(0, 4));
      var im = parseInt((item.plan_paid_date || '').substring(5, 7));
      return (iy > curYear) || (iy === curYear && im >= curMonth);
    });
    if (!items.length) return '';

    items.sort(function(a, b) {
      return (b.plan_paid_date || '').localeCompare(a.plan_paid_date || '');
    });

    var total = items.reduce(function(s, item) { return s + (item.total || 0); }, 0);
    var fmtFull = function(v) { return new Intl.NumberFormat('ru-RU').format(Math.round(v || 0)); };
    var fmtK    = function(v) { return new Intl.NumberFormat('ru-RU').format(Math.round((v || 0) / 1000)); };

    function ebVat(item) {
      var amt = item.total || 0;
      // Расчётная ставка по категории (используется как основная или резервная)
      // Для расходов: getPlanExpVatRate — 22/122 для всего кроме нулевых статей
      // (не effRates: эффективная ставка может быть 0 если нет PLS-данных за квартал)
      var catName = catMap[item.category_id] || '';
      var rate;
      if (item.type === 40) {
        rate = getPlanExpVatRate(catName);
      } else {
        var zeroIncCats = {'Прочий доход':1,'Проценты к получению':1,'Получение займов':1};
        rate = zeroIncCats[catName] ? 0 : 22 / 122;
      }
      var vatEst = Math.round(amt * rate);
      // Оплачен — берём реальный НДС из PLS, если данные достоверны (0 < НДС < сумма)
      // Если PLS = 0 (нет записи) или >= сумма (ошибка данных) — берём расчётную оценку
      if (paidPmIds[item.id]) {
        var vatPls = Math.abs(Math.round(ebPmVatMap[item.id] || 0));
        if (vatPls > 0 && vatPls < amt) return { net: amt - vatPls, vat: vatPls };
      }
      return { net: amt - vatEst, vat: vatEst };
    }

    var totAmt = 0, totNet = 0, totVat = 0;
        var rows = items.map(function(item) {
      var dt = item.plan_paid_date || '';
      var dateStr = dt.length >= 10
        ? dt.slice(8, 10) + '.' + dt.slice(5, 7) + '.' + dt.slice(0, 4) : dt;
      var cat  = catMap[item.category_id] || '';
      var proj = PID_MAP[item.project_id] || ('id:' + item.project_id);
      var name = item.name || item.note || cat;
      var isExp = item.type === 40;
      var amt   = item.total || 0;
      var v = ebVat(item);
      var sign = isExp ? 1 : -1;
      totAmt += sign * amt; totNet += sign * v.net; totVat += sign * v.vat;
      return '<tr>'
        + '<td style="padding:2px 8px;font-size:10px;color:#6b7280;white-space:nowrap">' + dateStr + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;color:#374151;max-width:100px;overflow:hidden;text-overflow:ellipsis">' + name + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;color:#6b7280;white-space:nowrap">' + proj + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;white-space:nowrap;font-weight:600;color:'
          + (isExp ? '#dc2626' : '#15803d') + '">' 
          + (isExp ? '- ' : '+ ') + fmtFull(amt) + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;white-space:nowrap;color:#374151">' + (isExp ? '- ' : '+ ') + fmtFull(Math.abs(v.net)) + '</td>'
        + '<td style="padding:2px 8px;font-size:10px;text-align:right;white-space:nowrap;color:#6b7280">' + (isExp ? '- ' : '+ ') + fmtFull(Math.abs(v.vat)) + '</td>'
        + '</tr>';
    }).join('');

    var totSign  = totAmt >= 0 ? '- ' : '+ ';
    var totColor = totAmt >= 0 ? '#dc2626' : '#15803d';
    var totalRow = '<tr style="background:#f3f4f6;font-weight:600">'
      + '<td colspan="3" style="padding:2px 8px;font-size:10px;color:#374151;text-align:right">Итого</td>'
      + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:' + totColor + '">' + totSign + fmtFull(Math.abs(totAmt)) + '</td>'
      + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:#374151">' + totSign + fmtFull(Math.abs(totNet)) + '</td>'
      + '<td style="padding:2px 8px;font-size:10px;text-align:right;color:#6b7280">' + totSign + fmtFull(Math.abs(totVat)) + '</td>'
      + '</tr>';

    return '<details style="margin-top:6px;font-family:sans-serif;max-width:50%">'
      + '<summary style="cursor:pointer;padding:5px 8px;font-size:10.5px;color:#6b7280;'
      + 'list-style:none;-webkit-appearance:none;user-select:none;background:#f8f9fd;'
      + 'border-top:1px solid #e5e7eb">'
      + '&#9660; Внебюджетный лимит (' + items.length + ' тр. на ' + fmtK(totAmt) + ' тыс. р.)'
      + '</summary>'
      + '<table style="width:100%;border-collapse:collapse;background:#fff">'
      + '<tr style="background:#f3f4f6">'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:left;color:#9ca3af;font-weight:600;white-space:nowrap">Дата</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:left;color:#9ca3af;font-weight:600">Контрагент / Категория</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:left;color:#9ca3af;font-weight:600;white-space:nowrap">Проект</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:right;color:#9ca3af;font-weight:600;white-space:nowrap">Сумма</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:right;color:#9ca3af;font-weight:600;white-space:nowrap">Без НДС</th>'
      + '<th style="padding:2px 8px;font-size:9.5px;text-align:right;color:#9ca3af;font-weight:600;white-space:nowrap">НДС</th>'
      + '</tr>'
      + rows
      + totalRow
      + '</table>'
      + '</details>';
  }

  // Построение таблицы
  function buildTable(result, pm, curYear, curMonth, nextMonths, offBrkPlan, vat, finPlan, vf, today, sd, sdPrev, ebHtml) {

    var fin    = result.fin;
