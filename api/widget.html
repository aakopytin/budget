<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сводный финансовый отчёт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    background: #f8f9fd;
    padding: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .title { font-size: 14px; font-weight: 700; color: #111827; }
  .subtitle { font-size: 10px; color: #9ca3af; margin-left: 8px; }
  .status-row { display: flex; gap: 6px; align-items: center; }
  #status { font-size: 10.5px; color: #d97706; }
  #refresh-btn {
    background: none;
    border: 1px solid #d1d5db;
    color: #6b7280;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #refresh-btn:hover { background: #f3f4f6; }
  #content { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { white-space: nowrap; }
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="title">&#128202; Сводный финансовый отчёт</span>
    <span class="subtitle">Все суммы в тысячах рублей</span>
  </div>
  <div class="status-row">
    <span id="status">&#9679; инициализация...</span>
    <button id="refresh-btn" title="Обновить">&#8635;</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>
</div>

<script>
(function () {
  'use strict';

  // Банковские счета для расчёта остатков (org_account_id)
  // ВСИП: 2-Альфа, 4-Совком, 5-РХСБ, 6-Сбер, 7-ВТБ, 8-Депозиты
  // ТТ:   18-Альфа ТТ (ВСИП)
  var VSIP_ACC_IDS = {2:1, 4:1, 5:1, 6:1, 7:1, 8:1};
  var TT_ACC_IDS   = {18:1};

  // Справочники проектов
  var PID_MAP = {
    1:'Кемерово',
    6:'Десногорск',
    12:'Киров',
    23:'Сыктывкар',
    13:'Барнаул',
    9:'Рузаевка',
    3:'Ю-Сахалинск',
    25:'Ю-Сахалинск',
    7:'Иволгинск',
    10:'Большое Болдино',
    2:'Центр. договор',
    18:'Центр. договор',
    19:'Центр. договор',
    29:'Центр. договор',
    30:'Центр. договор',
    31:'Центр. договор',
    32:'Центр. договор',
    33:'Голутвинский',
    4:'Прочие',
    22:'Прочие',
    20:'Прочие',
    17:'Прочие',
    21:'Прочие',
    24:'Офис (ВСИП+ТТ)',
    26:'Офис (ВСИП+ТТ)'
  };

  var PROJECTS = [
    'Кемерово',
    'Десногорск',
    'Киров',
    'Сыктывкар',
    'Барнаул',
    'Рузаевка',
    'Ю-Сахалинск',
    'Иволгинск',
    'Большое Болдино',
    'Голутвинский',
    'Центр. договор',
    'Прочие',
    'Офис (ВСИП+ТТ)'
  ];

  // Проекты ОХР для финансовой деятельности
  var OXR_PIDS = {24:1, 26:1};

  // Категории, исключаемые из секций ДОХОДЫ/РАСХОДЫ
  var SKIP = {
    'Перевод между счетами (поступление)': 1,
    'Перевод между счетами (списание)': 1,
    'Получение кредита': 1,
    'Выплата кредита': 1,
    'Получение займа': 1,
    'Выплата займа': 1,
    'Проценты к уплате': 1
  };

  // Типы займов/кредитов — идут в финансовую деятельность, не в доходы/расходы
  var LOAN_CATS = {
    'Получение займа': 1,
    'Выплата займа': 1,
    'Получение кредита': 1,
    'Выплата кредита': 1
  };

  var INC_TYPES = {
    'Оказание услуг': 1,
    'Возврат ДС. за заказы': 1,
    'Проценты к получению': 1
  };

  // Категории расходов с нулевой ставкой НДС (для планового расчёта)
  var ZERO_RATE_CATS = {
    'Зарплата': 1, 'Налоги с зарплаты': 1, 'Командировки': 1,
    'Страхование': 1, 'Расходы на услуги банков': 1, 'Банковские услуги': 1,
    'Налоги и взносы': 1, 'Налоги - НДС': 1, 'Налог - НДС': 1,
    'Проценты к уплате': 1, 'Банковские гарантии': 1
  };

  function getPlanExpVatRate(catName) {
    if (!catName) return 22 / 122;
    if (LOAN_CATS[catName] || SKIP[catName]) return 0;
    if (ZERO_RATE_CATS[catName]) return 0;
    return 22 / 122;
  }

  // Классифицирует название категории в тип для расчёта эффективной ставки НДС.
  // Возвращает null — категория исключается из расчёта (переводы, займы).
  // Возвращает 'zero' — НДС всегда 0%.
  // Возвращает строку типа — для подстановки эффективной ставки из фактических PLS.
  function getExpCatType(catName) {
    if (!catName) return 'proj_other';
    if (LOAN_CATS[catName]) return null;
    if (catName === 'Перевод между счетами (поступление)' ||
        catName === 'Перевод между счетами (списание)') return null;
    if (ZERO_RATE_CATS[catName]) return 'zero';
    var l = catName.toLowerCase();
    if (/^смр/.test(l))      return 'smr';
    if (/^материал/.test(l)) return 'mat';
    if (l === 'проектирование-изыскание' || l.indexOf('изыскан') >= 0 ||
        l === 'составление исполнительной документации' ||
        l === 'услуги по сертификации' || l === 'тесты и испытания') return 'design';
    if (l.indexOf('банковские гарантии') >= 0) return 'bg';
    if (l.indexOf('аренд') >= 0) return 'ar';
    if (l.indexOf('лизинг') >= 0) return 'lz';
    if (l.indexOf('бухгалтер') >= 0) return 'buh';
    return 'proj_other';
  }

  // Ставки по умолчанию — применяются если нет фактических PLS-данных для данного типа
  var DEFAULT_EFF_RATES = {
    smr: 22/122, mat: 22/122, design: 22/122, bg: 0,
    ar: 22/122, lz: 22/122, buh: 0, proj_other: 22/122, zero: 0
  };

  function isIncome(t) { return !!INC_TYPES[t]; }

  function isExpense(t, proj) {
    if (proj === 'Офис (ВСИП+ТТ)') {
      // Для офисных проектов: всё кроме переводов, кредитов и займов (они — финансовая деятельность)
      return t !== 'Перевод между счетами (поступление)'
          && t !== 'Перевод между счетами (списание)'
          && t !== 'Получение кредита'
          && t !== 'Выплата кредита'
          && t !== 'Получение займа'
          && t !== 'Выплата займа';
    }
    if (SKIP[t]) return false;
    var l = t.toLowerCase();
    if (proj === 'Прочие' && t === 'Возвраты клиентам') return true;
    return (
      l.indexOf('материал') === 0 ||
      l.indexOf('смр') === 0 ||
      (l.indexOf('банков') >= 0 && l.indexOf('гарант') >= 0) ||
      l.indexOf('проектирован') >= 0 ||
      l.indexOf('изыскан') >= 0 ||
      l.indexOf('оборудован') >= 0 ||
      l.indexOf('мобилизац') >= 0 ||
      t === 'Командировки' ||
      t === 'Составление исполнительной документации' ||
      t === 'Услуги по сертификации' ||
      t === 'Тесты и испытания'
    );
  }

  var MS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];

  var OFF_SUBCATS = [
    {code:'zp',  label:'Зарплата'},
    {code:'km',  label:'Командировочные'},
    {code:'bk',  label:'Банковские комиссии'},
    {code:'lz',  label:'Лизинг'},
    {code:'ar',  label:'Аренда'},
    {code:'buh', label:'Бухгалтерия'},
    {code:'ntax',label:'Налоги и взносы'},
    {code:'pct', label:'Проценты к уплате'},
    {code:'bg',  label:'Банковские гарантии'},
    {code:'ret', label:'Возвраты клиентам'},
    {code:'po',  label:'Прочие офисные'}
  ];

  function offSubcat(name) {
    var l = name.toLowerCase();
    if (l.indexOf('зарплат') >= 0 || l.indexOf('фот') >= 0 || l.indexOf('оплата труда') >= 0) return 'zp';
    if (l.indexOf('командир') >= 0) return 'km';
    if (l.indexOf('гарант') >= 0) return 'bg';
    if (l.indexOf('лизинг') >= 0) return 'lz';
    if (l.indexOf('аренд') >= 0) return 'ar';
    if (l.indexOf('бухгалтер') >= 0 || l.indexOf('аудит') >= 0) return 'buh';
    if (l.indexOf('налог') >= 0 || l.indexOf('взнос') >= 0 || l.indexOf('страхов') >= 0
        || l.indexOf('усн') >= 0 || l.indexOf('ндс') >= 0 || l.indexOf('ифнс') >= 0
        || l.indexOf('пенсионн') >= 0 || l.indexOf('пфр') >= 0 || l.indexOf('фсс') >= 0
        || l.indexOf('ффомс') >= 0) return 'ntax';
    if (l.indexOf('процент') >= 0) return 'pct';
    if (l.indexOf('банков') >= 0 || l.indexOf('комисс') >= 0) return 'bk';
    if (l.indexOf('возврат') >= 0) return 'ret';
    return 'po';
  }

  function newOffBrk() {
    var r = {};
    OFF_SUBCATS.forEach(function(s) { r[s.code] = {f25:0, f26:0, fCur:0}; });
    return r;
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  // Форматирование
  function fmtK(v, bold, neg_red) {
    if (!v) return '<span style="color:#ccc">—</span>';
    var absV = Math.abs(v) / 1000;
    var parts = absV.toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    var s = parts.join('.');
    var isNeg = v < 0;
    var wrapped = isNeg ? '(' + s + ')' : s;
    if (neg_red && isNeg) {
      return bold
        ? '<strong style="color:#dc2626">' + wrapped + '</strong>'
        : '<span style="color:#dc2626">' + wrapped + '</span>';
    }
    return bold ? '<strong>' + wrapped + '</strong>' : wrapped;
  }

  function fmtBal(v, bold) {
    if (!v && v !== 0) return '<span style="color:#ccc">—</span>';
    var absV = Math.abs(v) / 1000;
    var parts = absV.toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    var s = parts.join('.');
    var isNeg = v < 0;
    var wrapped = isNeg ? '(' + s + ')' : s;
    var col = isNeg ? '#dc2626' : '#059669';
    return bold
      ? '<strong style="color:' + col + '">' + wrapped + '</strong>'
      : '<span style="color:' + col + '">' + wrapped + '</span>';
  }

  // API через серверный прокси /api/data
  function fetchAll(entity, extra) {
    var all = [], page = 1;
    function next() {
      var p = new URLSearchParams();
      p.append('entity', entity);
      p.append('limit', '100');
      p.append('page', String(page));
      if (extra) Object.keys(extra).forEach(function(k) { p.append(k, extra[k]); });
      return fetch('/api/data?' + p.toString())
        .then(function(r) {
          if (!r.ok) throw new Error(entity + ' HTTP ' + r.status);
          return r.json();
        })
        .then(function(d) {
          if (d.error) throw new Error(entity + ': ' + JSON.stringify(d.error));
          var items = (d.response && d.response.items) || [];
          all = all.concat(items);
          var total = (d.response && d.response.total) || 0;
          if (all.length >= total || items.length < 100) return all;
          page++;
          return next();
        });
    }
    return next();
  }

  function fetchCategories() {
    return fetchAll('categories').then(function(items) {
      var map = {};
      items.forEach(function(c) { map[c.id] = c.name || ''; });
      return map;
    });
  }

  function fetchPlanMoney(curYear) {
    return fetchAll('plan_money').then(function(items) {
      return items.filter(function(i) {
        if (!i.plan_paid_date) return false;
        var iy = parseInt(i.plan_paid_date.substring(0, 4));
        return iy >= curYear && i.org_account_id === 36;
      });
    });
  }

  // Загрузка PLS-записей (НДС) за curYear и год до.
  // Запрос 1: без фильтра → 3157/3158 (исходящий/входящий НДС per-transaction).
  // Запрос 2: filter 3144 — точно по образцу nds.html (fetchAllPls).
  var _pls3144err = null;

  function fetchPls3144(curYear) {
    // Отдельный прокси /api/pls3144 — минует entity/ALLOWED логику /api/data
    var prevYear = curYear - 1;
    var now = new Date();
    var todayStr = now.getFullYear() + '-'
      + String(now.getMonth() + 1).padStart(2, '0') + '-'
      + String(now.getDate()).padStart(2, '0');
    var all = [], page = 1;
    function next() {
      return fetch('/api/pls3144?page=' + page)
        .then(function(r) {
          var status = r.status;
          return r.json().then(function(d) {
            if (status >= 400) {
              var why = d && d.error ? JSON.stringify(d.error).slice(0, 60) : ('HTTP ' + status);
              throw new Error('3144: ' + why);
            }
            if (d.error) throw new Error('3144: ' + JSON.stringify(d.error).slice(0, 60));
            var items = (d.response && d.response.items) || [];
            all = all.concat(items);
            var total = (d.response && d.response.total) || 0;
            if (all.length >= total || items.length < 100) return all;
            page++;
            return next();
          });
        });
    }
    return next();
  }

  function fetchPls(curYear) {
    _pls3144err = null;
    var prevYear = curYear - 1;
    // req1 может вернуть 400 "entity not allowed" — подавляем ошибку
    var req1 = fetchAll('transaction_pls').catch(function() { return []; });
    var req2 = fetchPls3144(curYear).catch(function(e) {
      _pls3144err = (e && e.message) ? e.message.slice(0, 80) : 'ошибка req2';
      console.warn('[fetchPls] req2 failed:', _pls3144err);
      return [];
    });
    return Promise.all([req1, req2]).then(function(res) {
      var combined = res[0].concat(res[1]);
      return combined.filter(function(i) {
        if (!i.date) return false;
        var iy = parseInt(i.date.substring(0, 4));
        return (iy === curYear || iy === prevYear)
            && (i.category_id === 3158 || i.category_id === 3157
             || i.category_id === 3144 || i.category_id === 3147);
      });
    });
  }

  // Расчёт фактического НДС из PLS-записей
  // category 3158 (OUTPUT_VAT): income → НДС с поступлений
  // category 3157 (INPUT_VAT): outcome → НДС с выплат
  function calcVat(plsItems, curYear, curMonth) {
    var v = {in_25:0, in_26:0, in_cur:0, out_25:0, out_26:0, out_cur:0};
    plsItems.forEach(function(p) {
      var yr   = parseInt(p.date.slice(0, 4));
      var mo   = parseInt(p.date.slice(5, 7));
      var prev = (yr === curYear - 1);
      var cur  = (yr === curYear && mo === curMonth);
      if (p.category_id === 3158) {
        var a = parseFloat(p.income) || 0;
        if (prev) v.in_25 += a;
        else if (yr === curYear) { v.in_26 += a; if (cur) v.in_cur += a; }
      } else if (p.category_id === 3157) {
        var b = parseFloat(p.outcome) || 0;
        if (prev) v.out_25 += b;
        else if (yr === curYear) { v.out_26 += b; if (cur) v.out_cur += b; }
      }
    });
    return v;
  }

  // Расчёт факта + остатки + финансовая деятельность
  function calcFact(txns, catMap, curYear, curMonth) {
    var now   = new Date();
    var today = now.getFullYear() + '-' + pad2(now.getMonth()+1) + '-' + pad2(now.getDate());
    var jan1  = curYear + '-01-01';

    var acc = {};
    PROJECTS.forEach(function(p) {
      acc[p] = { i25:0, e25:0, i26:0, e26:0, iCur:0, eCur:0 };
    });

    // Финансовая деятельность (только проекты 24 и 26)
    var fin = {
      skIn:  { f25:0, f26:0, fCur:0 },   // Получение займов
      skOut: { f25:0, f26:0, fCur:0 },   // Выдача займов
      int:   { f25:0, f26:0, fCur:0 },   // Процентные расходы (не-офис; офисные % — в offBrk.pct)
      trIn:  { f25:0, f26:0, fCur:0 },   // Переводы поступление
      trOut: { f25:0, f26:0, fCur:0 }    // Переводы списание
    };
    var offBrk = newOffBrk();

    // Остатки по банковским счетам
    var vSt = 0, tSt = 0, vEnd = 0, tEnd = 0;

    txns.forEach(function(tx) {
      var dt     = tx.date || '';
      var incAmt = parseFloat(tx.income)  || 0;
      var expAmt = parseFloat(tx.outcome) || 0;

      // Остатки по всем транзакциям банковских счетов
      var aid = tx.org_account_id;
      if (VSIP_ACC_IDS[aid]) {
        if (dt < jan1)   vSt  += incAmt - expAmt;
        if (dt <= today) vEnd += incAmt - expAmt;
      }
      if (TT_ACC_IDS[aid]) {
        if (dt < jan1)   tSt  += incAmt - expAmt;
        if (dt <= today) tEnd += incAmt - expAmt;
      }

      // Только текущий и прошлый год для факта
      var yr = parseInt(dt.slice(0, 4)) || 0;
      var mo = parseInt(dt.slice(5, 7)) || 0;
      if (yr !== curYear && yr !== curYear - 1) return;

      var typeName = catMap[tx.category_id] || '';
      var proj     = PID_MAP[tx.project_id];
      if (!proj) return;

      var isPrev = (yr === curYear - 1);
      var isCur  = (yr === curYear && mo === curMonth);
      var fKey   = isPrev ? 'f25' : 'f26';

      // Финансовая деятельность — только проекты 24 и 26
      if (OXR_PIDS[tx.project_id]) {
        if ((typeName === 'Получение кредита' || typeName === 'Получение займа') && incAmt > 0) {
          fin.skIn[fKey]  += incAmt; if (isCur) fin.skIn.fCur  += incAmt;
        }
        if ((typeName === 'Выплата кредита' || typeName === 'Выплата займа') && expAmt > 0) {
          fin.skOut[fKey] += expAmt; if (isCur) fin.skOut.fCur += expAmt;
        }
        // Проценты к уплате офисных проектов идут в offBrk.pct, не в fin.int
        if (typeName === 'Перевод между счетами (поступление)' && incAmt > 0) {
          fin.trIn[fKey]  += incAmt; if (isCur) fin.trIn.fCur  += incAmt;
        }
        if (typeName === 'Перевод между счетами (списание)' && expAmt > 0) {
          fin.trOut[fKey] += expAmt; if (isCur) fin.trOut.fCur += expAmt;
        }
        // Разбивка офисных расходов по подкатегориям
        if (expAmt > 0 && isExpense(typeName, 'Офис (ВСИП+ТТ)')) {
          var sub = offSubcat(typeName);
          var brk = offBrk[sub];
          if (isPrev) { brk.f25 += expAmt; }
          else { brk.f26 += expAmt; if (isCur) brk.fCur += expAmt; }
        }
      }

      // Доходы и расходы по проектам
      var a = acc[proj];
      if (incAmt > 0 && isIncome(typeName)) {
        if (isPrev) { a.i25 += incAmt; }
        else { a.i26 += incAmt; if (isCur) a.iCur += incAmt; }
      }
      if (expAmt > 0 && isExpense(typeName, proj)) {
        if (isPrev) { a.e25 += expAmt; }
        else { a.e26 += expAmt; if (isCur) a.eCur += expAmt; }
      }
    });

    return { acc:acc, fin:fin, offBrk:offBrk, vSt:vSt, tSt:tSt, vEnd:vEnd, tEnd:tEnd };
  }

  // Расчёт плана
  function calcPlan(planItems, curYear, curMonth, nextMonths, catMap) {
    var pm = {};
    PROJECTS.forEach(function(p) {
      pm[p] = { bi_plan:0, be_plan:0, hI:0, hE:0,
                plan_i:[0,0,0,0,0,0], plan_e:[0,0,0,0,0,0] };
    });
    var offBrkPlan = {};
    OFF_SUBCATS.forEach(function(s) {
      offBrkPlan[s.code] = {be_plan:0, hE:0, plan_e:[0,0,0,0,0,0]};
    });
    // Плановые поступления/выплаты займов → финансовая деятельность
    var finPlan = {
      skIn:  {hI:0, plan:[0,0,0,0,0,0]},
      skOut: {hE:0, plan:[0,0,0,0,0,0]}
    };

    planItems.forEach(function(item) {
      var proj = PID_MAP[item.project_id];
      if (!proj) return;
      var iy  = parseInt(item.plan_paid_date.substring(0, 4));
      var im  = parseInt(item.plan_paid_date.substring(5, 7));
      var val = item.total || 0;
      var isI = (item.type === 30), isE = (item.type === 40);

      // Займы/кредиты в офисных проектах → финансовая деятельность, не в pm
      if (OXR_PIDS[item.project_id]) {
        var catName = (catMap && catMap[item.category_id]) || '';
        if (LOAN_CATS[catName]) {
          if (iy === curYear && im === curMonth) {
            if (isI) finPlan.skIn.hI  += val;
            if (isE) finPlan.skOut.hE += val;
          }
          nextMonths.forEach(function(nm, idx) {
            var nmYM = nm.year * 100 + nm.month, itemYM = iy * 100 + im;
            var match = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
            if (match) {
              if (isI) finPlan.skIn.plan[idx]  += val;
              if (isE) finPlan.skOut.plan[idx] += val;
            }
          });
          return; // не попадает в pm и offBrkPlan
        }
      }

      // Операционные статьи — как прежде
      var d = pm[proj];
      if (iy > curYear || (iy === curYear && im >= curMonth)) {
        if (isI) d.bi_plan += val;
        if (isE) d.be_plan += val;
      }
      if (iy === curYear && im === curMonth) {
        if (isI) d.hI += val;
        if (isE) d.hE += val;
      }
      nextMonths.forEach(function(nm, idx) {
        // Последний столбец (idx=5) накапливает все месяцы начиная с 6-го
        var nmYM   = nm.year * 100 + nm.month;
        var itemYM = iy * 100 + im;
        var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
        if (match) {
          if (isI) d.plan_i[idx] += val;
          if (isE) d.plan_e[idx] += val;
        }
      });
      // Разбивка плана по подкатегориям для офисных проектов
      if (OXR_PIDS[item.project_id] && isE) {
        var sub = offSubcat(catName || (catMap && catMap[item.category_id]) || '');
        var obp = offBrkPlan[sub];
        if (iy > curYear || (iy === curYear && im >= curMonth)) obp.be_plan += val;
        if (iy === curYear && im === curMonth) obp.hE += val;
        nextMonths.forEach(function(nm, idx) {
          var nmYM   = nm.year * 100 + nm.month;
          var itemYM = iy * 100 + im;
          var match  = idx < 5 ? (iy === nm.year && im === nm.month) : (itemYM >= nmYM);
          if (match) obp.plan_e[idx] += val;
        });
      }
    });
    return {pm: pm, offBrkPlan: offBrkPlan, finPlan: finPlan};
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // НДС ПРОГНОЗ — расчёт и отображение
  // ═══════════════════════════════════════════════════════════════════════════

  function calcVatForecast(txns, planItems, plsItems, catMap, curYear, curMonth) {
    // Текущий квартал: первый месяц квартала
    var q0m = curMonth <= 3 ? 1 : curMonth <= 6 ? 4 : curMonth <= 9 ? 7 : 10;
    var curYM = curYear * 100 + curMonth;

    // 9 колонок: Q0 + Q+1 + Q+2
    var cols = [];
    for (var qi = 0; qi < 9; qi++) {
      var cm = q0m + qi, cy = curYear;
      while (cm > 12) { cm -= 12; cy++; }
      cols.push({y: cy, m: cm, ym: cy * 100 + cm});
    }
    // Далее: всё после 9-го месяца
    var dalM = cols[8].m + 1, dalY = cols[8].y;
    if (dalM > 12) { dalM = 1; dalY++; }
    var dalYM = dalY * 100 + dalM;

    // ── Шаг 1: вычисляем эффективные ставки по категориям из фактических PLS ─
    // Алгоритм как в nds.js: tx.reference_id → catType, PLS 3144 тоже ищет по reference_id.
    // Обе записи (транзакция и PLS) разделяют один и тот же reference_id документа.
    // Ограничиваем период: только curYear и prevYear (совпадает с периодом plsItems).
    var prevYear = curYear - 1;
    var refCatTypeMap = {};
    txns.forEach(function(tx) {
      if (!tx.reference_id) return;
      var aid = tx.org_account_id;
      if (!VSIP_ACC_IDS[aid] && !TT_ACC_IDS[aid]) return;
      var txYear = tx.date ? parseInt(tx.date.substring(0, 4)) : 0;
      if (txYear !== curYear && txYear !== prevYear) return;
      var catName = catMap[tx.category_id] || '';
      var t = getExpCatType(catName);
      if (!t || t === 'zero') return;
      refCatTypeMap[tx.reference_id] = t;
    });

    // Суммируем фактические расходы и НДС по типам
    var effExpByType = {}, effVatByType = {};
    txns.forEach(function(tx) {
      var aid = tx.org_account_id;
      if (!VSIP_ACC_IDS[aid] && !TT_ACC_IDS[aid]) return;
      var txYear = tx.date ? parseInt(tx.date.substring(0, 4)) : 0;
      if (txYear !== curYear && txYear !== prevYear) return;
      var catName = catMap[tx.category_id] || '';
      var expAmt = parseFloat(tx.outcome) || 0;
      if (!expAmt) return;
      var t = getExpCatType(catName);
      if (!t || t === 'zero') return;
      effExpByType[t] = (effExpByType[t] || 0) + expAmt;
    });
    // PLS 3144 — НДС входящий (вычет): reference_id совпадает с tx.reference_id
    (plsItems || []).forEach(function(p) {
      if (p.category_id !== 3144) return;
      var vatAmt = parseFloat(p.outcome) || 0;
      if (!vatAmt) return;
      var t = refCatTypeMap[p.reference_id];
      if (!t) return;
      effVatByType[t] = (effVatByType[t] || 0) + vatAmt;
    });

    // Эффективная ставка = НДС / Расходы.
    // Если числитель = 0 (нет PLS-данных или привязка не сработала) — берём DEFAULT_EFF_RATES.
    var effRates = {};
    ['smr', 'mat', 'design', 'bg', 'ar', 'lz', 'buh', 'proj_other'].forEach(function(t) {
      var denom = effExpByType[t] || 0;
      var numer = effVatByType[t] || 0;
      effRates[t] = (denom > 0 && numer > 0) ? numer / denom : DEFAULT_EFF_RATES[t];
    });
    effRates['zero'] = 0;

    // ── Шаг 2: инициализируем слоты данных ───────────────────────────────
    function makeSlot() {
      return {
        inc: 0, exp: 0, vatIn: 0, vatOut: 0,
        incFact: 0, expFact: 0, vatInFact: 0, vatOutFact: 0,
        incPlan: 0, expPlan: 0, vatInPlan: 0, vatOutPlan: 0
      };
    }
    var data = cols.map(function(c) {
      var s = makeSlot();
      s.y = c.y; s.m = c.m; s.ym = c.ym;
      s.isPast    = c.ym < curYM;
      s.isCurrent = c.ym === curYM;
      return s;
    });
    var dal = makeSlot();

    // ── Шаг 3: факт — транзакции ──────────────────────────────────────────
    txns.forEach(function(tx) {
      var dt = tx.date || '';
      if (dt.length < 7) return;
      var tYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var aid = tx.org_account_id;
      if (!VSIP_ACC_IDS[aid] && !TT_ACC_IDS[aid]) return;
      var catName  = catMap[tx.category_id] || '';
      var projName = PID_MAP[tx.project_id] || '';
      if (catName === 'Перевод между счетами (поступление)' ||
          catName === 'Перевод между счетами (списание)') return;
      var incAmt = parseFloat(tx.income)  || 0;
      var expAmt = parseFloat(tx.outcome) || 0;
      var isInc = isIncome(catName) || (LOAN_CATS[catName] && incAmt > 0);
      var isExp = isExpense(catName, projName) || (LOAN_CATS[catName] && expAmt > 0);
      for (var ci = 0; ci < 9; ci++) {
        if (cols[ci].ym === tYM && (data[ci].isPast || data[ci].isCurrent)) {
          if (incAmt > 0 && isInc) data[ci].incFact += incAmt;
          if (expAmt > 0 && isExp) data[ci].expFact += expAmt;
          break;
        }
      }
    });

    // ── Шаг 4: факт — PLS (3158 = НДС исходящий/доходы, 3157 = НДС входящий/расходы)
    (plsItems || []).forEach(function(p) {
      var dt = p.date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      for (var ci = 0; ci < 9; ci++) {
        if (cols[ci].ym === pYM && (data[ci].isPast || data[ci].isCurrent)) {
          if (p.category_id === 3158) data[ci].vatInFact  += parseFloat(p.income)  || 0;
          if (p.category_id === 3157) data[ci].vatOutFact += parseFloat(p.outcome) || 0;
          break;
        }
      }
    });

    // ── DEBUG ──────────────────────────────────────────────────────────────
    console.log('[НДС-прогноз] effRates:', JSON.stringify(effRates));
    console.log('[НДС-прогноз] effExpByType:', JSON.stringify(effExpByType));
    console.log('[НДС-прогноз] effVatByType:', JSON.stringify(effVatByType));
    console.log('[НДС-прогноз] plsItems 3144 count:', (plsItems||[]).filter(function(p){return p.category_id===3144;}).length);
    console.log('[НДС-прогноз] refCatTypeMap keys:', Object.keys(refCatTypeMap).length);
    // ── Шаг 5: план — plan_money (org_account_id=36), эффективные ставки ─
    var augYM = curYear * 100 + (curMonth === 12 ? 1 : curMonth + 1);
    var augDebug = [];
    (planItems || []).forEach(function(item) {
      var dt = item.plan_paid_date || '';
      if (dt.length < 7) return;
      var pYM = parseInt(dt.slice(0, 4)) * 100 + parseInt(dt.slice(5, 7));
      var val     = item.total || 0;
      var isI     = item.type === 30;
      var isE     = item.type === 40;
      var catName = catMap[item.category_id] || '';
      if (catName === 'Перевод между счетами (поступление)' ||
          catName === 'Перевод между счетами (списание)') return;
      if (pYM === augYM && isE) {
        var t2 = getExpCatType(catName);
        augDebug.push({cat: catName, type: t2, val: val, rate: effRates[t2] || 0, vat: Math.round(val*(effRates[t2]||0))});
      }
      var tgt = null;
      if (pYM >= dalYM) {
        tgt = dal;
      } else {
        for (var ci = 0; ci < 9; ci++) {
          if (cols[ci].ym === pYM) { tgt = data[ci]; break; }
        }
      }
      if (!tgt) return;
      if (isI) {
        var rIn = LOAN_CATS[catName] ? 0 : 22 / 122;
        tgt.incPlan   += val;
        tgt.vatInPlan += Math.round(val * rIn);
      }
      if (isE) {
        var t = getExpCatType(catName);
        var rOut = (t && t !== null) ? (effRates[t] || 0) : 0;
        tgt.expPlan    += val;
        tgt.vatOutPlan += Math.round(val * rOut);
      }
    });
    console.log('[НДС-прогноз] Август — план расходов:', augDebug);

    // ── Шаг 6: итоговые значения — факт / факт+остаток / план ────────────
    data.forEach(function(col) {
      if (col.isPast) {
        col.inc    = col.incFact;
        col.exp    = col.expFact;
        col.vatIn  = col.vatInFact;
        col.vatOut = col.vatOutFact;
      } else if (col.isCurrent) {
        col.inc    = col.incPlan    > 0 ? Math.max(col.incFact,    col.incPlan)    : col.incFact;
        col.exp    = col.expPlan    > 0 ? Math.max(col.expFact,    col.expPlan)    : col.expFact;
        col.vatIn  = col.vatInPlan  > 0 ? Math.max(col.vatInFact,  col.vatInPlan)  : col.vatInFact;
        col.vatOut = col.vatOutPlan > 0 ? Math.max(col.vatOutFact, col.vatOutPlan) : col.vatOutFact;
      } else {
        col.inc    = col.incPlan;
        col.exp    = col.expPlan;
        col.vatIn  = col.vatInPlan;
        col.vatOut = col.vatOutPlan;
      }
    });
    dal.inc    = dal.incPlan;
    dal.exp    = dal.expPlan;
    dal.vatIn  = dal.vatInPlan;
    dal.vatOut = dal.vatOutPlan;

    var pls3144count = (plsItems||[]).filter(function(p){return p.category_id===3144;}).length;
    var refMapKeys   = Object.keys(refCatTypeMap).length;
    return {data: data, dal: dal, cols: cols, curYM: curYM, q0m: q0m, dalYM: dalYM,
            effRates: effRates, effExpByType: effExpByType, effVatByType: effVatByType,
            pls3144count: pls3144count, refMapKeys: refMapKeys};
  }

  function buildVatForecastTable(vf) {
    if (!vf) return '';
    var data = vf.data, dal = vf.dal, cols = vf.cols;

    // ИТОГО ПЛАН = сумма всех 10 колонок минус факт прошлых месяцев текущего квартала
    function colSum(fn) {
      var s = 0;
      data.forEach(function(c) { s += fn(c); });
      s += fn(dal);
      for (var ci = 0; ci < 3; ci++) {
        if (data[ci].isPast) s -= fn(data[ci]);
      }
      return s;
    }
    var itogoInc    = colSum(function(c) { return c.inc; });
    var itogoVatIn  = colSum(function(c) { return c.vatIn; });
    var itogoExp    = colSum(function(c) { return c.exp; });
    var itogoVatOut = colSum(function(c) { return c.vatOut; });
    var itogoRes    = (itogoInc - itogoVatIn) - (itogoExp - itogoVatOut);

    var MO = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
    function mlbl(c) { return MO[c.m - 1] + '\'' + String(c.y).slice(2); }
    var dalM2 = vf.dalYM % 100, dalY2 = Math.floor(vf.dalYM / 100);
    var dalLabel = MO[dalM2 - 1] + '\'' + String(dalY2).slice(2) + '+';

    var HS  = 'padding:3px 5px;text-align:right;font-size:10px;font-weight:600;color:#374151;border-bottom:2px solid #9ca3af;white-space:nowrap';
    var HSl = 'padding:3px 5px;font-size:10px;font-weight:600;color:#374151;border-bottom:2px solid #9ca3af';
    var BL  = 'border-left:2px solid #3d5c7a';

    function fv(v) {
      var n = Math.round((v || 0) / 1000);
      if (!n) return '<span style="color:#ccc">—</span>';
      return new Intl.NumberFormat('ru-RU').format(n);
    }
    function colBg(c) {
      if (!c) return '';
      if (c.isPast)    return 'background:#f3f4f6';
      if (c.isCurrent) return 'background:#eff6ff';
      return '';
    }

    // Строка 1 заголовка: кварталы
    var h1 = '<tr>'
      + '<th style="' + HSl + '"></th>'
      + '<th colspan="3" style="' + HS + ';' + BL + ';text-align:center">Текущий квартал</th>'
      + '<th colspan="3" style="' + HS + ';' + BL + ';text-align:center">Квартал +1</th>'
      + '<th colspan="3" style="' + HS + ';' + BL + ';text-align:center">Квартал +2</th>'
      + '<th style="' + HS + ';' + BL + ';text-align:center">Далее</th>'
      + '<th style="' + HS + ';' + BL + ';text-align:center;color:#1d4ed8">ИТОГО ПЛАН</th>'
      + '</tr>';

    // Строка 2 заголовка: месяцы
    var h2 = '<tr><th style="' + HSl + '">тыс. руб.</th>';
    cols.forEach(function(c, ci) {
      var bg = data[ci].isPast ? 'background:#e5e7eb' : data[ci].isCurrent ? 'background:#dbeafe' : 'background:#f8f9fd';
      var bl = (ci % 3 === 0) ? ';' + BL : '';
      h2 += '<th style="' + HS + ';' + bg + bl + '">' + mlbl(c) + '</th>';
    });
    h2 += '<th style="' + HS + ';' + BL + '">' + dalLabel + '</th>';
    h2 += '<th style="' + HS + ';' + BL + ';color:#1d4ed8">ИТОГО</th>';
    h2 += '</tr>';

    function dataRow(label, fn, vatColor) {
      var row = '<tr>';
      var ls = 'padding:2px 5px;font-size:11px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#374151';
      row += '<td style="' + ls + '">' + label + '</td>';
      data.forEach(function(c, ci) {
        var bg = colBg(c);
        var bl = (ci % 3 === 0) ? ';' + BL : '';
        var st = 'padding:2px 5px;text-align:right;font-size:11px;white-space:nowrap;border-bottom:1px solid #f0f0f0' + (bg ? ';' + bg : '') + bl;
        if (vatColor) st += ';color:' + vatColor;
        row += '<td style="' + st + '">' + fv(fn(c)) + '</td>';
      });
      var dalV = fn(dal);
      var dSt = 'padding:2px 5px;text-align:right;font-size:11px;white-space:nowrap;border-bottom:1px solid #f0f0f0;' + BL + (vatColor ? ';color:' + vatColor : '');
      row += '<td style="' + dSt + '">' + fv(dalV) + '</td>';
      var iV = colSum(fn);
      var iSt = 'padding:2px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;border-bottom:1px solid #f0f0f0;' + BL + (vatColor ? ';color:' + vatColor : ';color:#1d4ed8');
      row += '<td style="' + iSt + '">' + fv(iV) + '</td>';
      row += '</tr>';
      return row;
    }

    function resRow(label) {
      var brdT = 'border-top:2px solid #9ca3af';
      var row = '<tr style="background:#f0fdf4">';
      row += '<td style="padding:3px 5px;font-size:11px;' + brdT + ';white-space:nowrap"><strong style="color:#15803d">' + label + '</strong></td>';
      data.forEach(function(c, ci) {
        var bg = colBg(c);
        var bl = (ci % 3 === 0) ? ';' + BL : '';
        var v = (c.inc - c.vatIn) - (c.exp - c.vatOut);
        var clr = v > 0 ? '#15803d' : v < 0 ? '#dc2626' : '#6b7280';
        row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + (bg ? ';' + bg : '') + bl + ';color:' + clr + '">' + fv(v) + '</td>';
      });
      var dalV = (dal.inc - dal.vatIn) - (dal.exp - dal.vatOut);
      var dalClr = dalV > 0 ? '#15803d' : dalV < 0 ? '#dc2626' : '#6b7280';
      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + ';' + BL + ';color:' + dalClr + '">' + fv(dalV) + '</td>';
      var iClr = itogoRes > 0 ? '#15803d' : itogoRes < 0 ? '#dc2626' : '#6b7280';
      row += '<td style="padding:3px 5px;text-align:right;font-size:11px;font-weight:700;white-space:nowrap;' + brdT + ';' + BL + ';color:' + iClr + '">' + fv(itogoRes) + '</td>';
      row += '</tr>';
      return row;
    }

    // Таблица эффективных ставок
    var TYPES_LABELS = {smr:'СМР', mat:'Материалы', design:'Проектирование/Изыскание', ar:'Аренда', lz:'Лизинг', buh:'Бухгалтерия', proj_other:'Прочие проектные', bg:'Банк. гарантии', zero:'Без НДС'};
    var DEFAULT_EFF_RATES_REF = {smr:22/122, mat:22/122, design:22/122, bg:0, ar:22/122, lz:22/122, buh:0, proj_other:22/122, zero:0};
    var rateRows = '';
    var TS = 'padding:2px 6px;font-size:10px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#374151';
    var TSr = TS + ';text-align:right';
    ['smr','mat','design','ar','lz','buh','proj_other','bg','zero'].forEach(function(t) {
      var exp = vf.effExpByType[t] || 0;
      var vat = vf.effVatByType[t] || 0;
      var rate = vf.effRates[t] || 0;
      var fromFact = exp > 0 && vat > 0;
      var srcLabel = fromFact ? '<span style="color:#15803d;font-weight:600">факт PLS</span>' : '<span style="color:#9ca3af">дефолт</span>';
      var rateStr = rate > 0 ? (rate * 100).toFixed(2) + '%' : '0%';
      var expStr  = exp  > 0 ? new Intl.NumberFormat('ru-RU').format(Math.round(exp / 1000)) + ' тыс.' : '—';
      var vatStr  = vat  > 0 ? new Intl.NumberFormat('ru-RU').format(Math.round(vat / 1000)) + ' тыс.' : '—';
      rateRows += '<tr>'
        + '<td style="' + TS  + '">' + TYPES_LABELS[t] + '</td>'
        + '<td style="' + TSr + '">' + expStr + '</td>'
        + '<td style="' + TSr + '">' + vatStr + '</td>'
        + '<td style="' + TSr + ';font-weight:600;color:#1d4ed8">' + rateStr + '</td>'
        + '<td style="' + TSr + '">' + srcLabel + '</td>'
        + '</tr>';
    });
    var TH = 'padding:2px 6px;font-size:10px;font-weight:600;color:#6b7280;border-bottom:1.5px solid #9ca3af;white-space:nowrap;text-align:right';
    var totalEffExp = Object.keys(vf.effExpByType||{}).reduce(function(s,k){return s+(vf.effExpByType[k]||0);},0);
    var totalEffVat = Object.keys(vf.effVatByType||{}).reduce(function(s,k){return s+(vf.effVatByType[k]||0);},0);
    var diagStr = '<div style="font-size:10px;color:#6b7280;padding:2px 6px 4px">'
      + 'PLS 3144: ' + (vf.pls3144count||0) + ' записей · '
      + 'tx с reference_id: ' + (vf.refMapKeys||0) + ' · '
      + 'Расходы-факт: ' + Math.round(totalEffExp/1000) + ' тыс. · '
      + 'НДС совпало: ' + Math.round(totalEffVat/1000) + ' тыс.'
      + (_pls3144err ? ' <span style="color:#dc2626">⚠ req2: ' + _pls3144err + '</span>' : '')
      + '</div>';
    var rateTable = '<div style="margin-top:10px">'
      + '<div style="font-size:11px;font-weight:600;color:#6b7280;padding:3px 6px 2px;border-bottom:1px solid #d1d5db;background:#f8f9fd">Эффективные ставки НДС (расходы)</div>'
      + diagStr
      + '<table style="border-collapse:collapse;width:auto;min-width:420px">'
      + '<tr>'
      + '<th style="' + TH + ';text-align:left">Тип расходов</th>'
      + '<th style="' + TH + '">Расходы-факт</th>'
      + '<th style="' + TH + '">НДС-факт (PLS 3144)</th>'
      + '<th style="' + TH + '">Ставка</th>'
      + '<th style="' + TH + '">Источник</th>'
      + '</tr>'
      + rateRows
      + '</table></div>';

    return '<div style="margin-top:16px">'
      + '<div style="font-size:13px;font-weight:700;color:#374151;padding:3px 5px 2px;border-bottom:2px solid #9ca3af;background:#f8f9fd">'
      + 'НДС ПРОГНОЗ (тыс. руб.)</div>'
      + '<table style="border-collapse:collapse;width:100%">'
      + h1 + h2
      + dataRow('Поступления',        function(c) { return c.inc; })
      + dataRow('НДС с поступлений',  function(c) { return c.vatIn; },  '#92400e')
      + dataRow('Выплаты',            function(c) { return c.exp; })
      + dataRow('НДС с выплат',       function(c) { return c.vatOut; }, '#92400e')
      + resRow('Плановый результат (без НДС)')
      + '</table>'
      + rateTable
      + '</div>';
  }

  // Построение таблицы
  function buildTable(result, pm, curYear, curMonth, nextMonths, offBrkPlan, vat, finPlan) {
    var acc    = result.acc;
    var fin    = result.fin;
    var offBrk = result.offBrk || newOffBrk();
    var vSt  = result.vSt,  tSt  = result.tSt;
    var vEnd = result.vEnd, tEnd = result.tEnd;
    var tSt0 = vSt + tSt, tEnd0 = vEnd + tEnd;

    var now       = new Date();
    var todayStr  = pad2(now.getDate()) + '.' + pad2(now.getMonth()+1) + '.' + now.getFullYear();
    var jan1Str   = '01.01.' + curYear;
    var curMon    = MS[curMonth - 1];
    var prevYear  = curYear - 1;

    var SEP = ';border-left:2px solid #3d5c7a';
    var BT  = ';border-top:2px solid #c5cfe8';
    var BT2 = ';border-top:2px solid #4a6a8a';
    var BL2 = ';border-left:2px solid #4a6a8a';

    function TH(v, s)  { return '<th style="padding:5px 6px;text-align:right;border-bottom:2px solid #3d5c7a;font-size:10px;font-weight:600;white-space:nowrap' + (s||'') + '">' + v + '</th>'; }
    function THl(v, s) { return '<th style="padding:5px 6px;text-align:left;border-bottom:2px solid #3d5c7a;font-size:10px;font-weight:600' + (s||'') + '">' + v + '</th>'; }
    function TD(v, s)  { return '<td style="padding:2px 6px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap' + (s||'') + '">' + v + '</td>'; }
    function TDl(v, s) { return '<td style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap' + (s||'') + '">' + v + '</td>'; }
    function dash()    { return '<span style="color:#ccc">—</span>'; }

    // 6 пустых ячеек для колонок плана (с SEP на первой)
    function planEmpty() {
      return TD(dash(), SEP) + TD(dash()) + TD(dash()) + TD(dash()) + TD(dash()) + TD(dash());
    }

    function getBudget(p, type) {
      var a = acc[p], d = pm[p];
      return type === 'inc'
        ? a.i25 + (a.i26 - a.iCur) + d.bi_plan
        : a.e25 + (a.e26 - a.eCur) + d.be_plan;
    }

    function totals(type) {
      var t = { b:0, f25:0, f26:0, fCur:0, fH:0, plan:[0,0,0,0,0,0] };
      PROJECTS.forEach(function(p) {
        var d = pm[p], a = acc[p];
        t.b    += getBudget(p, type);
        t.f25  += (type === 'inc') ? a.i25  : a.e25;
        t.f26  += (type === 'inc') ? a.i26  : a.e26;
        t.fCur += (type === 'inc') ? a.iCur : a.eCur;
        t.fH   += (type === 'inc') ? d.hI   : d.hE;
        for (var i = 0; i < 6; i++)
          t.plan[i] += (type === 'inc') ? d.plan_i[i] : d.plan_e[i];
      });
      t.fact = t.f25 + t.f26;
      t.ost  = t.b - t.fact;
      return t;
    }

    function pRow(p, type) {
      var d = pm[p], a = acc[p];
      var b    = getBudget(p, type);
      var f25  = (type === 'inc') ? a.i25  : a.e25;
      var f26  = (type === 'inc') ? a.i26  : a.e26;
      var fCur = (type === 'inc') ? a.iCur : a.eCur;
      var h    = (type === 'inc') ? d.hI   : d.hE;
      var plan = (type === 'inc') ? d.plan_i : d.plan_e;
      var fact = f25 + f26, ost = b - fact;
      if (!b && !fact && plan.every(function(x){ return !x; })) return '';
      return '<tr>'
        + TDl(p)
        + TD(fmtK(b), ';color:#9ca3af')
        + TD(fmtK(f25), SEP) + TD(fmtK(f26))
        + TD(fmtK(fact, true))
        + TD(fmtK(ost, false, true), ost < 0 ? ';color:#dc2626' : '')
        + TD(fmtK(h), SEP) + TD(fmtK(fCur))
        + plan.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
        + '</tr>';
    }

    function totRow(label, t, bg) {
      bg = bg || '#eef2ff';
      return '<tr style="background:' + bg + '">'
        + TDl('<strong>' + label + '</strong>', BT)
        + TD(fmtK(t.b, true), ';color:#9ca3af' + BT)
        + TD(fmtK(t.f25, true), SEP + BT) + TD(fmtK(t.f26, true), BT)
        + TD(fmtK(t.fact, true), BT)
        + TD(fmtK(t.ost, true, true), (t.ost < 0 ? ';color:#dc2626' : '') + BT)
        + TD(fmtK(t.fH, true), SEP + BT) + TD(fmtK(t.fCur, true), BT)
        + t.plan.map(function(v, i) { return TD(fmtK(v, true), (i === 0 ? SEP : '') + BT); }).join('')
        + '</tr>';
    }

    // Секция офисных расходов с разбивкой по подкатегориям
    function offExpSection() {
      var proj = 'Офис (ВСИП+ТТ)';
      var d = pm[proj], a = acc[proj];
      // Подкатегории кроме po, отсортированные по f26 убыванию
      var subs = OFF_SUBCATS.filter(function(s) {
        return s.code !== 'po' && (offBrk[s.code].f25 || offBrk[s.code].f26 || offBrk[s.code].fCur
          || (offBrkPlan && offBrkPlan[s.code].be_plan));
      });
      subs.sort(function(a, b) { return (offBrk[b.code].f26||0) - (offBrk[a.code].f26||0); });
      // po всегда последние
      var poSub = OFF_SUBCATS.filter(function(s) { return s.code === 'po'; })[0];
      if (offBrk.po.f25 || offBrk.po.f26 || offBrk.po.fCur || (offBrkPlan && offBrkPlan.po.be_plan))
        subs.push(poSub);
      var subRows = subs.map(function(s) {
        var brk = offBrk[s.code];
        var obp = offBrkPlan ? offBrkPlan[s.code] : null;
        var tot = brk.f25 + brk.f26;
        // Бюджет = факт_25 + (факт_26 - тек.мес) + план_от_тек.мес
        var b   = brk.f25 + (brk.f26 - brk.fCur) + (obp ? obp.be_plan : 0);
        var ost = b - tot;
        var hE  = obp ? obp.hE : 0;
        return '<tr>'
          + TDl('<span style="padding-left:14px">' + s.label + '</span>')
          + TD(fmtK(b), ';color:#9ca3af')
          + TD(fmtK(brk.f25), SEP) + TD(fmtK(brk.f26))
          + TD(fmtK(tot, true))
          + TD(fmtK(ost, false, true), ost < 0 ? ';color:#dc2626' : '')
          + TD(fmtK(hE), SEP) + TD(fmtK(brk.fCur))
          + (obp ? obp.plan_e : [0,0,0,0,0,0]).map(function(v, i) {
              return TD(fmtK(v), i === 0 ? SEP : '');
            }).join('')
          + '</tr>';
      }).join('');
      // Итого офисные
      var f25 = a ? a.e25 : 0, f26 = a ? a.e26 : 0, fCur = a ? a.eCur : 0;
      var b = getBudget(proj, 'exp');
      var plan = d ? d.plan_e : [0,0,0,0,0,0];
      var fact = f25 + f26, ost = b - fact;
      return sectionHdr('ОФИСНЫЕ РАСХОДЫ', '#f3f0ff', '#4c1d95', '#c4b5fd')
        + subRows
        + '<tr style="background:#ede9fe">'
        + TDl('<strong>Итого офисные</strong>', BT)
        + TD(fmtK(b, true), ';color:#9ca3af' + BT)
        + TD(fmtK(f25, true), SEP + BT) + TD(fmtK(f26, true), BT)
        + TD(fmtK(fact, true), BT)
        + TD(fmtK(ost, true, true), (ost < 0 ? ';color:#dc2626' : '') + BT)
        + TD(fmtK(d ? d.hE : 0, true), SEP + BT) + TD(fmtK(fCur, true), BT)
        + plan.map(function(v, i) { return TD(fmtK(v, true), (i === 0 ? SEP : '') + BT); }).join('')
        + '</tr>';
    }

    // Строка финансовой деятельности: только факт-колонки, план пустой
    function finRow(label, item) {
      var f25 = item.f25, f26 = item.f26, tot = f25 + f26, fCur = item.fCur;
      if (!tot && !fCur) return '';
      return '<tr>'
        + TDl(label, ';padding-left:14px')
        + TD(dash(), ';color:#9ca3af')
        + TD(fmtK(f25), SEP) + TD(fmtK(f26))
        + TD(fmtK(tot, true))
        + TD(dash())
        + TD(dash(), SEP) + TD(fmtK(fCur))
        + planEmpty()
        + '</tr>';
    }

    // Строка займов: факт + план (hPlan — тек.мес.бюджет, planArr — 6 план.месяцев)
    function finLoanRow(label, item, hPlan, planArr) {
      var f25 = item.f25, f26 = item.f26, tot = f25 + f26, fCur = item.fCur;
      hPlan = hPlan || 0;
      planArr = planArr || [0,0,0,0,0,0];
      var hasPlan = hPlan > 0 || planArr.some(function(v) { return v > 0; });
      if (!tot && !fCur && !hasPlan) return '';
      return '<tr>'
        + TDl(label, ';padding-left:14px')
        + TD(dash(), ';color:#9ca3af')
        + TD(fmtK(f25), SEP) + TD(fmtK(f26))
        + TD(fmtK(tot, true))
        + TD(dash())
        + TD(fmtK(hPlan), SEP) + TD(fmtK(fCur))
        + planArr.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
        + '</tr>';
    }

    // Итого нетто финансовой деятельности
    var finNetF25  = fin.skIn.f25  + fin.trIn.f25  - fin.skOut.f25  - fin.int.f25  - fin.trOut.f25;
    var finNetF26  = fin.skIn.f26  + fin.trIn.f26  - fin.skOut.f26  - fin.int.f26  - fin.trOut.f26;
    var finNetCur  = fin.skIn.fCur + fin.trIn.fCur - fin.skOut.fCur - fin.int.fCur - fin.trOut.fCur;
    var finNetTot  = finNetF25 + finNetF26;
    // Плановое нетто финансовой деятельности (займы; переводы и % — без плана)
    var fp = finPlan || {skIn:{hI:0,plan:[0,0,0,0,0,0]}, skOut:{hE:0,plan:[0,0,0,0,0,0]}};
    var finNetPlanCur = fp.skIn.hI - fp.skOut.hE;
    var finNetPlan    = fp.skIn.plan.map(function(v, i) { return v - fp.skOut.plan[i]; });

    var ti = totals('inc'), te = totals('exp');

    // Контрольная сумма:
    // Остаток_нач + Доходы_26 + ФинПриход_26 - Расходы_26 - ФинРасход_26 = Остаток_кон
    var finIn26  = fin.skIn.f26  + fin.trIn.f26;
    var finOut26 = fin.skOut.f26 + fin.int.f26 + fin.trOut.f26;
    var ctrl = tSt0 + (ti.f26 + finIn26) - (te.f26 + finOut26) - tEnd0;
    var cOk  = Math.abs(ctrl) < 1000;

    // === НДС: ставки временно обнулены (TODO: уточнить методику расчёта) ===
    var vatD = {in_25:0, in_26:0, in_cur:0, out_25:0, out_26:0, out_cur:0};
    var effVatIn = 0, effVatOut = 0;
    // Плановый НДС по каждому из 6 месяцев
    var vatInPlan  = ti.plan.map(function(v) { return Math.round(v * effVatIn); });
    var vatOutPlan = te.plan.map(function(v) { return Math.round(v * effVatOut); });
    var vatInCurPlan  = Math.round(ti.fH * effVatIn);
    var vatOutCurPlan = Math.round(te.fH * effVatOut);
    var vatInTot  = vatD.in_25  + vatD.in_26;
    var vatOutTot = vatD.out_25 + vatD.out_26;
    // Плановый остаток нарастающим итогом (нетто по НДС + финансовая деятельность)
    // Правило: если план строки = 0, остаток = 0 (не вычитаем факт из нуля)
    var planBal_cur = Math.round(tEnd0
      + (ti.fH  > 0 ? ti.fH  - ti.fCur          : 0) * (1 - effVatIn)   // остаток план опер. поступлений
      - (te.fH  > 0 ? te.fH  - te.fCur          : 0) * (1 - effVatOut)  // остаток план опер. выплат
      + (fp.skIn.hI  > 0 ? fp.skIn.hI  - fin.skIn.fCur  : 0)            // остаток план получения займов
      - (fp.skOut.hE > 0 ? fp.skOut.hE - fin.skOut.fCur : 0));           // остаток план выплаты займов
    var planBal = [0, 0, 0, 0, 0, 0];
    for (var bi = 0; bi < 6; bi++) {
      var bPrev = bi === 0 ? planBal_cur : planBal[bi - 1];
      planBal[bi] = Math.round(bPrev
        + ti.plan[bi] * (1 - effVatIn)
        - te.plan[bi] * (1 - effVatOut)
        + fp.skIn.plan[bi]                         // плановое получение займов
        - fp.skOut.plan[bi]);                      // плановая выплата займов
    }

    var yearLabel = curYear + '<br><span style="font-weight:400;font-size:9px">янв–' + curMon.toLowerCase() + '</span>';

    var sectionHdr = function(text, bg, color, border) {
      return '<tr style="background:' + bg + '"><td colspan="14" style="padding:4px 8px;font-weight:700;font-size:11.5px;color:' + color + ';border-bottom:1px solid ' + border + '">' + text + '</td></tr>';
    };

    // Строка остатка: метка span на кол.1-3, значение в кол.4
    function balRow(lbl, v, total, bg) {
      return '<tr style="font-size:10.5px' + (bg ? ';background:' + bg : '') + '">'
        + '<td colspan="3" style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#374151">'
        + (total ? '<strong>' + lbl + '</strong>' : lbl)
        + '</td>'
        + TD(fmtBal(v, total), '')
        + TD(dash()) + TD(dash())
        + TD(dash(), SEP) + TD(dash())
        + planEmpty()
        + '</tr>';
    }
    function balOpenRow(entity, v, total) {
      return balRow('Остаток на ' + jan1Str + ' · ' + entity, v, total, total ? '#d1e8ff' : '');
    }
    function balCloseRow(entity, v, total) {
      return balRow('Остаток на ' + todayStr + ' · ' + entity, v, total, total ? '#d1e8ff' : '');
    }

    // Переводы между счетами — одна строка нетто
    var trNet = {
      f25:  fin.trIn.f25  - fin.trOut.f25,
      f26:  fin.trIn.f26  - fin.trOut.f26,
      fCur: fin.trIn.fCur - fin.trOut.fCur
    };

    var ctrlStr = (function() {
      var absV = Math.abs(ctrl) / 1000;
      var s = absV.toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      return ctrl < 0 ? '(' + s + ')' : s;
    })();

    return '<table style="width:100%;border-collapse:collapse;font-size:11px">'
      + '<thead>'
      + '<tr style="background:#1e3a5f;color:#a8c4e0;font-size:9px">'
      + '<td style="padding:2px 6px;min-width:120px"></td><td></td>'
      + '<td colspan="4" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">ФАКТ</td>'
      + '<td colspan="2" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">Тек. месяц (' + curMon + ')</td>'
      + '<td colspan="6" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">&#9654; План</td>'
      + '</tr>'
      + '<tr style="background:#1e3a5f;color:#fff">'
      + THl('Проект', ';width:1%')
      + TH('Бюджет', ';color:#a8c4e0')
      + TH(String(prevYear), SEP + ';color:#a8c4e0')
      + TH(yearLabel)
      + TH('Итого') + TH('Остаток')
      + TH('Бюджет', SEP) + TH('Факт')
      + nextMonths.map(function(nm, i) {
          var lbl = MS[nm.month-1] + (nm.year !== curYear ? ' \'' + String(nm.year).slice(2) : '');
          if (i === 5) lbl += '+далее';
          return TH(lbl, i === 0 ? SEP : '');
        }).join('')
      + '</tr>'
      + '</thead>'
      + '<tbody>'

      // Начальный остаток на 01.01
      + balOpenRow('ВСИП', vSt, false)
      + balOpenRow('ТТ', tSt, false)
      + balOpenRow('ИТОГО', tSt0, true)

      // ДОХОДЫ
      + sectionHdr('ДОХОДЫ', '#dce7f5', '#1e3a5f', '#c5cfe8')
      + PROJECTS.map(function(p) { return pRow(p, 'inc'); }).join('')
      + totRow('ИТОГО ДОХОДЫ', ti)

      // НДС с поступлений
      + '<tr style="background:#fffbeb">'
      + TDl('<em style="color:#92400e">НДС с поступлений</em>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(vatD.in_25), SEP) + TD(fmtK(vatD.in_26))
      + TD(fmtK(vatInTot, true))
      + TD(dash())
      + TD(fmtK(vatInCurPlan), SEP) + TD(fmtK(vatD.in_cur))
      + vatInPlan.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // Поступления без НДС = Итого доходы - НДС
      + '<tr style="background:#f0fdf4">'
      + TDl('<strong style="color:#15803d">Поступления без НДС</strong>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(ti.f25 - vatD.in_25), SEP) + TD(fmtK(ti.f26 - vatD.in_26))
      + TD(fmtK(ti.fact - vatInTot, true))
      + TD(dash())
      + TD(fmtK(ti.fH - vatInCurPlan), SEP) + TD(fmtK(ti.fCur - vatD.in_cur))
      + vatInPlan.map(function(v, i) { return TD(fmtK(ti.plan[i] - v, true), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // РАСХОДЫ
      + sectionHdr('РАСХОДЫ', '#fae8e8', '#7f1d1d', '#fca5a5')
      + PROJECTS.filter(function(p) { return p !== 'Офис (ВСИП+ТТ)'; }).map(function(p) { return pRow(p, 'exp'); }).join('')
      + offExpSection()
      + totRow('ИТОГО РАСХОДЫ', te, '#fef2f2')

      // НДС с выплат
      + '<tr style="background:#fff7ed">'
      + TDl('<em style="color:#9a3412">НДС с выплат</em>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(vatD.out_25), SEP) + TD(fmtK(vatD.out_26))
      + TD(fmtK(vatOutTot, true))
      + TD(dash())
      + TD(fmtK(vatOutCurPlan), SEP) + TD(fmtK(vatD.out_cur))
      + vatOutPlan.map(function(v, i) { return TD(fmtK(v), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // Расходы без НДС = Итого расходы - НДС
      + '<tr style="background:#fff0f0">'
      + TDl('<strong style="color:#991b1b">Расходы без НДС</strong>')
      + TD(dash(), ';color:#9ca3af')
      + TD(fmtK(te.f25 - vatD.out_25), SEP) + TD(fmtK(te.f26 - vatD.out_26))
      + TD(fmtK(te.fact - vatOutTot, true))
      + TD(dash())
      + TD(fmtK(te.fH - vatOutCurPlan), SEP) + TD(fmtK(te.fCur - vatD.out_cur))
      + vatOutPlan.map(function(v, i) { return TD(fmtK(te.plan[i] - v, true), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // ФИНАНСОВАЯ ДЕЯТЕЛЬНОСТЬ
      + sectionHdr('ФИНАНСОВАЯ ДЕЯТЕЛЬНОСТЬ', '#f0f4ff', '#3730a3', '#c7d2fe')
      + finLoanRow('Выдача/Выплата займов',    fin.skOut, finPlan ? finPlan.skOut.hE   : 0, finPlan ? finPlan.skOut.plan : null)
      + finLoanRow('Получение/Возврат займов', fin.skIn,  finPlan ? finPlan.skIn.hI    : 0, finPlan ? finPlan.skIn.plan  : null)
      + finRow('Процентные расходы', fin.int)
      + finRow('Переводы между счетами', trNet)
      + '<tr style="background:#e0e7ff">'
      + TDl('<strong>ИТОГО финансовая деятельность</strong>', BT)
      + TD(dash(), ';color:#9ca3af' + BT)
      + TD(fmtK(finNetF25, true), SEP + BT) + TD(fmtK(finNetF26, true), BT)
      + TD(fmtK(finNetTot, true), BT)
      + TD(dash(), BT)
      + TD(fmtK(finNetPlanCur, true), SEP + BT) + TD(fmtK(finNetCur, true), BT)
      + finNetPlan.map(function(v, i) { return TD(fmtK(v, true), (i === 0 ? SEP : '') + BT); }).join('')
      + '</tr>'

      // Закрывающий остаток на текущую дату
      + balCloseRow('ВСИП', vEnd, false)
      + balCloseRow('ТТ', tEnd, false)
      + balCloseRow('ИТОГО', tEnd0, true)

      // Плановый остаток на конец периода
      // Тек.мес.: tEnd0 + остаток план поступлений нетто - остаток план выплат нетто
      // Плановые месяцы: остаток предыдущего + поступления нетто - выплаты нетто
      + '<tr style="background:#dbeafe;font-size:10.5px">'
      + '<td colspan="3" style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap;color:#1e40af"><strong>Плановый остаток на конец периода</strong></td>'
      + TD(dash())
      + TD(dash()) + TD(dash())
      + TD(fmtBal(planBal_cur, true), SEP) + TD(dash())
      + planBal.map(function(v, i) { return TD(fmtBal(v, true), i === 0 ? SEP : ''); }).join('')
      + '</tr>'

      // КОНТРОЛЬНАЯ СУММА
      + '<tr style="background:#1e3a5f">'
      + TDl('<strong style="color:#fff">' + (cOk ? '&#10003; Контрольная сумма' : '&#9888; Контрольная сумма') + '</strong>', BT2)
      + TD(dash(), BT2)
      + TD(dash(), BL2 + BT2) + TD(dash(), BT2)
      + TD('<strong style="color:' + (cOk ? '#6ee7b7' : '#fca5a5') + '">' + ctrlStr + '</strong>', BT2)
      + TD(dash(), BT2)
      + TD(dash(), BL2 + BT2) + TD(dash(), BT2)
      + TD(dash(), BL2 + BT2) + TD(dash(), BT2) + TD(dash(), BT2)
      + TD(dash(), BT2) + TD(dash(), BT2) + TD(dash(), BT2)
      + '</tr>'

      + '</tbody></table>';
  }

  // Загрузка
  var loading = false;

  function load() {
    if (loading) return;
    loading = true;
    var statusEl  = document.getElementById('status');
    var contentEl = document.getElementById('content');
    var now = new Date(), yr = now.getFullYear(), mo = now.getMonth() + 1;

    statusEl.textContent = '&#9679; загрузка...';
    statusEl.style.color = '#d97706';
    contentEl.innerHTML  = '<div style="padding:20px;text-align:center;color:#6b7280">&#8987; Загружаем данные...</div>';

    var t0 = Date.now();
    // Следующие 6 месяцев после текущего (не включая текущий), с переходом в следующий год
    var nextMonths = [];
    for (var i = 0; i < 6; i++) {
      var nm = mo + 1 + i, ny = yr;
      if (nm > 12) { nm -= 12; ny++; }
      nextMonths.push({year: ny, month: nm});
    }
    Promise.all([
      fetchAll('transaction'),
      fetchPlanMoney(yr),
      fetchCategories(),
      fetchPls(yr).catch(function() { return []; })
    ]).then(function(results) {
      var txns      = results[0];
      var planItems = results[1];
      var catMap    = results[2];
      var plsItems  = results[3];
      var factResult  = calcFact(txns, catMap, yr, mo);
      var planResult  = calcPlan(planItems, yr, mo, nextMonths, catMap);
      var vat         = calcVat(plsItems, yr, mo);
      var pm          = planResult.pm;
      var offBrkPlan  = planResult.offBrkPlan;
      var finPlan     = planResult.finPlan;
      var vf = calcVatForecast(txns, planItems, plsItems, catMap, yr, mo);
      contentEl.innerHTML = buildTable(factResult, pm, yr, mo, nextMonths, offBrkPlan, vat, finPlan)
        + buildVatForecastTable(vf);
      var elapsed = ((Date.now() - t0) / 1000).toFixed(0);
      statusEl.innerHTML = '&#9679; live · ' + now.toLocaleDateString('ru-RU') + ' · ' + txns.length + ' тр. · ' + elapsed + 'с';
      statusEl.style.color = '#059669';
      loading = false;
    }).catch(function(err) {
      contentEl.innerHTML = '<div style="padding:16px;color:#dc2626">&#10060; Ошибка: ' + err.message + '</div>';
      statusEl.textContent = '&#9679; ошибка';
      statusEl.style.color = '#dc2626';
      loading = false;
    });
  }

  document.getElementById('refresh-btn').addEventListener('click', function() {
    loading = false;
    load();
  });

  load();
})();
</script>
</body>
</html>
