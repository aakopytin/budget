<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сводный финансовый отчёт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11px;
    background: #f8f9fd;
    padding: 12px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .title { font-size: 14px; font-weight: 700; color: #111827; }
  .subtitle { font-size: 10px; color: #9ca3af; margin-left: 8px; }
  .status-row { display: flex; gap: 6px; align-items: center; }
  #status { font-size: 10.5px; color: #d97706; }
  #refresh-btn {
    background: none;
    border: 1px solid #d1d5db;
    color: #6b7280;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #refresh-btn:hover { background: #f3f4f6; }
  #content { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  th, td { white-space: nowrap; }
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="title">📊 Сводный финансовый отчёт</span>
    <span class="subtitle">Все суммы в тысячах рублей</span>
  </div>
  <div class="status-row">
    <span id="status">● инициализация...</span>
    <button id="refresh-btn" title="Обновить">↻</button>
  </div>
</div>

<div id="content">
  <div style="padding:20px;text-align:center;color:#6b7280">⏳ Загружаем данные...</div>
</div>

<script>
(function () {
  'use strict';

  const LABEL_MAP = {
    'Кемерово':                 'Кемерово',
    'Десногорск':               'Десногорск',
    'Киров':                    'Киров',
    'Сыктывкар':                'Сыктывкар',
    'Барнаул':                  'Барнаул',
    'Рузаевка':                 'Рузаевка',
    'Южно-Сахалинск':           'Ю-Сахалинск',
    'Менжинского':              'Центр. договор',
    'Тогул':                    'Центр. договор',
    'Красногорское':            'Центр. договор',
    'Угловское':                'Центр. договор',
    'Уни':                      'Центр. договор',
    'Первомайское':             'Центр. договор',
    'Рассказово':               'Центр. договор',
    'Голутвинский':             'Центр. договор',
    'Иволгинск':                'Иволгинск',
    'Москва, ул. Новгородская': 'Прочие',
    'Чечня':                    'Прочие',
    'Анадырь':                  'Прочие',
    'Сити':                     'Прочие',
    'Омутнинск':                'Прочие',
    'ВСИП Общие расходы':       'ОХР (ВСИП+ТТ)',
    'ТТ общие расходы':         'ОХР (ВСИП+ТТ)',
  };

  const PID_MAP = {
    1:'Кемерово', 6:'Десногорск', 12:'Киров', 23:'Сыктывкар', 13:'Барнаул',
    9:'Рузаевка', 3:'Ю-Сахалинск', 25:'Ю-Сахалинск', 7:'Иволгинск',
    2:'Центр. договор', 18:'Центр. договор', 19:'Центр. договор',
    29:'Центр. договор', 30:'Центр. договор', 31:'Центр. договор', 32:'Центр. договор',
    22:'Прочие', 20:'Прочие', 17:'Прочие', 21:'Прочие',
    24:'ОХР (ВСИП+ТТ)', 26:'ОХР (ВСИП+ТТ)',
  };

  const PROJECTS = [
    'Кемерово','Десногорск','Киров','Сыктывкар','Барнаул',
    'Рузаевка','Ю-Сахалинск','Иволгинск','Центр. договор','Прочие','ОХР (ВСИП+ТТ)',
  ];

  const SKIP = new Set([
    'Перевод между счетами (поступление)',
    'Перевод между счетами (списание)',
    'Расходы на услуги банков',
    'Получение кредита',
    'Тесты и испытания',
    'Услуги по сертификации',
    'Составление исполнительной документации',
  ]);
  const INC_TYPES = new Set([
    'Оказание услуг','Возврат ДС. за заказы','Проценты к получению',
  ]);
  const EXP_PROJ = new Set(['Командировки']);

  function isIncome(t) { return INC_TYPES.has(t); }

  function isExpense(t, proj) {
    if (SKIP.has(t)) return false;
    const l = t.toLowerCase();
    if (proj === 'ОХР (ВСИП+ТТ)') return true;
    if (proj === 'Прочие' && t === 'Возвраты клиентам') return true;
    return (
      l.startsWith('материал') || l.startsWith('смр') ||
      (l.includes('банков') && l.includes('гарант')) ||
      l.includes('проектирован') || l.includes('изыскан') ||
      l.includes('оборудован') || l.includes('мобилизац') ||
      EXP_PROJ.has(t)
    );
  }

  const MS = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
  const PM = ['Июл','Авг','Сен','Окт','Ноя','Дек'];

  const parseAmt = h =>
    parseFloat(String(h||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,'')
      .replace(/\s/g,'').replace(',','.').replace(/[^\d.]/g,'')) || 0;

  const getLabel = c7 => {
    const m = String(c7||'').replace(/<[^>]+>/g,'').trim().match(/;\s*(.+)$/);
    return m ? m[1].trim() : '';
  };

  const getYear = c0 => {
    const s = String(c0);
    return s.length < 10 ? 0
      : (s.charCodeAt(6)-48)*1000+(s.charCodeAt(7)-48)*100
        +(s.charCodeAt(8)-48)*10+(s.charCodeAt(9)-48);
  };

  const getMonth = c0 => {
    const s = String(c0);
    return s.length < 5 ? 0 : (s.charCodeAt(3)-48)*10+(s.charCodeAt(4)-48);
  };

  function fmtK(v, bold=false, resColor=false) {
    if (!v) {
      const c = resColor ? '#6b7280' : '#ccc';
      return `<span style="color:${c}">—</span>`;
    }
    const parts = (Math.abs(v)/1000).toFixed(1).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    const s = parts.join('.');
    if (resColor) {
      const c = v >= 0 ? '#6ee7b7' : '#fca5a5';
      return v < 0
        ? `<strong style="color:${c}">(${s})</strong>`
        : `<strong style="color:${c}">${s}</strong>`;
    }
    const neg = v < 0;
    const wrapped = neg ? `(${s})` : s;
    const style = neg ? ' style="color:#dc2626"' : '';
    return bold ? `<strong${style}>${wrapped}</strong>` : `<span${style}>${wrapped}</span>`;
  }

  // Определяем базовый URL Аспро: виджет грузится в iframe на том же домене
  const BASE = window.location.origin;

  async function fetchPlanMoney(curYear, curMonth) {
    const all = []; let page = 1;
    while (true) {
      const r = await fetch(
        `${BASE}/api/v1/module/fin/plan_money/list/?limit=100&page=${page}`,
        { credentials:'include', headers:{'X-Requested-With':'XMLHttpRequest'} }
      );
      if (!r.ok) break;
      const d = await r.json();
      const items = d.response?.items || [];
      all.push(...items);
      if (all.length >= (d.response?.total||0) || items.length < 100) break;
      page++;
    }

    const pm = {};
    for (const p of PROJECTS)
      pm[p] = { bi_plan:0, be_plan:0, hI:0, hE:0, plan_i:[0,0,0,0,0,0], plan_e:[0,0,0,0,0,0] };

    for (const item of all) {
      const proj = PID_MAP[item.project_id];
      if (!proj || !item.plan_paid_date) continue;
      const iy = parseInt(item.plan_paid_date.substring(0,4));
      const im = parseInt(item.plan_paid_date.substring(5,7));
      if (iy < curYear) continue;
      const val = item.total || 0;
      const isI = item.type === 30, isE = item.type === 40;
      if (item.org_account_id !== 36) continue;
      if (iy > curYear || im >= curMonth) {
        if (isI) pm[proj].bi_plan += val;
        if (isE) pm[proj].be_plan += val;
      }
      if (iy === curYear && im === curMonth) {
        if (isI) pm[proj].hI += val;
        if (isE) pm[proj].hE += val;
      }
      if (iy === curYear && im >= 7 && im <= 12) {
        const idx = im - 7;
        if (isI) pm[proj].plan_i[idx] += val;
        if (isE) pm[proj].plan_e[idx] += val;
      }
    }
    return pm;
  }

  async function fetchTxns(from, to) {
    const all = []; let offset = 0;
    while (true) {
      const r = await fetch(`${BASE}/_module/fin/rest/transaction/list/`, {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'},
        body: new URLSearchParams({ date_from:from, date_to:to, sort:'date', order:'asc', offset, limit:2500 }),
      });
      if (!r.ok) break;
      const d = await r.json();
      const rows = d.data || [];
      all.push(...rows);
      if (all.length >= (d.recordsTotal||0) || rows.length < 2500) break;
      offset += 2500;
    }
    return all;
  }

  function calcFact(rows, curYear, curMonth) {
    const acc = {};
    for (const p of PROJECTS)
      acc[p] = { i25:0, e25:0, i26:0, e26:0, iCur:0, eCur:0 };
    for (const row of rows) {
      const yr = getYear(row[0]), mo = getMonth(row[0]);
      if (yr !== curYear && yr !== curYear-1) continue;
      const incAmt = parseAmt(row[1]), expAmt = parseAmt(row[2]);
      const typeName = String(row[9]||'').trim();
      const label = getLabel(row[7]);
      const proj = LABEL_MAP[label];
      if (!proj) continue;
      const a = acc[proj];
      const isCur = yr===curYear && mo===curMonth;
      const isPrev = yr===curYear-1;
      if (incAmt > 0 && isIncome(typeName)) {
        if (isPrev) a.i25+=incAmt; else { a.i26+=incAmt; if(isCur) a.iCur+=incAmt; }
      }
      if (expAmt > 0 && isExpense(typeName, proj)) {
        if (isPrev) a.e25+=expAmt; else { a.e26+=expAmt; if(isCur) a.eCur+=expAmt; }
      }
    }
    return acc;
  }

  function buildTable(acc, pm, curYear, curMonth) {
    const curMon = MS[curMonth-1], prevYear = curYear-1;
    const SEP = ';border-left:2px solid #3d5c7a';
    const BT  = ';border-top:2px solid #c5cfe8';
    const BT2 = ';border-top:2px solid #4a6a8a';
    const BL2 = ';border-left:2px solid #4a6a8a';
    const TH  = (v,s='') => `<th style="padding:5px 6px;text-align:right;border-bottom:2px solid #3d5c7a;font-size:10px;font-weight:600;white-space:nowrap${s}">${v}</th>`;
    const THl = (v,s='') => `<th style="padding:5px 6px;text-align:left;border-bottom:2px solid #3d5c7a;font-size:10px;font-weight:600${s}">${v}</th>`;
    const TD  = (v,s='') => `<td style="padding:2px 6px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap${s}">${v}</td>`;
    const TDl = (v,s='') => `<td style="padding:2px 6px;border-bottom:1px solid #f0f0f0;white-space:nowrap${s}">${v}</td>`;

    function getBudget(p, type) {
      const a=acc[p], d=pm[p];
      return type==='inc'
        ? a.i25+(a.i26-a.iCur)+d.bi_plan
        : a.e25+(a.e26-a.eCur)+d.be_plan;
    }

    function totals(type) {
      const t={b:0,f25:0,f26:0,fCur:0,fH:0,plan:[0,0,0,0,0,0]};
      for (const p of PROJECTS) {
        const d=pm[p],a=acc[p];
        t.b+=getBudget(p,type);
        t.f25+=type==='inc'?a.i25:a.e25;
        t.f26+=type==='inc'?a.i26:a.e26;
        t.fCur+=type==='inc'?a.iCur:a.eCur;
        t.fH+=type==='inc'?d.hI:d.hE;
        for(let i=0;i<6;i++) t.plan[i]+=type==='inc'?d.plan_i[i]:d.plan_e[i];
      }
      t.fact=t.f25+t.f26; t.ost=t.b-t.fact;
      return t;
    }

    function pRow(p, type) {
      const d=pm[p],a=acc[p];
      const b=getBudget(p,type);
      const f25=type==='inc'?a.i25:a.e25, f26=type==='inc'?a.i26:a.e26;
      const fCur=type==='inc'?a.iCur:a.eCur, h=type==='inc'?d.hI:d.hE;
      const plan=type==='inc'?d.plan_i:d.plan_e;
      const fact=f25+f26, ost=b-fact;
      if(!b&&!fact&&plan.every(x=>!x)) return '';
      return `<tr>
        ${TDl(p)}
        ${TD(fmtK(b),';color:#9ca3af')}
        ${TD(fmtK(f25),SEP)}${TD(fmtK(f26))}
        ${TD(fmtK(fact,true),';font-weight:600')}
        ${TD(fmtK(ost),ost<0?';color:#dc2626':'')}
        ${TD(fmtK(h),SEP)}${TD(fmtK(fCur))}
        ${plan.map((v,i)=>TD(fmtK(v),i===0?SEP:'')).join('')}
      </tr>`;
    }

    function totRow(label, t, bg='#eef2ff') {
      const ost=t.b-t.fact;
      return `<tr style="background:${bg}">
        ${TDl(`<strong>${label}</strong>`,BT)}
        ${TD(fmtK(t.b,true),';color:#9ca3af'+BT)}
        ${TD(fmtK(t.f25,true),SEP+BT)}${TD(fmtK(t.f26,true),BT)}
        ${TD(fmtK(t.fact,true),BT)}
        ${TD(fmtK(ost,true),(ost<0?';color:#dc2626':'')+BT)}
        ${TD(fmtK(t.fH,true),SEP+BT)}${TD(fmtK(t.fCur,true),BT)}
        ${t.plan.map((v,i)=>TD(fmtK(v,true),(i===0?SEP:'')+BT)).join('')}
      </tr>`;
    }

    const ti=totals('inc'), te=totals('exp');
    const res={
      b:ti.b-te.b, f25:ti.f25-te.f25, f26:ti.f26-te.f26,
      fact:ti.fact-te.fact, ost:(ti.b-ti.fact)-(te.b-te.fact),
      fH:ti.fH-te.fH, fCur:ti.fCur-te.fCur,
      plan:ti.plan.map((v,i)=>v-te.plan[i]),
    };

    return `<table style="width:100%;border-collapse:collapse;font-size:11px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <thead>
        <tr style="background:#1e3a5f;color:#a8c4e0;font-size:9px">
          <td style="padding:2px 6px;min-width:120px"></td><td></td>
          <td colspan="4" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">ФАКТ</td>
          <td colspan="2" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">Тек. месяц (${curMon})</td>
          <td colspan="6" style="padding:2px 6px;text-align:center;border-left:2px solid #3d5c7a">▶ План</td>
        </tr>
        <tr style="background:#1e3a5f;color:#fff">
          ${THl('Проект',';min-width:120px;max-width:140px')}
          ${TH('Бюджет',';color:#a8c4e0')}
          ${TH(prevYear,SEP+';color:#a8c4e0')}
          ${TH(`${curYear}<br><span style="font-weight:400;font-size:9px">янв–${curMon.toLowerCase()}</span>`)}
          ${TH('Итого')}${TH('Остаток')}
          ${TH('Бюджет',SEP)}${TH('Факт')}
          ${PM.map((m,i)=>TH(m,i===0?SEP:'')).join('')}
        </tr>
      </thead>
      <tbody>
        <tr style="background:#dce7f5">
          <td colspan="14" style="padding:4px 8px;font-weight:700;font-size:11.5px;color:#1e3a5f;border-bottom:1px solid #c5cfe8">ДОХОДЫ</td>
        </tr>
        ${PROJECTS.map(p=>pRow(p,'inc')).join('')}
        ${totRow('ИТОГО ДОХОДЫ',ti)}
        <tr style="background:#fae8e8">
          <td colspan="14" style="padding:4px 8px;font-weight:700;font-size:11.5px;color:#7f1d1d;border-bottom:1px solid #fca5a5">РАСХОДЫ</td>
        </tr>
        ${PROJECTS.map(p=>pRow(p,'exp')).join('')}
        ${totRow('ИТОГО РАСХОДЫ',te,'#fef2f2')}
        <tr style="background:#1e3a5f">
          ${TDl('<strong style="color:#fff">РЕЗУЛЬТАТ</strong>',BT2)}
          ${TD(fmtK(res.b,false,true),BT2)}
          ${TD(fmtK(res.f25,false,true),BL2+BT2)}${TD(fmtK(res.f26,false,true),BT2)}
          ${TD(fmtK(res.fact,false,true),BT2)}${TD(fmtK(res.ost,false,true),BT2)}
          ${TD(fmtK(res.fH,false,true),BL2+BT2)}${TD(fmtK(res.fCur,false,true),BT2)}
          ${res.plan.map((v,i)=>TD(fmtK(v,false,true),(i===0?BL2:'')+BT2)).join('')}
        </tr>
      </tbody>
    </table>`;
  }

  let loading = false;

  async function load() {
    if (loading) return;
    loading = true;
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const now = new Date(), yr = now.getFullYear(), mo = now.getMonth()+1;
    const from = `${yr-1}-01-01`;
    const to = `${yr}-${String(mo).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    statusEl.textContent = '● загрузка...';
    statusEl.style.color = '#d97706';
    contentEl.innerHTML = '<div style="padding:20px;text-align:center;color:#6b7280">⏳ Загружаем данные...</div>';
    try {
      const t0 = Date.now();
      const [txns, pm] = await Promise.all([fetchTxns(from, to), fetchPlanMoney(yr, mo)]);
      const acc = calcFact(txns, yr, mo);
      contentEl.innerHTML = buildTable(acc, pm, yr, mo);
      statusEl.textContent = `● live · ${now.toLocaleDateString('ru-RU')} · ${txns.length}\u00a0тр. · ${((Date.now()-t0)/1000).toFixed(0)}с`;
      statusEl.style.color = '#059669';
    } catch(err) {
      contentEl.innerHTML = `<div style="padding:16px;color:#dc2626">❌ Ошибка: ${err.message}</div>`;
      statusEl.textContent = '● ошибка';
      statusEl.style.color = '#dc2626';
    }
    loading = false;
  }

  document.getElementById('refresh-btn').addEventListener('click', () => { loading=false; load(); });
  load();
})();
</script>
</body>
</html>
